<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一個生命體的宇宙</title>
<style>
  :root{
    --bg:#03040a; --ink:#e9e6f2; --dim:#8c88a3; --faint:#4a4760;
    --glass:rgba(14,14,30,.62); --line:rgba(180,170,255,.14);
    --serif:"Songti TC","Noto Serif TC","PMingLiU",serif;
    --sans:"PingFang TC","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  canvas{position:fixed;inset:0;display:block;cursor:grab;touch-action:pinch-zoom}
  canvas.dragging{cursor:grabbing}
  .ui{position:fixed;z-index:5}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* header */
  #title{top:22px;left:28px;pointer-events:none}
  #title h1{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.18em}
  #title p{color:var(--dim);font-size:12px;letter-spacing:.12em;margin-top:6px}
  #home{top:84px;left:414px;z-index:25;display:inline-flex;align-items:center;min-height:34px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);color:var(--dim);font-size:11px;letter-spacing:.1em;text-decoration:none;transition:color .2s,border-color .2s,transform .2s}
  #home:hover{color:var(--ink);border-color:rgba(220,210,255,.45);transform:translateY(-1px)}
  #home:active{transform:translateY(0) scale(.97)}
  #stats{top:24px;right:28px;text-align:right;color:var(--dim);font-size:12px;letter-spacing:.08em;line-height:1.9}
  #stats b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

  /* view switch */
  #views{top:84px;left:28px;display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(10px)}
  #views button{padding:6px 14px;border-radius:999px;font-size:12px;letter-spacing:.1em;color:var(--dim);transition:.25s}
  #views button.on{background:rgba(200,190,255,.14);color:var(--ink)}
  #reset{top:84px;left:290px;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);font-size:12px;letter-spacing:.1em;color:var(--dim);transition:color .3s,border-color .3s,box-shadow .3s}
  #reset svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s}
  #reset:hover{color:var(--ink);border-color:rgba(220,210,255,.45)}
  #reset:hover svg{transform:rotate(-200deg)}
  #reset.dirty{color:#ffd38a;border-color:rgba(255,211,138,.6);box-shadow:0 0 18px rgba(255,211,138,.18)}
  #reset:active{transform:scale(.97)}

  /* view description */
  #viewdesc{left:30px;top:126px;width:250px;font-size:11.5px;line-height:1.75;color:var(--dim);letter-spacing:.04em}
  /* mixer: memory tracks with solo / mute */
  #mixer{left:28px;top:196px;width:252px;font-size:12px;color:var(--dim);background:rgba(10,10,24,.5);border:1px solid var(--line);border-radius:12px;padding:10px 12px 9px;backdrop-filter:blur(8px)}
  #mixer .mhead{display:flex;align-items:center;gap:6px;margin-bottom:7px;font-size:10px;letter-spacing:.24em;color:var(--faint)}
  #mixer .mhead span{margin-right:auto}
  #mixer .mhead button{padding:2px 8px;border:1px solid var(--line);border-radius:4px;font-size:10px;letter-spacing:.12em;color:var(--dim);transition:.2s}
  #mixer .mhead button:hover{color:var(--ink);border-color:rgba(220,210,255,.45)}
  .trk{display:grid;grid-template-columns:3px 1fr 40px 22px 20px 20px;align-items:center;gap:7px;padding:3px 0;transition:opacity .25s}
  .trk .bar{width:3px;height:15px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
  .trk .nm{cursor:pointer;color:#d2cde6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trk .meter{position:relative;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
  .trk .meter b{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.35;border-radius:2px}
  .trk .meter u{position:absolute;inset:0;background:linear-gradient(90deg,var(--c),#fff);opacity:0;transform-origin:left;transform:scaleX(.2)}
  .trk .n{color:var(--faint);font-variant-numeric:tabular-nums;text-align:right;font-size:11px}
  .trk button{width:20px;height:18px;border-radius:3px;font-size:10px;font-weight:600;border:1px solid rgba(255,255,255,.14);color:var(--faint);font-family:ui-monospace,Menlo,monospace;transition:.15s}
  .trk button:hover{color:var(--ink);border-color:rgba(255,255,255,.35)}
  .trk button.m.on{background:#3d7bff;border-color:#3d7bff;color:#fff;box-shadow:0 0 10px rgba(61,123,255,.5)}
  .trk button.s.on{background:#ffcc33;border-color:#ffcc33;color:#1a1400;box-shadow:0 0 10px rgba(255,204,51,.5)}
  .trk.silent{opacity:.32}
  #mixer .mfoot{margin-top:7px;font-size:10px;color:var(--faint);letter-spacing:.06em;line-height:1.6}
  /* chrome that fades in fullscreen when the mouse rests */
  .chrome{transition:opacity .8s}
  body.fs.idle .chrome{opacity:0;pointer-events:none}
  body.fs.idle canvas{cursor:none}
  #fs{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--dim)}
  #fs:hover{color:var(--ink)}
  #fs svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  body.fs #fs .enter, body:not(.fs) #fs .exit{display:none}

  /* gravity list */
  #gwrap{right:28px;top:116px;width:230px;display:flex;flex-direction:column;align-items:flex-end}
  #gtoggle{display:inline-flex;gap:8px;align-items:center;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--glass);font-size:12px;color:var(--dim);letter-spacing:.12em;backdrop-filter:blur(10px);transition:.25s;max-width:230px}
  #gtoggle:hover{color:var(--ink);border-color:rgba(220,210,255,.4)}
  #gtoggle em{font-style:normal;color:#ffe2b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #gtoggle svg{width:9px;height:9px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .3s}
  #gwrap.open #gtoggle svg{transform:rotate(180deg)}
  #gravity{width:230px;margin-top:10px;font-size:12px;scrollbar-width:none;max-height:0;overflow:hidden;opacity:0;transition:max-height .5s ease,opacity .35s}
  #gwrap.open #gravity{max-height:calc(100vh - 280px);overflow:auto;opacity:1;background:rgba(10,10,24,.5);border:1px solid var(--line);border-radius:12px;padding:12px 16px;backdrop-filter:blur(8px)}
  #gravity::-webkit-scrollbar{display:none}
  #gravity h3,#detail h3.sec{font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.2em;margin:14px 0 6px}
  #gravity h3:first-child{margin-top:0}
  #gravity button{display:flex;width:100%;justify-content:space-between;padding:4px 8px;margin:0 -8px;border-radius:6px;color:var(--dim);transition:.2s}
  #gravity button:hover,#gravity button.on{background:rgba(200,190,255,.1);color:var(--ink)}
  #gravity button span:last-child{color:var(--faint);font-variant-numeric:tabular-nums}

  /* timeline */
  #timeline{left:50%;transform:translateX(-50%);bottom:26px;width:min(760px,calc(100vw - 56px));display:flex;align-items:center;gap:16px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 20px 10px 10px;backdrop-filter:blur(10px)}
  #play{width:34px;height:34px;border-radius:50%;background:rgba(200,190,255,.14);display:grid;place-items:center;flex:none}
  #play svg{width:12px;height:12px;fill:var(--ink)}
  #track{position:relative;flex:1;height:34px;cursor:pointer}
  #track .rail{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
  #track .fill{position:absolute;left:0;top:50%;height:1px;background:linear-gradient(90deg,#6d5cff,#ffd38a)}
  #track .knob{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}
  #track .tick{position:absolute;top:50%;width:1px;height:6px;margin-top:-3px;background:var(--faint)}
  #track .yr{position:absolute;top:calc(50% + 7px);font-size:10px;color:var(--faint);transform:translateX(-50%);font-variant-numeric:tabular-nums}
  #track .hist{position:absolute;bottom:50%;width:3px;margin-left:-1.5px;background:rgba(200,190,255,.28);border-radius:2px 2px 0 0}
  #year{font-family:var(--serif);font-size:20px;min-width:58px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.05em}

  /* narration */
  #caption{left:50%;bottom:104px;transform:translateX(-50%);width:min(640px,calc(100vw - 56px));text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s}
  #caption.show{opacity:1}
  #caption .era{font-size:11px;letter-spacing:.32em;color:#ffd38a;margin-bottom:10px}
  #caption .txt{font-family:var(--serif);font-size:17px;line-height:1.9;color:var(--ink);text-shadow:0 0 18px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.9)}

  /* tooltip */
  #tip{pointer-events:none;padding:9px 12px;background:rgba(8,8,20,.86);border:1px solid var(--line);border-radius:8px;font-size:12px;max-width:260px;opacity:0;transition:opacity .15s;backdrop-filter:blur(6px)}
  #tip.show{opacity:1}
  #tip .t{font-size:13px;color:var(--ink);margin-bottom:3px}
  #tip .m{color:var(--dim);font-size:11px}

  /* detail panel */
  #detail{--detail-pad:30px;top:0;right:0;bottom:0;width:min(380px,100vw);background:rgba(8,8,22,.86);border-left:1px solid var(--line);backdrop-filter:blur(16px);padding:0 var(--detail-pad) 30px;overflow:auto;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:8}
  #detail:not(.open){pointer-events:none}
  #detail.open{transform:none}
  #detail{transition:transform .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1),padding .45s}
  #detail.reading{--detail-pad:clamp(20px,7vw,52px);width:min(720px,100vw);padding-bottom:64px}
  #detail.restoring-list{transition-property:transform}
  #detail .detail-toolbar{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;margin-inline:calc(-1 * var(--detail-pad));padding-inline:var(--detail-pad) 8px;background:#0b0b1a}
  #detail .list-back{min-height:44px;color:#cfcae2;font-size:13px;letter-spacing:.08em}
  #detail .list-back:hover{color:#fff}
  #detail .readbtn{margin-top:20px;display:inline-flex;gap:10px;align-items:center;padding:9px 18px;border:1px solid rgba(220,210,255,.3);border-radius:999px;font-size:13px;letter-spacing:.14em;color:var(--ink);transition:.25s}
  #detail .readbtn:hover{background:rgba(220,210,255,.1);border-color:rgba(220,210,255,.6)}
  #detail .readbtn small{color:var(--faint);letter-spacing:.06em;font-size:11px}
  #detail .back{font-size:12px;color:var(--dim);letter-spacing:.14em;margin-bottom:20px}
  #detail .back:hover{color:var(--ink)}
  #detail .meta{font-size:11px;color:var(--faint);letter-spacing:.14em;margin:-2px 0 26px}
  .article{font-family:var(--serif);font-size:16.5px;line-height:2.05;color:#dedaf0;letter-spacing:.02em;word-break:break-word}
  .article p{margin:0 0 1.15em}
  .article h2,.article h3,.article h4{font-weight:400;color:#fff;margin:1.6em 0 .6em;line-height:1.5}
  .article h2{font-size:20px}.article h3{font-size:18px}.article h4{font-size:16px}
  .article strong{color:#fff;font-weight:600}
  .article blockquote{border-left:2px solid rgba(255,214,160,.5);padding:2px 0 2px 16px;margin:0 0 1.1em;color:#d8cfbd}
  .article ul,.article ol{margin:0 0 1.15em 1.4em}
  .article li{margin:.25em 0}
  .article hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
  .article pre{background:rgba(255,255,255,.04);padding:12px 14px;border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.6;margin:0 0 1.2em;white-space:pre-wrap}
  .article code{font-family:ui-monospace,Menlo,monospace;font-size:.88em}
  .article a{color:#c3b8ff}
  .article .img{color:var(--faint);font-size:.85em}
  #detail .nav{display:flex;justify-content:space-between;gap:16px;margin:36px 0 6px;padding-top:18px;border-top:1px solid var(--line)}
  #detail .nav button{font-size:13px;color:var(--dim);text-align:left;max-width:48%;line-height:1.6;font-family:var(--serif)}
  #detail .nav button.next{text-align:right;margin-left:auto}
  #detail .nav button:hover{color:var(--ink)}
  #detail .nav small{display:block;color:var(--faint);letter-spacing:.14em;font-family:var(--sans);font-size:11px}
  #sound{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--dim);transition:color .2s}
  #sound:hover{color:var(--ink)}
  #sound svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  #sound.off .wave{display:none}
  #sound:not(.off) .x{display:none}
  #prologue .note{margin-top:20px;font-size:11px;color:var(--faint);letter-spacing:.2em}
  #detail .close{margin-left:auto;width:44px;height:44px;color:var(--dim);font-size:20px;line-height:1}
  #detail .kicker{font-size:11px;letter-spacing:.24em;color:var(--dim);display:flex;align-items:center;gap:8px}
  #detail .kicker i{width:8px;height:8px;border-radius:50%;display:inline-block}
  #detail h2{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.5;margin:12px 0 10px}
  #detail .sum{font-family:var(--serif);font-size:15px;line-height:1.9;color:#d6d2e8}
  #detail .secret{margin-top:20px;padding:14px 16px;border:1px dashed rgba(220,210,255,.25);border-radius:12px;font-size:13px;letter-spacing:.14em;color:var(--dim);line-height:1.8}
  #detail .secret b{display:block;font-weight:400;font-family:var(--serif);font-size:15px;color:var(--ink);letter-spacing:.3em;margin-bottom:4px}
  #detail .secret i{font-style:normal;color:var(--faint);letter-spacing:.02em;word-break:break-all}
  #detail .mood{display:inline-block;margin-top:14px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--dim);letter-spacing:.15em}
  #detail .chips{display:flex;flex-wrap:wrap;gap:6px}
  #detail .chips button{padding:4px 10px;border-radius:999px;background:rgba(200,190,255,.08);font-size:12px;color:var(--dim);transition:.2s}
  #detail .chips button:hover{background:rgba(200,190,255,.18);color:var(--ink)}
  #detail .list button{display:block;width:100%;text-align:left;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;color:#cfcae2}
  #detail .list button:hover{color:#fff}
  #detail .list small{color:var(--faint);font-variant-numeric:tabular-nums;margin-right:8px}
  #detail .path{margin-top:22px;font-size:11px;color:var(--faint);word-break:break-all}

  /* prologue */
  #prologue{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(3,4,10,.55),rgba(3,4,10,.96) 70%);transition:opacity 1.6s}
  #prologue.gone{opacity:0;pointer-events:none}
  #prologue .box{max-width:560px;padding:0 28px;text-align:center}
  #prologue .k{font-size:11px;letter-spacing:.4em;color:var(--dim)}
  #prologue h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4.4vw,42px);letter-spacing:.14em;margin:22px 0 28px;line-height:1.5}
  #prologue p{font-family:var(--serif);font-size:16px;line-height:2.1;color:#cfcae2}
  #prologue .sig{margin-top:18px;color:var(--dim);font-size:13px}
  #prologue .go{margin-top:38px;display:inline-flex;gap:14px}
  #prologue .go button{padding:11px 26px;border:1px solid rgba(220,210,255,.3);border-radius:999px;letter-spacing:.24em;font-size:13px;transition:.3s}
  #prologue .go button:hover{background:rgba(220,210,255,.1);border-color:rgba(220,210,255,.6)}
  #prologue .go button.ghost{border-color:transparent;color:var(--dim)}

  #hint{left:50%;transform:translateX(-50%);bottom:82px;font-size:11px;color:var(--faint);letter-spacing:.14em;pointer-events:none;transition:opacity 1s}
  body.embed .ui, body.embed #prologue{display:none!important}
  body.embed canvas{cursor:default}
  @media (max-width:820px){#gwrap,#mixer,#viewdesc{display:none}#stats{display:none}#title{top:18px;left:16px;max-width:220px}#title h1{font-size:19px}#home{top:17px;right:16px;left:auto;min-height:30px;padding:5px 11px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="ui chrome"><h1 id="metaTitle">一個生命體的宇宙</h1><p id="metaSub"></p></div>
<a id="home" class="ui chrome" href="../index.html" aria-label="返回 Life Cosmos 專案首頁">← 專案首頁</a>
<div id="stats" class="ui chrome"></div>
<div id="views" class="ui chrome">
  <button data-v="galaxy" class="on">時間銀河</button>
  <button data-v="constellation">主題星座</button>
  <button data-v="gravity">恆星系</button>
</div>
<button id="reset" class="ui chrome" title="回到原本的宇宙（R）"><svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.5 2.5v3h3"/></svg>還原宇宙</button>
<div id="viewdesc" class="ui chrome"></div>
<div id="mixer" class="ui chrome">
  <div class="mhead"><span>記憶軌道</span><button data-all="on" title="全部打開">全開</button><button data-all="off" title="全部關掉，再一軌一軌打開">全關</button></div>
  <div id="tracks"></div>
  <div class="mfoot">S 獨奏（可多軌疊加，⌥ 點擊只留這一軌）· M 靜音 · 點軌名＝開／關</div>
</div>
<div id="gwrap" class="ui chrome"><button id="gtoggle" aria-expanded="false"><span>引力中心</span><em></em><svg viewBox="0 0 10 10"><path d="M1.5 3.5L5 7l3.5-3.5"/></svg></button><div id="gravity"></div></div>
<div id="caption" class="ui"><div class="era"></div><div class="txt"></div></div>
<div id="hint" class="ui chrome">拖曳旋轉 · 滾輪朝游標縮放 · Shift／右鍵拖曳平移 · 雙擊星星飛近 · R 還原宇宙 · F 全螢幕</div>
<div id="timeline" class="ui chrome">
  <button id="play" aria-label="播放"><svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg></button>
  <div id="track"><div class="rail"></div><div class="fill"></div><div class="knob"></div></div>
  <div id="year">2026</div>
  <button id="sound" aria-label="聲音開關" title="聲音（全部即時合成）"><svg viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path class="wave" d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6.3 6.3 0 0 1 0 9"/><path class="x" d="M11 6l4 4M15 6l-4 4"/></svg></button>
  <button id="fs" aria-label="全螢幕" title="全螢幕（F）"><svg viewBox="0 0 16 16"><path class="enter" d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/><path class="exit" d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg></button>
</div>
<div id="tip" class="ui"></div>
<aside id="detail" class="ui">
  <div class="detail-toolbar">
    <button type="button" id="detailListBack" class="list-back" hidden>‹ 返回列表</button>
    <button type="button" class="close" aria-label="關閉">×</button>
  </div>
  <div id="dbody"></div>
</aside>

<div id="prologue">
  <div class="box">
    <div class="k">A LIFE, SEEN FROM VERY FAR AWAY</div>
    <h1 id="proTitle">一個生命體的宇宙</h1>
    <p id="prologueText"></p>
    <div class="sig" id="prologueSig"></div>
    <div class="go"><button id="begin">從大爆炸開始</button><button id="skip" class="ghost">直接看全貌</button></div>
    <div class="go" style="margin-top:12px"><button id="fsgo" class="ghost">⛶ 全螢幕進入宇宙</button></div>
    <div class="note">聲音由瀏覽器即時合成 · 建議戴耳機</div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/;
</script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);

const CAT = DATA.categories;           // {key:{label,color}}

/* ---------- sound: everything synthesized live with Web Audio ---------- */
const SND = (()=>{
  let ac=null, master=null, send=null, padFilter=null, padBus=null, sub=null, pad=[];
  // browser storage may be refused (a page opened from disk, a private window): the sound switch then just isn't remembered
  const store={ get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
  let on = store.get('cosmosSound')!=='off', lastPing=0, lastHover=0, chordK=-1;
  const D2=73.42;
  const f=(semi,base=D2)=>base*Math.pow(2,semi/12);
  // one chord per era: Dm → B♭ → F → C → Dm9 → G … → open fifths at the end
  const CHORDS=[[0,7,12,15],[-4,3,8,14],[3,10,15,19],[-2,5,10,14],[0,7,14,17],[5,12,15,19],[-4,3,10,14],[3,10,14,19],[-2,7,12,17],[0,7,12,14],[0,12,19,24]];
  const SCALE=[0,3,5,7,10,12,14];                       // D minor pentatonic + 9th
  const REG={love:12,life:12,diary:12,thinkings:12,ideas:19,movie:19,meetings:19,teaching:24,tech:24,ai:24};
  function impulse(sec){const len=ac.sampleRate*sec|0, b=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}return b}
  function init(){
    if(ac) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ac=new AC();
    const comp=ac.createDynamicsCompressor(); comp.threshold.value=-20; comp.ratio.value=3; comp.connect(ac.destination);
    master=ac.createGain(); master.gain.value=on?.75:0; master.connect(comp);
    const verb=ac.createConvolver(); verb.buffer=impulse(3.6);
    const wet=ac.createGain(); wet.gain.value=.6; verb.connect(wet); wet.connect(master);
    const dry=ac.createGain(); dry.gain.value=.55; dry.connect(master);
    send=ac.createGain(); send.connect(verb); send.connect(dry);
    padFilter=ac.createBiquadFilter(); padFilter.type='lowpass'; padFilter.frequency.value=420; padFilter.Q.value=.6;
    padBus=ac.createGain(); padBus.gain.value=0; padFilter.connect(padBus); padBus.connect(send);
    const lfo=ac.createOscillator(), lfoG=ac.createGain(); lfo.frequency.value=.045; lfoG.gain.value=170;
    lfo.connect(lfoG); lfoG.connect(padFilter.frequency); lfo.start();
    CHORDS[0].forEach((semi,i)=>{ for(const det of [-7,7]){
      const o=ac.createOscillator(); o.type= i%2?'triangle':'sawtooth'; o.frequency.value=f(semi); o.detune.value=det;
      const g=ac.createGain(); g.gain.value= o.type==='sawtooth'? .03 : .055; o.connect(g); g.connect(padFilter); o.start(); pad.push({o,i}); } });
    sub=ac.createOscillator(); sub.type='sine'; sub.frequency.value=f(-12);
    const sg=ac.createGain(); sg.gain.value=.11; sub.connect(sg); sg.connect(padBus); sub.start();
    padBus.gain.setTargetAtTime(.5, ac.currentTime, 2.5);
    if(chordK>=0) chord(chordK,true);
  }
  function chord(k,silent){ chordK=k; if(!ac) return;
    const c=CHORDS[Math.max(0,Math.min(CHORDS.length-1,k))], t=ac.currentTime;
    pad.forEach(p=>p.o.frequency.setTargetAtTime(f(c[p.i]),t,1.4));
    sub.frequency.setTargetAtTime(f(c[0]-12),t,1.8);
    padFilter.frequency.setTargetAtTime(360+k*60,t,2.2);
    if(!silent) swell(); }
  function swell(){ if(!ac||!on) return; const t=ac.currentTime, len=2.8;
    const n=ac.createBufferSource(), b=ac.createBuffer(1,ac.sampleRate*len|0,ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; n.buffer=b;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.6;
    bp.frequency.setValueAtTime(180,t); bp.frequency.exponentialRampToValueAtTime(1600,t+len*.6); bp.frequency.exponentialRampToValueAtTime(260,t+len);
    const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.11,t+len*.55); g.gain.linearRampToValueAtTime(0,t+len);
    n.connect(bp); bp.connect(g); g.connect(send); n.start(t); n.stop(t+len); }
  // FM bell: a star igniting
  function bell(freq,{gain=.1,pan=0,decay=2,when=0,bright=1}={}){
    if(!ac||!on) return; const t=ac.currentTime+when;
    const car=ac.createOscillator(), mod=ac.createOscillator(), mg=ac.createGain(), g=ac.createGain();
    car.frequency.value=freq; mod.frequency.value=freq*2.01;
    mg.gain.setValueAtTime(freq*1.1*bright,t); mg.gain.exponentialRampToValueAtTime(1,t+decay*.6);
    mod.connect(mg); mg.connect(car.frequency);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+decay);
    car.connect(g);
    if(ac.createStereoPanner){const p=ac.createStereoPanner(); p.pan.value=Math.max(-1,Math.min(1,pan||0)); g.connect(p); p.connect(send);} else g.connect(send);
    car.start(t); mod.start(t); car.stop(t+decay+.05); mod.stop(t+decay+.05); }
  // each memory has its own note: register by kind of memory, degree by identity
  const noteFor=d=>f((REG[d.c]??12)+SCALE[(d.idx*5+(d.deg|0))%SCALE.length], 146.83);
  const panOf=x=>(x/W)*2-1;
  return {
    get on(){return on},
    resume(){ init(); if(ac&&ac.state==='suspended') ac.resume(); },
    toggle(){ on=!on; store.set('cosmosSound',on?'on':'off'); this.resume();
      if(master) master.gain.setTargetAtTime(on?.75:0,ac.currentTime,.25); return on; },
    birth(d){ const now=performance.now(); if(now-lastPing<65) return; lastPing=now;
      bell(noteFor(d),{gain:.06+Math.min(.05,d.deg*.003),pan:panOf(d.sx),decay:1.6+Math.random()*1.2}); },
    era(k){ chord(k); },
    hover(n,x){ const now=performance.now(); if(now-lastHover<110) return; lastHover=now;
      bell(n.t!==undefined? noteFor(n)*2 : 1174.66,{gain:.022,pan:panOf(x),decay:.45,bright:.25}); },
    select(d){ const r=noteFor(d); [1,1.5,2].forEach((m,i)=>bell(r*m,{gain:.065,pan:panOf(d.sx),decay:2.6,when:i*.08})); },
    thread(list){ list.slice(0,48).forEach((d,i)=>bell(noteFor(d),{gain:.055,pan:panOf(d.sx),decay:1.5,when:i*.1})); },
    whoosh(){ swell(); },
    tick(){ bell(1760,{gain:.018,decay:.12,bright:.15}); },
    page(){ bell(293.66,{gain:.045,decay:1.4,bright:.35}); bell(440,{gain:.035,decay:1.6,when:.07,bright:.35}); },
  };
})();

/* ---------- sprites ---------- */
const spriteCache = {};
function sprite(color, size=64){
  const k=color+size; if(spriteCache[k]) return spriteCache[k];
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d'), r=size/2;
  const grd=g.createRadialGradient(r,r,0,r,r,r);
  grd.addColorStop(0,'rgba(255,255,255,.95)');
  grd.addColorStop(.07,color);
  grd.addColorStop(.22,hexA(color,.55));
  grd.addColorStop(.5,hexA(color,.12));
  grd.addColorStop(1,hexA(color,0));
  g.fillStyle=grd; g.fillRect(0,0,size,size);
  return spriteCache[k]=c;
}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

/* ---------- background starfield ---------- */
let rng = mulberry(7);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const bgStars = Array.from({length:900},()=>({x:rng()*2-1,y:rng()*2-1,z:rng(),tw:rng()*6.28}));

/* ---------- layouts ---------- */
// Each doc gets 3 target positions (galaxy / constellation / gravity). We tween between them.
const R = 600;
const armCount=[0,0], armSeen=[0,0]; docs.forEach(d=>armCount[d.arm||0]++);
docs.forEach((d,i)=>{
  const t=(d.y-Y0)/(Y1-Y0);              // 0..1 across the life
  const a=d.arm||0, rank=(armSeen[a]++)/Math.max(1,armCount[a]-1);
  const arm = a*Math.PI;                   // two arms: inner life / outer work
  const theta = (t*.45 + rank*.55)*Math.PI*3.2 + arm + (rng()-.5)*.25;
  const r = 60 + Math.pow(t,.85)*R + (rng()-.5)*34;
  d.g = [Math.cos(theta)*r, Math.sin(theta)*r, (rng()-.5)*(18+t*30)];
  d.p = d.g.slice(); d.vis=0; d.idx=i;
});
// constellation: communities on a ring, docs around their centre
(function(){
  const comms = DATA.comms; const n = comms.length;
  const centers = {};
  comms.forEach((c,i)=>{
    const a = i/n*Math.PI*2 - Math.PI/2, rr = n>1 ? (n>10 ? 640 : 520) + (i%2)*150 : 0;
    centers[c.id] = [Math.cos(a)*rr, Math.sin(a)*rr, (i%3-1)*40];
  });
  const groups = {};
  docs.forEach(d=>{(groups[d.k]=groups[d.k]||[]).push(d)});
  Object.entries(groups).forEach(([k,list])=>{
    const c = centers[k] || [0,0,0];
    list.sort((a,b)=>a.y-b.y);
    list.forEach((d,j)=>{
      const a = j*2.39996, rr = 21*Math.sqrt(j+1);
      d.cn = [c[0]+Math.cos(a)*rr, c[1]+Math.sin(a)*rr, c[2]+(rng()-.5)*40];
    });
  });
  DATA.comms.forEach(c=>c.pos=centers[c.id]);
})();
// stellar system: the strongest gravity sources become suns; every memory orbits the sun that holds it most specifically
const SUN_QUOTA={theme:7,person:4,place:2,work:2,org:1};
const SUN_COLOR={theme:'#ffd38a',person:'#8fd0ff',place:'#a8f0c0',work:'#c9b6ff',org:'#ffb0a0'};
const suns=[]; let SUNSHARE=[]; const BRIDGES=new Set(); const ROGUE_R=820;
(function(){
  Object.entries(SUN_QUOTA).forEach(([t,n])=>ents.filter(e=>e.type===t).sort((a,b)=>b.docs.length-a.docs.length).slice(0,n).forEach(e=>suns.push(e)));
  suns.forEach((e,i)=>{e.isSun=true; e.sunIdx=i; e.docSet=new Set(e.docs); e.mass=e.docs.length;});
  const N=suns.length;
  // how much two suns share: memories held by both, normalised
  SUNSHARE=suns.map(a=>suns.map(b=>{ if(a===b) return 0; let c=0; for(const d of a.docs) if(b.docSet.has(d)) c++; return c/Math.sqrt(a.mass*b.mass); }));
  // sun layout: suns that share many memories settle close together
  const P=suns.map((e,i)=>({x:Math.cos(i/N*6.283)*420,y:Math.sin(i/N*6.283)*420,vx:0,vy:0}));
  for(let it=0;it<600;it++){ const al=1-it/600;
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
      const a=P[i],b=P[j], dx=b.x-a.x, dy=b.y-a.y, d=Math.max(1,Math.hypot(dx,dy));
      const rest=820-640*Math.min(1,SUNSHARE[i][j]*1.6);
      const f=((d-rest)/d*.012 - 90000/(d*d*d))*al;
      a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
    P.forEach(q=>{ q.vx-=q.x*.0015*al; q.vy-=q.y*.0015*al; q.x+=q.vx; q.y+=q.vy; q.vx*=.5; q.vy*=.5; });
  }
  let m=1; P.forEach(q=>m=Math.max(m,Math.hypot(q.x,q.y))); const k=600/m;
  suns.forEach((e,i)=>{ e.fp=[P[i].x*k, P[i].y*k, 0]; });
  // orbits
  const bySun=new Map(suns.map(x=>[x,[]])); const rogue=[];
  docs.forEach(d=>{
    const mine=suns.filter(x=>x.docSet.has(d.idx)).sort((a,b)=>a.mass-b.mass);   // the most specific sun pulls hardest
    if(!mine.length){ d.sun=null; rogue.push(d); return; }
    d.sun=mine[0]; d.suns=mine; bySun.get(d.sun).push(d);
  });
  bySun.forEach((list,sun)=>{
    list.sort((a,b)=>a.y-b.y);
    list.forEach((d,j)=>{
      const t=(d.y-Y0)/(Y1-Y0);
      d.orbR = 30 + Math.sqrt(sun.mass)*3.2 + t*78 + (j%3)*5;          // later memories ride wider orbits
      d.orbA = j*2.39996;
      d.orbW = 1.1/Math.pow(d.orbR/40,1.5);                            // Kepler: inner orbits run faster
      let bx=0,by=0; d.suns.slice(1).forEach(o=>{bx+=o.fp[0]-sun.fp[0]; by+=o.fp[1]-sun.fp[1]});
      const n=d.suns.length-1; d.bridge = n ? [bx/n*.34, by/n*.34] : [0,0];   // held by several suns → drifts onto the bridge
      d.orbZ=(rng()-.5)*16;
    });
  });
  rogue.sort((a,b)=>a.y-b.y).forEach((d,j)=>{
    const t=(d.y-Y0)/(Y1-Y0), a=t*Math.PI*1.96-Math.PI/2, rr=ROGUE_R+(j%4)*16;
    d.fp=[Math.cos(a)*rr, Math.sin(a)*rr, (rng()-.5)*20];
  });
  docs.forEach(d=>{ if(d.sun) d.fp=orbitPos(d,0); });
  // keep only each sun's three strongest bridges
  suns.forEach((_,i)=>SUNSHARE[i].map((v,j)=>[v,j]).filter(([v])=>v>=.15).sort((a,b)=>b[0]-a[0]).slice(0,3).forEach(([,j])=>BRIDGES.add(Math.min(i,j)+'-'+Math.max(i,j))));
})();
function orbitPos(d,t){ const s=d.sun, a=d.orbA + d.orbW*t*.22;
  return [s.fp[0]+d.bridge[0]+Math.cos(a)*d.orbR, s.fp[1]+d.bridge[1]+Math.sin(a)*d.orbR, d.orbZ]; }
// entity anchor positions per view = centroid of their docs, lifted
function entityPos(e, key){
  if(key==='fp' && e.isSun) return e.fp;
  if(key==='g'){
    let sx=0,sy=0; e.docs.forEach(i=>{const p=docs[i].g; const a=Math.atan2(p[1],p[0]); sx+=Math.cos(a); sy+=Math.sin(a)});
    const a=Math.atan2(sy,sx) + (rng()-.5)*.12;
    const rr = R + (e.type==='theme'? 190 : 100) + rng()*60;
    return [Math.cos(a)*rr, Math.sin(a)*rr, (e.type==='theme'? -40 : -15) - rng()*20];
  }
  let x=0,y=0,z=0; e.docs.forEach(i=>{const p=docs[i][key];x+=p[0];y+=p[1];z+=p[2]});
  const n=e.docs.length||1; x/=n;y/=n;z/=n;
  const push = key==='g'?1.12:1.18;
  if(key==='fp') return [x, y, z-40];
  return [x*push, y*push, z + (key==='g'? -90 - Math.min(80,e.docs.length*3) : -60)];
}
ents.forEach(e=>{e.g=entityPos(e,'g'); e.cn=entityPos(e,'cn'); e.fp=entityPos(e,'fp'); e.p=e.g.slice()});
ents.filter(e=>e.type==='theme').forEach((e,i)=>e.rank=i);

/* ---------- state ---------- */
const state = {
  view:'galaxy', yaw:-0.6, pitch:1.02, zoom:.74, tYaw:-0.6, tPitch:1.02, tZoom:.74, panX:0, panY:0, tPanX:0, tPanY:0,
  year:Y1, playing:false, hover:null, sel:null, focusEnt:null, listOrigin:null,
  autoRotate:true, t:0
};

/* ---------- projection ---------- */
function project(p){
  const cy=Math.cos(state.yaw), sy=Math.sin(state.yaw);
  let x=p[0]*cy - p[1]*sy, y=p[0]*sy + p[1]*cy, z=p[2];
  const cp=Math.cos(state.pitch), sp=Math.sin(state.pitch);
  const y2 = y*cp - z*sp, z2 = y*sp + z*cp;
  const cam = 2400;
  const s = 2400/(cam + z2) * state.zoom * Math.min(W,H)/1000;
  return [W/2 + state.panX + x*s, H/2 + state.panY + y2*s, s, z2];
}

/* ---------- interaction ---------- */
let drag=null, touchTap=null;
const VIEW_ZOOM={galaxy:.74, constellation:.5, gravity:.6};
const VIEW_PITCH={galaxy:1.02, constellation:.35, gravity:.42};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  if(drag || !e.isPrimary) return;
  touchTap=null;
  const pan = e.shiftKey || e.button===2 || e.button===1;
  const touch = e.pointerType==='touch';
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,yaw:state.tYaw,pitch:state.tPitch,
    px:state.tPanX,py:state.tPanY,pan,moved:false,slop:touch?8:3};
  if(touch) updateHover(null);
  cv.setPointerCapture(e.pointerId);
  cv.classList.add('dragging');
});
cv.addEventListener('pointermove',e=>{
  if(drag){
    if(drag.id!==e.pointerId) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!drag.moved && Math.hypot(dx,dy)<=drag.slop) return;
    drag.moved=true;
    if(drag.pan){ state.tPanX=drag.px+dx; state.tPanY=drag.py+dy; }
    else { state.tYaw=drag.yaw+dx*.005; state.tPitch=Math.max(0,Math.min(1.45,drag.pitch-dy*.004)); }
    state.autoRotate=false;
  }
  if(e.pointerType!=='touch') updateHover(starAt(e.clientX,e.clientY),e.clientX,e.clientY);
});
function zoomAt(mx,my,newZ){
  newZ=Math.max(.4,Math.min(8,newZ)); const k=newZ/state.tZoom;
  const cx=mx-W/2, cy=my-H/2;
  state.tPanX = cx-(cx-state.tPanX)*k; state.tPanY = cy-(cy-state.tPanY)*k; state.tZoom=newZ;
}
function resetCamera(){ state.tPanX=0; state.tPanY=0; state.tZoom=VIEW_ZOOM[state.view]; }
cv.addEventListener('dblclick',e=>{
  const n=starAt(e.clientX,e.clientY);
  if(n){ // fly to the star / gravity source
    const newZ=Math.max(state.tZoom*1.8, 3.2), k=newZ/state.zoom;
    state.tPanX = -(n.sx-W/2-state.panX)*k; state.tPanY = -(n.sy-H/2-state.panY)*k; state.tZoom=Math.min(8,newZ);
    state.autoRotate=false;
  } else { resetCamera(); state.autoRotate=true; }
});
function finishDrag(e){
  if(drag?.id!==e.pointerId) return null;
  const gesture=drag;
  drag=null;
  cv.classList.remove('dragging');
  return gesture;
}
cv.addEventListener('pointerup',e=>{
  const gesture=finishDrag(e);
  if(!gesture || e.button!==0 || gesture.moved || Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>gesture.slop) return;
  if(e.pointerType==='touch'){
    // Let the browser finish the tap before opening a panel under the finger.
    touchTap={id:e.pointerId,x:e.clientX,y:e.clientY,at:e.timeStamp};
  } else selectAt(e.clientX,e.clientY);
});
cv.addEventListener('click',e=>{
  const tap=touchTap;
  if(!tap) return;
  if(e.timeStamp-tap.at>700){ touchTap=null; return; }
  // Some browsers deliver the touch click as a MouseEvent without a pointer ID.
  if(typeof e.pointerId==='number' && (e.pointerId!==tap.id || e.pointerType!=='touch')) return;
  if(Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>2) return;
  touchTap=null;
  selectAt(tap.x,tap.y);
});
function selectAt(x,y){
  const star=starAt(x,y);
  if(star) select(star);
  else closeDetail();
}
cv.addEventListener('pointercancel',e=>{
  finishDrag(e);
  if(touchTap?.id===e.pointerId) touchTap=null;
});
cv.addEventListener('lostpointercapture',finishDrag);
cv.addEventListener('pointerleave',e=>{ if(e.pointerType!=='touch') updateHover(null); });
cv.addEventListener('wheel',e=>{e.preventDefault(); state.autoRotate=false; zoomAt(e.clientX,e.clientY,state.tZoom*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)))},{passive:false});
window.addEventListener('keydown',e=>{
  const reading=$('#detail').classList.contains('reading') && state.sel && state.sel.t!==undefined;
  if(reading && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ const n=docs[state.sel.idx+(e.key==='ArrowLeft'?-1:1)]; if(n){e.preventDefault(); openReader(n);} return; }
  if(e.key==='Escape'){
    if(state.listOrigin){ returnToList(); return; }
    if(reading){ select(state.sel); return; }
    closeDetail();setFocus(null);
  }
  if(e.key===' '&&e.target===document.body){e.preventDefault();togglePlay()}
});

const tip=$('#tip');
function starAt(mx,my){
  let best=null, bd=14*14;
  for(const d of docs){ if(!d.on||d.vis<.4) continue; const dx=d.sx-mx, dy=d.sy-my, dd=dx*dx+dy*dy; if(dd<bd){bd=dd;best=d} }
  for(const e of ents){ if(!e.visible) continue; const dx=e.sx-mx, dy=e.sy-my, dd=dx*dx+dy*dy; if(dd<bd){bd=dd;best=e} }
  return best;
}
function updateHover(best,mx,my){
  if(best && best!==state.hover){ SND.hover(best,mx); if(best.t!==undefined) mix.peak[best.c]=Math.max(mix.peak[best.c]||0,.55); }
  state.hover=best;
  if(best){
    tip.innerHTML = best.t!==undefined
      ? `<div class="t">${esc(best.t)}</div><div class="m">${best.d} · ${CAT[best.c]?.label||best.c}${best.m?' · '+esc(best.m):''}</div>`
      : `<div class="t">${esc(best.l)}</div><div class="m">${typeLabel(best.type)} · 出現在 ${best.docs.length} 段記憶</div>`;
    tip.style.left=Math.min(W-270,mx+16)+'px'; tip.style.top=(my+14)+'px'; tip.classList.add('show');
    cv.style.cursor='pointer';
  } else { tip.classList.remove('show'); cv.style.cursor=''; }
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typeLabel=t=>({person:'人物',place:'地方',org:'組織',work:'作品／工具',theme:'生命主題',concept:'概念'}[t]||t);

/* ---------- detail ---------- */
function select(n, {keepList=false} = {}){
  if(!keepList) state.listOrigin=null;
  $('#detailListBack').hidden=!state.listOrigin;
  state.sel=n;
  if(n.t!==undefined){ // doc
    const linked = (n.ents||[]).map(i=>ents[i]);
    const ech = echoes.filter(e=>e[0]===n.idx||e[1]===n.idx).map(e=>docs[e[0]===n.idx?e[1]:e[0]]).sort((a,b)=>a.y-b.y);
    $('#dbody').innerHTML = `
      <div class="kicker"><i style="background:${CAT[n.c]?.color}"></i>${CAT[n.c]?.label||n.c} · ${n.d}</div>
      <h2>${esc(n.t)}</h2>
      <div class="sum">${esc(n.s||'')}</div>
      ${n.m?`<div class="mood">${esc(n.m)}</div>`:''}
      ${n.b?`<div><button class="readbtn" data-read="${n.idx}">閱讀全文 <small>${n.b.replace(/\s/g,'').length} 字</small> ›</button></div>`:''}
      ${n.locked?`<div class="mood">這段記憶設有密語保護，全文沒有收進宇宙</div>`:''}
      ${n.secret?`<div class="secret"><b>全文秘密</b>${n.n?`${n.n} 字，只留在作者的電腦裡`:'全文只留在作者的電腦裡'}<br><i>${'▒'.repeat(Math.min(48,Math.max(12,Math.round((n.n||200)/40))))}</i></div>`:''}
      ${linked.length?`<h3 class="sec">牽引它的引力</h3><div class="chips">${linked.map(e=>`<button data-e="${ents.indexOf(e)}">${esc(e.l)}</button>`).join('')}</div>`:''}
      ${ech.length?`<h3 class="sec">跨時間的回聲</h3><div class="list">${ech.map(d=>`<button data-d="${d.idx}"><small>${d.d.slice(0,7)}</small>${esc(d.t)}</button>`).join('')}</div>`:''}
      <div class="path">星座：${esc(DATA.comms[n.k]?.label||'')}${n.gc?` · graphify 星團：${esc(n.gc)}`:''}${META.pathPrefix!=null&&n.f?`<br>${esc(META.pathPrefix)}${esc(n.f)}`:''}</div>`;
  } else {
    setFocus(n);
    const list = n.docs.map(i=>docs[i]).sort((a,b)=>a.y-b.y);
    const span = list.length? `${list[0].d.slice(0,4)} — ${list[list.length-1].d.slice(0,4)}`:'';
    $('#dbody').innerHTML = `
      <div class="kicker">${typeLabel(n.type)} · ${span}</div>
      <h2>${esc(n.l)}</h2>
      <div class="sum">這股引力穿過了 ${list.length} 段記憶${list.length>1?`，橫跨 ${(list[list.length-1].y-list[0].y).toFixed(0)} 年`:''}。</div>
      <h3 class="sec">它出現的時刻</h3>
      <div class="list">${list.map(d=>`<button data-d="${d.idx}"><small>${d.d.slice(0,7)}</small>${esc(d.t)}</button>`).join('')}</div>`;
  }
  $('#detail').classList.remove('reading');
  $('#detail').classList.add('open'); cap.classList.remove('show');
  $('#detail').scrollTop=0;
  if(n.t!==undefined) SND.select(n); else SND.thread(n.docs.map(i=>docs[i]).filter(d=>d.on).sort((a,b)=>a.y-b.y));
}

/* ---------- reader: the whole memory, inside the side panel ---------- */
function md(src){
  const inline=t=>esc(t)
    .replace(/!\[([^\]]*)\]\([^)]*\)/g,'<span class="img">［圖$1］</span>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
  let out='', para=[], list=null, inCode=false, code=[];
  const flushP=()=>{ if(para.length){ out+='<p>'+para.map(inline).join('<br>')+'</p>'; para=[]; } };
  const flushL=()=>{ if(list){ out+=`<${list.t}>`+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+`</${list.t}>`; list=null; } };
  for(const raw of String(src).split('\n')){
    const l=raw.replace(/\s+$/,'');
    if(/^\s*```/.test(l)){ if(inCode){ out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>'; code=[]; inCode=false; } else { flushP(); flushL(); inCode=true; } continue; }
    if(inCode){ code.push(raw); continue; }
    if(!l.trim()){ flushP(); flushL(); continue; }
    let m;
    if((m=l.match(/^(#{1,6})\s+(.*)/))){ flushP(); flushL(); const h=Math.min(4,m[1].length+1); out+=`<h${h}>${inline(m[2])}</h${h}>`; continue; }
    if(/^\s*([-*_]\s*){3,}$/.test(l)){ flushP(); flushL(); out+='<hr>'; continue; }
    if((m=l.match(/^\s*>\s?(.*)/))){ flushP(); flushL(); out+=`<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if((m=l.match(/^\s*([-*•]|\d+[.)、])\s+(.*)/))){ flushP(); const t=/\d/.test(m[1])?'ol':'ul'; if(!list||list.t!==t){ flushL(); list={t,items:[]}; } list.items.push(m[2]); continue; }
    flushL(); para.push(l.trim());
  }
  if(inCode) out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';
  flushP(); flushL(); return out;
}
function openReader(d){
  if(!d.b){ select(d, {keepList:true}); return; }
  state.sel=d;
  if(state.year<d.y) setYear(Y1);
  const ech = echoes.filter(e=>e[0]===d.idx||e[1]===d.idx).map(e=>docs[e[0]===d.idx?e[1]:e[0]]).sort((a,b)=>a.y-b.y);
  const prev=docs[d.idx-1], next=docs[d.idx+1];
  $('#dbody').innerHTML = `
    <button class="back" data-back="${d.idx}">‹ 回到摘要</button>
    <div class="kicker"><i style="background:${CAT[d.c]?.color}"></i>${CAT[d.c]?.label||d.c} · ${d.d}</div>
    <h2>${esc(d.t)}</h2>
    <div class="meta">${d.m?esc(d.m)+' · ':''}${d.b.replace(/\s/g,'').length} 字 · ${esc(DATA.comms[d.k]?.label||'')}</div>
    <article class="article">${md(d.b)}</article>
    <div class="nav">
      ${prev?`<button data-readnav="${prev.idx}"><small>‹ 更早的記憶 · ${prev.d}</small>${esc(prev.t)}</button>`:''}
      ${next?`<button class="next" data-readnav="${next.idx}"><small>${next.d} · 之後的記憶 ›</small>${esc(next.t)}</button>`:''}
    </div>
    ${ech.length?`<h3 class="sec">跨時間的回聲</h3><div class="list">${ech.map(x=>`<button data-d="${x.idx}"><small>${x.d.slice(0,7)}</small>${esc(x.t)}</button>`).join('')}</div>`:''}
    ${META.pathPrefix!=null&&d.f?`<div class="path">${esc(META.pathPrefix)}${esc(d.f)}</div>`:''}`;
  $('#detail').classList.add('open','reading');
  $('#detail').scrollTop=0;
  cap.classList.remove('show');
  SND.page();
}
function returnToList(){
  const origin=state.listOrigin;
  if(!origin) return;
  const detail=$('#detail');
  // Restore at the list's final width so its scroll position can be set immediately.
  detail.classList.add('restoring-list');
  select(origin.entity);
  detail.scrollTop=origin.scrollTop;
  detail.querySelector(`button[data-d="${origin.docIndex}"]`)?.focus({preventScroll:true});
  detail.classList.remove('restoring-list');
}
function closeDetail(){
  $('#detail').classList.remove('open','reading');
  $('#detailListBack').hidden=true;
  state.sel=null;
  state.listOrigin=null;
}
$('#detailListBack').onclick=returnToList;
$('#detail .close').onclick=()=>{closeDetail();setFocus(null)};
$('#dbody').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.read){ openReader(docs[+b.dataset.read]); return; }
  if(b.dataset.readnav){ openReader(docs[+b.dataset.readnav]); return; }
  if(b.dataset.back){ select(docs[+b.dataset.back], {keepList:true}); return; }
  if(b.dataset.d){
    const d=docs[+b.dataset.d];
    const fromList=state.sel?.docs;
    if(fromList){
      state.listOrigin={entity:state.sel, scrollTop:$('#detail').scrollTop, docIndex:d.idx};
    }
    if(state.year<d.y) setYear(Y1);
    if($('#detail').classList.contains('reading')) openReader(d);
    else select(d, {keepList:true});
    if(fromList) $('#detailListBack').focus({preventScroll:true});
  }
  if(b.dataset.e){ select(ents[+b.dataset.e]); }
});

function placeMixer(){ $('#mixer').style.top=($('#viewdesc').getBoundingClientRect().bottom+14)+'px'; }
addEventListener('resize',()=>placeMixer());
function renderMixer(){
  document.querySelectorAll('.trk').forEach(r=>{ const c=r.dataset.c;
    r.querySelector('.m').classList.toggle('on',mix.mute.has(c));
    r.querySelector('.s').classList.toggle('on',mix.solo.has(c));
    r.classList.toggle('silent',!catVisible(c)); });
}
function setFocus(e){
  state.focusEnt=e;
  $('#gtoggle em').textContent = e ? '· '+e.l : '';
  document.querySelectorAll('#gravity button').forEach(b=>b.classList.toggle('on', e && +b.dataset.e===ents.indexOf(e)));
}

/* ---------- side UI ---------- */
(function(){
  const counts={}; docs.forEach(d=>counts[d.c]=(counts[d.c]||0)+1);
  const maxN=Math.max(...Object.values(counts));
  $('#tracks').innerHTML = Object.entries(CAT).filter(([k])=>counts[k]).map(([k,v])=>
    `<div class="trk" data-c="${k}" style="--c:${v.color}"><i class="bar"></i><span class="nm" title="開／關">${v.label}</span>`+
    `<span class="meter"><b style="width:${Math.round(counts[k]/maxN*100)}%"></b><u></u></span><span class="n">${counts[k]}</span>`+
    `<button class="m" title="靜音 Mute">M</button><button class="s" title="獨奏 Solo（⌥ 點擊：只留這一軌）">S</button></div>`).join('');
  $('#mixer').addEventListener('click',e=>{
    const b=e.target.closest('button,.nm'); if(!b) return;
    const all=Object.keys(counts);
    if(b.dataset.all==='on'){ mix.mute.clear(); mix.solo.clear(); }
    else if(b.dataset.all==='off'){ mix.solo.clear(); all.forEach(k=>mix.mute.add(k)); }
    else {
      const c=b.closest('.trk').dataset.c;
      if(b.classList.contains('s')){
        if(e.altKey||e.metaKey){ const only=mix.solo.size===1&&mix.solo.has(c); mix.solo.clear(); if(!only) mix.solo.add(c); }
        else mix.solo.has(c)?mix.solo.delete(c):mix.solo.add(c);
      } else if(b.classList.contains('m')){ mix.mute.has(c)?mix.mute.delete(c):mix.mute.add(c); }
      else { // track name: switch this track on/off in whichever mode we are in
        if(mix.solo.size) mix.solo.has(c)?mix.solo.delete(c):mix.solo.add(c);
        else mix.mute.has(c)?mix.mute.delete(c):mix.mute.add(c);
      }
    }
    renderMixer(); SND.tick();
  });
  renderMixer();

  $('#gtoggle').onclick=()=>{ const o=$('#gwrap').classList.toggle('open'); $('#gtoggle').setAttribute('aria-expanded',o); SND.tick(); };

  const groups=[['theme','生命主題'],['person','人物'],['place','地方'],['work','作品與工具'],['org','組織']];
  let html='';
  groups.forEach(([t,lab])=>{
    const list=ents.map((e,i)=>[e,i]).filter(([e])=>e.type===t).sort((a,b)=>b[0].docs.length-a[0].docs.length).slice(0,t==='theme'?14:8);
    if(!list.length) return;
    html+=`<h3>${lab}</h3>`+list.map(([e,i])=>`<button data-e="${i}"><span>${esc(e.l)}</span><span>${e.docs.length}</span></button>`).join('');
  });
  $('#gravity').innerHTML=html;
  $('#gravity').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const en=ents[+b.dataset.e];
    if(state.focusEnt===en){setFocus(null);closeDetail();} else select(en)});

  const people=ents.filter(e=>e.type==='person').length, places=ents.filter(e=>e.type==='place').length, themes=ents.filter(e=>e.type==='theme').length;
  $('#stats').innerHTML = `<b>${docs.length}</b> 段記憶 · <b>${META.durationYears ?? Math.round(Y1-Y0)}</b> 年<br><b>${people}</b> 個人 · <b>${places}</b> 個地方 · <b>${themes}</b> 個主題<br><b>${echoes.length}</b> 道跨時間的回聲`;

  $('#viewdesc').textContent=VIEW_DESC.galaxy; placeMixer();
  $('#prologueText').innerHTML = DATA.prologue.map(esc).join('<br>');
  $('#prologueSig').textContent = DATA.prologueSig;

  document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
})();
function setView(v){
  if(v!==state.view) SND.whoosh();
  $('#viewdesc').textContent=VIEW_DESC[v]; placeMixer();
  state.view=v;
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  state.tPitch=VIEW_PITCH[v];
  resetCamera();
}

/* ---------- timeline ---------- */
const track=$('#track');
(function(){
  for(let y=Math.ceil(Y0);y<=Math.floor(Y1);y++){
    const x=(y-Y0)/(Y1-Y0)*100;
    const tk=document.createElement('div'); tk.className='tick'; tk.style.left=x+'%'; track.appendChild(tk);
    if(y%4===2||y===2026){const l=document.createElement('div'); l.className='yr'; l.style.left=x+'%'; l.textContent=y; track.appendChild(l);}
  }
  const hist={}; docs.forEach(d=>{const y=Math.floor(d.y);hist[y]=(hist[y]||0)+1});
  const mx=Math.max(...Object.values(hist));
  Object.entries(hist).forEach(([y,n])=>{const h=document.createElement('div');h.className='hist';h.style.left=((+y+.5-Y0)/(Y1-Y0)*100)+'%';h.style.height=(2+Math.sqrt(n/mx)*13)+'px';track.appendChild(h)});
})();
function setYear(y){
  state.year=Math.max(Y0,Math.min(Y1,y));
  const pct=(state.year-Y0)/(Y1-Y0)*100;
  track.querySelector('.fill').style.width=pct+'%';
  track.querySelector('.knob').style.left=pct+'%';
  $('#year').textContent=Math.floor(state.year);
}
let scrub=false;
track.addEventListener('pointerdown',e=>{scrub=true;track.setPointerCapture(e.pointerId);scrubTo(e);stopPlay()});
track.addEventListener('pointermove',e=>{if(scrub)scrubTo(e)});
track.addEventListener('pointerup',()=>scrub=false);
function scrubTo(e){const r=track.getBoundingClientRect();setYear(Y0+(e.clientX-r.left)/r.width*(Y1-Y0));showEraFor(state.year,true)}
const playBtn=$('#play');
const ICON_PLAY='<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>', ICON_PAUSE='<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>';
function togglePlay(){ state.playing?stopPlay():startPlay() }
function startPlay(){ if(state.year>=Y1-.01) setYear(Y0); state.playing=true; playBtn.innerHTML=ICON_PAUSE; lastEra=-1; state.autoRotate=true; $('#hint').style.opacity=0 }
function stopPlay(){ state.playing=false; playBtn.innerHTML=ICON_PLAY }

/* ---------- 還原宇宙: back to the universe as designed ---------- */
function resetUniverse(){
  closeDetail(); setFocus(null);
  mix.mute.clear(); mix.solo.clear(); renderMixer();
  stopPlay(); setYear(Y1); cap.classList.remove('show');
  state.tPitch=VIEW_PITCH[state.view]; state.tYaw=state.yaw; resetCamera(); state.autoRotate=true;
  SND.whoosh();
}
function isDirty(){
  return !!(state.sel || state.focusEnt || mix.mute.size || mix.solo.size || state.playing || state.year < Y1-.01 ||
    Math.abs(state.tZoom-VIEW_ZOOM[state.view])>.04 || Math.abs(state.tPanX)+Math.abs(state.tPanY)>4 ||
    Math.abs(state.tPitch-VIEW_PITCH[state.view])>.05 || !state.autoRotate);
}
const resetBtn=$('#reset');
resetBtn.onclick=()=>{ SND.resume(); resetUniverse(); };
function placeReset(){ const r=$('#views').getBoundingClientRect(); resetBtn.style.left=(r.right+10)+'px'; resetBtn.style.top=r.top+'px'; resetBtn.style.height=r.height+'px'; }
addEventListener('resize',placeReset); placeReset();
window.addEventListener('keydown',e=>{ if((e.key==='r'||e.key==='R') && !e.metaKey && !e.ctrlKey && e.target===document.body) resetUniverse(); });
playBtn.onclick=()=>{SND.resume();togglePlay()};
const sndBtn=$('#sound'); sndBtn.classList.toggle('off',!SND.on);
sndBtn.onclick=()=>sndBtn.classList.toggle('off',!SND.toggle());

/* ---------- narration ---------- */
const cap=$('#caption'); let lastEra=-1, capTimer=null;
function showEraFor(y, quiet){
  let k=-1; eras.forEach((e,i)=>{if(y>=e.y) k=i});
  if(k===lastEra) return; lastEra=k; if(k>=0) SND.era(k);
  if(k<0){cap.classList.remove('show');return}
  cap.classList.remove('show');
  clearTimeout(capTimer);
  capTimer=setTimeout(()=>{
    cap.querySelector('.era').textContent=eras[k].label;
    cap.querySelector('.txt').textContent=eras[k].text;
    cap.classList.add('show'); $('#hint').style.opacity=0;
    if(!state.playing) capTimer=setTimeout(()=>cap.classList.remove('show'), 16000);
  }, quiet?120:700);
}

/* ---------- fullscreen ---------- */
function toggleFS(){
  const el=document.documentElement;
  if(!(document.fullscreenElement||document.webkitFullscreenElement)) (el.requestFullscreen||el.webkitRequestFullscreen)?.call(el);
  else (document.exitFullscreen||document.webkitExitFullscreen)?.call(document);
}
function onFS(){ const fs=!!(document.fullscreenElement||document.webkitFullscreenElement); document.body.classList.toggle('fs',fs); if(!fs) document.body.classList.remove('idle'); wake(); }
document.addEventListener('fullscreenchange',onFS); document.addEventListener('webkitfullscreenchange',onFS);
let idleTimer=null;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleTimer);
  if(document.body.classList.contains('fs')) idleTimer=setTimeout(()=>document.body.classList.add('idle'),3200); }
['pointermove','pointerdown','wheel','keydown'].forEach(t=>window.addEventListener(t,wake,{passive:true}));
$('#fs').onclick=()=>{SND.resume();toggleFS()};
window.addEventListener('keydown',e=>{ if((e.key==='f'||e.key==='F') && !e.metaKey && !e.ctrlKey && e.target===document.body){ toggleFS(); } });

/* ---------- prologue ---------- */
$('#begin').onclick=()=>{ SND.resume(); $('#prologue').classList.add('gone'); setView('galaxy'); closeDetail(); setFocus(null); setYear(Y0); state.tPanX=state.tPanY=0; state.tZoom=1.15; setTimeout(()=>{state.tZoom=VIEW_ZOOM.galaxy;startPlay()},900) };
$('#fsgo').onclick=()=>{ toggleFS(); $('#begin').click(); };
if(/[?&]embed\b/.test(location.search)){ document.body.classList.add('embed'); $('#prologue').classList.add('gone'); setYear(Y1); state.tZoom=state.zoom=.82; state.tPanX=state.panX=innerWidth*.22; }
$('#skip').onclick=()=>{ SND.resume(); $('#prologue').classList.add('gone'); setYear(Y1); showEraFor(Y1+1) };

/* ---------- render ---------- */
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize); resize(); setYear(Y1);

const lerp=(a,b,t)=>a+(b-a)*t;
const FONT=getComputedStyle(document.body).fontFamily;
let labels=[];
function addLabel(text,x,y,pri,{size=11,color='rgba(225,230,250,.7)',align='left'}={}){ labels.push({text,x,y,pri,size,color,align}); }
function drawLabels(){
  labels.sort((a,b)=>b.pri-a.pri);
  const placed=[];
  ctx.globalCompositeOperation='source-over';
  for(const L of labels){
    ctx.font=L.size+'px '+FONT;
    const w=ctx.measureText(L.text).width, x0=L.align==='center'?L.x-w/2:L.x;
    const b=[x0-4,L.y-L.size-1,x0+w+4,L.y+4];
    if(b[2]<0||b[0]>W||b[3]<0||b[1]>H) continue;
    if(placed.some(q=>!(b[2]<q[0]||b[0]>q[2]||b[3]<q[1]||b[1]>q[3]))) continue;
    placed.push(b); ctx.fillStyle=L.color; ctx.textAlign=L.align; ctx.fillText(L.text,L.x,L.y);
  }
  ctx.textAlign='left'; labels=[];
}
let last=performance.now();
const trkEls=[...document.querySelectorAll('.trk')].map(el=>({c:el.dataset.c,u:el.querySelector('u')}));
const PLAY_SECONDS = 78;                 // whole life in ~78 s
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; state.t+=dt;
  if(state.playing){ setYear(state.year + dt*(Y1-Y0)/PLAY_SECONDS); showEraFor(state.year); if(state.year>=Y1){stopPlay(); setTimeout(()=>showEraFor(Y1+1),1800)} }
  if(state.autoRotate && !drag) state.tYaw += dt*.035;
  state.yaw=lerp(state.yaw,state.tYaw,.08); state.pitch=lerp(state.pitch,state.tPitch,.06);
  state.zoom=lerp(state.zoom,state.tZoom,.09); state.panX=lerp(state.panX,state.tPanX,.09); state.panY=lerp(state.panY,state.tPanY,.09);

  const key=viewKey[state.view];
  resetBtn.classList.toggle('dirty', isDirty());
  if(state.view==='gravity') for(const d of docs) if(d.sun) d.fp=orbitPos(d,state.t);
  for(const r of trkEls){ const c=r.c; const pk=mix.peak[c]||0; if(pk>0){ mix.peak[c]=Math.max(0,pk-dt*1.5); }
    r.u.style.opacity=pk; r.u.style.transform=`scaleX(${.2+.8*pk})`; }
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#03040a'; ctx.fillRect(0,0,W,H);

  // deep background
  const ng=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  ng.addColorStop(0,'rgba(60,40,120,.20)'); ng.addColorStop(.5,'rgba(20,16,50,.12)'); ng.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);
  for(const s of bgStars){
    const px=(s.x*.5+.5)*W + Math.sin(state.yaw)*s.z*30, py=(s.y*.5+.5)*H + state.pitch*s.z*14;
    const a=.15+.35*s.z*(.6+.4*Math.sin(state.t*1.3+s.tw));
    ctx.fillStyle=`rgba(210,205,255,${a})`; ctx.fillRect(px,py,s.z>.85?1.4:.8,s.z>.85?1.4:.8);
  }

  ctx.globalCompositeOperation='lighter';

  // era rings (galaxy view)
  if(state.view==='galaxy'){
    ctx.lineWidth=1;
    eras.forEach(e=>{
      if(e.y>state.year) return;
      const t=(e.y-Y0)/(Y1-Y0), r=60+Math.pow(t,.85)*R;
      ctx.beginPath();
      for(let a=0;a<=64;a++){const th=a/64*Math.PI*2;const p=project([Math.cos(th)*r,Math.sin(th)*r,0]); a?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}
      ctx.strokeStyle='rgba(160,150,255,.045)'; ctx.stroke();
      const lp=project([Math.cos(-2.2)*r, Math.sin(-2.2)*r, 0]);
      addLabel(e.short||'',lp[0]+4,lp[1],400,{size:10,color:'rgba(190,180,255,.4)'});
    });
  }

  // core: 本體
  const core=project([0,0,0]);
  const coreR=(state.view==='galaxy'?90:state.view==='gravity'?0.001:50)*core[2];
  const cg=ctx.createRadialGradient(core[0],core[1],0,core[0],core[1],coreR);
  const pulse=.75+.25*Math.sin(state.t*.8);
  cg.addColorStop(0,`rgba(255,236,200,${.55*pulse})`); cg.addColorStop(.25,'rgba(255,190,140,.16)'); cg.addColorStop(1,'rgba(255,160,120,0)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(core[0],core[1],coreR,0,7); ctx.fill();

  // update positions & visibility
  const focus=state.focusEnt, sel=state.sel;
  const focusSet = focus ? new Set(focus.docs) : null;
  for(const d of docs){
    const tgt=d[key]; for(let i=0;i<3;i++) d.p[i]=lerp(d.p[i],tgt[i],.07);
    const born = state.year>=d.y;
    const wasOn = d.on;
    d.on = born && catVisible(d.c);
    if(d.on && !wasOn && state.playing){ d.flare=1; SND.birth(d); mix.peak[d.c]=1; }
    d.flare = Math.max(0,(d.flare||0)-dt*.7);
    d.vis = lerp(d.vis, d.on?1:0, born?.12:.2);
    d.age = state.year - d.y;
  }
  for(const e of ents){ const tgt=e[key]; for(let i=0;i<3;i++) e.p[i]=lerp(e.p[i],tgt[i],.07);
    const alive=e.docs.filter(i=>docs[i].on).length; e.alive=alive; e.on = alive>0 && (state.view!=='constellation'||focus===e); }

  // project
  for(const d of docs){ const p=project(d.p); d.sx=p[0]; d.sy=p[1]; d.ss=p[2]; }
  for(const e of ents){ const p=project(e.p); e.sx=p[0]; e.sy=p[1]; e.ss=p[2]; }

  // echoes: faint arcs between memories in different years
  ctx.lineWidth=.6;
  for(const [a,b,w] of echoes){
    const A=docs[a],B=docs[b]; if(A.vis<.3||B.vis<.3) continue;
    const hot = (sel&&(sel===A||sel===B)) || (focusSet&&focusSet.has(a)&&focusSet.has(b));
    const al = hot? .55 : (focus||sel? .025 : (state.view==='gravity'? .03 : .07)*w);
    ctx.strokeStyle=`rgba(255,214,160,${al*Math.min(A.vis,B.vis)})`;
    const mx=(A.sx+B.sx)/2, my=(A.sy+B.sy)/2 - Math.hypot(A.sx-B.sx,A.sy-B.sy)*.18;
    ctx.beginPath(); ctx.moveTo(A.sx,A.sy); ctx.quadraticCurveTo(mx,my,B.sx,B.sy); ctx.stroke();
  }

  // focus threads: entity -> its docs, drawn in time order as a single filament
  const threadEnt = focus || (state.hover && state.hover.l!==undefined ? state.hover : null);
  if(threadEnt){
    const list=threadEnt.docs.map(i=>docs[i]).filter(d=>d.vis>.3).sort((a,b)=>a.y-b.y);
    ctx.lineWidth=1;
    ctx.strokeStyle='rgba(255,230,190,.16)';
    list.forEach(d=>{ctx.beginPath();ctx.moveTo(threadEnt.sx,threadEnt.sy);ctx.lineTo(d.sx,d.sy);ctx.stroke()});
    ctx.lineWidth=1.4; ctx.strokeStyle='rgba(255,220,150,.55)';
    ctx.beginPath(); list.forEach((d,i)=>i?ctx.lineTo(d.sx,d.sy):ctx.moveTo(d.sx,d.sy)); ctx.stroke();
  }
  const hovDoc = state.hover && state.hover.t!==undefined ? state.hover : null;
  const relSet = new Set([...(sel&&sel.t!==undefined?sel.ents:[]), ...(hovDoc?hovDoc.ents:[])]);
  for(const d of [sel&&sel.t!==undefined?sel:null, hovDoc]){
    if(!d) continue;
    ctx.lineWidth=1; ctx.strokeStyle= d===sel?'rgba(200,190,255,.4)':'rgba(200,190,255,.28)';
    (d.ents||[]).forEach(i=>{const e=ents[i]; ctx.beginPath();ctx.moveTo(d.sx,d.sy);ctx.lineTo(e.sx,e.sy);ctx.stroke()});
  }

  // stellar system scaffolding: gravity bridges, orbit rings, rogue belt
  if(state.view==='gravity'){
    for(let i=0;i<suns.length;i++) for(let j=i+1;j<suns.length;j++){
      const sh=SUNSHARE[i][j]; if(!BRIDGES.has(i+'-'+j)) continue;
      const A=suns[i],B=suns[j]; const hot=focus===A||focus===B||state.hover===A||state.hover===B;
      ctx.strokeStyle=`rgba(255,220,170,${hot? .12+sh*.6 : .03+sh*.22})`; ctx.lineWidth=.6+sh*5;
      ctx.beginPath(); ctx.moveTo(A.sx,A.sy); ctx.lineTo(B.sx,B.sy); ctx.stroke();
    }
    ctx.lineWidth=.7;
    for(const sun of suns){
      for(const rr of [50,90,130]){
        ctx.beginPath();
        for(let a=0;a<=40;a++){ const th=a/40*6.2832; const q=project([sun.fp[0]+Math.cos(th)*rr*(1+Math.sqrt(sun.mass)*.04), sun.fp[1]+Math.sin(th)*rr*(1+Math.sqrt(sun.mass)*.04), 0]); a?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }
        ctx.strokeStyle='rgba(170,160,255,.05)'; ctx.stroke();
      }
    }
    ctx.beginPath();
    for(let a=0;a<=96;a++){ const th=a/96*6.2832; const q=project([Math.cos(th)*(ROGUE_R+24),Math.sin(th)*(ROGUE_R+24),0]); a?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }
    ctx.strokeStyle='rgba(170,160,255,.06)'; ctx.setLineDash([3,6]); ctx.stroke(); ctx.setLineDash([]);
    const bl=project([0,-(ROGUE_R+60),0]);
    addLabel('遊星帶 · 沒有被任何恆星牽住的記憶', bl[0], bl[1], 500, {size:10.5,color:'rgba(190,180,255,.45)',align:'center'});
  }

  // community nebulae in constellation view
  if(state.view==='constellation'){
    DATA.comms.forEach(c=>{
      if(!c.pos) return; const p=project(c.pos); const r=(70+Math.sqrt(c.size)*16)*p[2];
      const col=c.color||'#7b6cff';
      const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],r); g.addColorStop(0,hexA(col,.13)); g.addColorStop(1,hexA(col,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p[0],p[1],r,0,7); ctx.fill();
    });
    DATA.comms.forEach(c=>{
      if(!c.pos) return; const p=project(c.pos); const r=(70+Math.sqrt(c.size)*16)*p[2];
      addLabel(c.label, p[0], p[1]-r*.62, 9000, {size:14,color:'rgba(240,235,255,.85)',align:'center'});
      addLabel(`${c.size} 段記憶 · ${c.span[0]}–${c.span[1]}`, p[0], p[1]-r*.62+16, 8990, {size:10,color:'rgba(180,175,210,.55)',align:'center'});
    });
  }

  // stars (sorted back-to-front)
  const order=docs.filter(d=>d.vis>.02).sort((a,b)=>a.ss-b.ss);
  for(const d of order){
    const col=CAT[d.c]?.color||'#ffffff';
    let a=d.vis;
    if(focusSet) a*= focusSet.has(d.idx)?1:.12;
    else if(sel && sel.t!==undefined && sel!==d) a*=.55;
    const fresh = 1 + d.flare*d.flare*3;                 // newborn flare while the clock runs
    const base = (1.3 + Math.sqrt(d.deg)*.42) * d.ss / Math.sqrt(state.zoom) * fresh;
    const twinkle = .85+.15*Math.sin(state.t*2+d.idx);
    const sz = base*6.5*twinkle;
    ctx.globalAlpha=Math.min(1,a);
    ctx.drawImage(sprite(col), d.sx-sz/2, d.sy-sz/2, sz, sz);
    if(state.zoom>1.7 && d.vis>.5 && (!focusSet||focusSet.has(d.idx))) addLabel(d.t, d.sx+base*1.4+4, d.sy+4, 1000+d.deg*10+state.zoom*50, {size:10.5,color:`rgba(215,210,235,${Math.min(.75,(state.zoom-1.7)*.9)})`});
    if(d===sel) addLabel(d.t, d.sx+base*1.6+8, d.sy+4, 9800, {size:12,color:'#fff'});
    if(d===state.hover||d===sel){ ctx.globalAlpha=1; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(d.sx,d.sy,base*1.6+5,0,7); ctx.stroke(); }
  }
  ctx.globalAlpha=1;

  // entities: themes = soft rings, people = small planets, places = diamonds
  ctx.globalCompositeOperation='source-over';
  const zs=Math.sqrt(state.zoom);
  const thr = Math.max(2, (state.view==='gravity'?7:11)/state.zoom);   // zoom in → more gravity sources appear
  for(let ei=0;ei<ents.length;ei++){
    const e=ents[ei];
    const isF = focus===e || state.hover===e;
    const rel = relSet.has(ei);
    const gravity = state.view==='gravity';
    const sun = gravity && e.isSun;
    e.visible = (e.on || rel) && (sun || ((!gravity || isF || rel) &&
      (e.type==='theme' || isF || rel || e.alive>=thr)));
    if(!e.visible) continue;
    const dim = focus && !isF ? .25 : 1;
    const r = (1.5+Math.sqrt(e.alive)*.9)*e.ss/zs;
    const lp = 3000 + e.alive*12 + (isF?7000:0) + (rel?5500:0);
    if(sun){
      const col=SUN_COLOR[e.type], R0=(10+Math.sqrt(e.alive)*3.4)*e.ss/zs*(.94+.06*Math.sin(state.t*1.2+e.sunIdx));
      ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=(isF?1:.85)*dim;
      ctx.drawImage(sprite(col,128), e.sx-R0*3, e.sy-R0*3, R0*6, R0*6);
      ctx.globalCompositeOperation='source-over';
      if(isF){ ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(e.sx,e.sy,R0*1.25+6,0,7); ctx.stroke(); }
      addLabel(e.l, e.sx, e.sy+R0*1.3+16, 9400+e.alive, {size:isF?15:13.5, color:`rgba(255,246,228,${.92*dim})`, align:'center'});
      addLabel(`${typeLabel(e.type)} · ${e.alive} 段記憶`, e.sx, e.sy+R0*1.3+31, 9390+e.alive, {size:10, color:`rgba(200,195,225,${.6*dim})`, align:'center'});
      continue;
    }
    if(e.type==='theme'){
      ctx.globalAlpha=(isF||rel?1:.6)*dim; ctx.strokeStyle= isF||rel?'#ffe2b0':'rgba(255,226,176,.5)'; ctx.lineWidth=isF?1.4:.8;
      ctx.beginPath(); ctx.arc(e.sx,e.sy,r+2,0,7); ctx.stroke();
      addLabel(e.l, e.sx+r+6, e.sy+4, lp+300, {size:isF?13:11.5, color: isF||rel?'#ffe2b0':`rgba(255,226,176,${.7*dim})`});
    } else {
      ctx.globalAlpha=.85*dim;
      ctx.fillStyle = e.type==='person'?'#9fd8ff': e.type==='place'?'#b6f0c8':'#d9c6ff';
      ctx.beginPath(); if(e.type==='place'){ctx.moveTo(e.sx,e.sy-r);ctx.lineTo(e.sx+r,e.sy);ctx.lineTo(e.sx,e.sy+r);ctx.lineTo(e.sx-r,e.sy);} else ctx.arc(e.sx,e.sy,r*.7+1,0,7); ctx.fill();
      addLabel(e.l, e.sx+r+5, e.sy+4, lp, {size:isF?12.5:11, color: isF||rel?'#e8f2ff':`rgba(220,232,255,${.62*dim})`});
    }
  }
  ctx.globalAlpha=1;
  if(state.view!=='gravity') addLabel('本體', core[0], core[1]+4, 9600, {size:12,color:'rgba(255,236,210,.6)',align:'center'});
  drawLabels();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
