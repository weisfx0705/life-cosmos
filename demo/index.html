留一點空，像替過去保留座位。","n":374},{"id":"d464","t":"十九的巡邏路線｜泡過水的索引卡","d":"2025-03-11","y":2025.1941,"c":"home","s":"44 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見半夜搶救種子櫃留下的影響。","m":"柔軟","f":"memories/2025-03-11-04-dog.md","k":7,"arm":0,"ents":[65,66,2,3,82,10,17,12],"deg":14,"b":"2025-03-11，落山風把招牌吹得咯咯響。44 歲的許思明正在經歷「半夜搶救種子櫃」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有紙張受潮後像剛醒來的皮膚。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":363},{"id":"d465","t":"給遠方的一封慢信｜泡過水的索引卡","d":"2025-03-31","y":2025.2489,"c":"love","s":"44 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見半夜搶救種子櫃留下的影響。","m":"遲疑","f":"memories/2025-03-31-05-letter.md","k":5,"arm":0,"ents":[18,19,93,3,82,68,6],"deg":7,"b":"2025-03-31，落山風把招牌吹得咯咯響。44 歲的許思明正在經歷「半夜搶救種子櫃」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":351},{"id":"d466","t":"樣方偏了七公分｜泡過水的索引卡","d":"2025-04-19","y":2025.2993,"c":"field","s":"44 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見連續一個月不敢聞到霉味留下的影響。","m":"震蕩","f":"memories/2025-04-19-06-field.md","k":7,"arm":1,"ents":[20,21,93,3,82,10,22,12],"deg":9,"b":"2025-04-19，空氣黏得每張紙都捲邊。44 歲的許思明正在經歷「連續一個月不敢聞到霉味」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有遠處機車聲被風切成斷句。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":364},{"id":"d467","t":"零錢盒與月底｜泡過水的索引卡","d":"2025-05-08","y":2025.3525,"c":"work","s":"44 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見連續一個月不敢聞到霉味留下的影響。","m":"自嘲","f":"memories/2025-05-08-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,82,68,12],"deg":7,"b":"2025-05-08，風停了，連狗都顯得不習慣。44 歲的許思明正在經歷「連續一個月不敢聞到霉味」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":419},{"id":"d468","t":"颱風來前的四小時｜泡過水的索引卡","d":"2025-05-27","y":2025.4046,"c":"coast","s":"44 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見連續一個月不敢聞到霉味留下的影響。","m":"專注","f":"memories/2025-05-27-08-storm.md","k":7,"arm":0,"ents":[25,26,93,3,82,10,27,12],"deg":9,"b":"2025-05-27，風停了，連狗都顯得不習慣。44 歲的許思明正在經歷「連續一個月不敢聞到霉味」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":390},{"id":"d469","t":"一鍋太酸的湯｜泡過水的索引卡","d":"2025-06-15","y":2025.455,"c":"kin","s":"44 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見連續一個月不敢聞到霉味留下的影響。","m":"柔軟","f":"memories/2025-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,93,3,82,29,6],"deg":7,"b":"2025-06-15，雲壓得很低，海卻異常平。44 歲的許思明正在經歷「連續一個月不敢聞到霉味」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有紙張受潮後像剛醒來的皮膚。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":380},{"id":"d470","t":"風不負責回答｜泡過水的索引卡","d":"2025-07-05","y":2025.511,"c":"thought","s":"44 歲的許思明在思明 FM經歷「風不負責回答」，也重新看見連續一個月不敢聞到霉味留下的影響。","m":"遲疑","f":"memories/2025-07-05-10-radio.md","k":7,"arm":1,"ents":[77,78,2,3,82,10,79,12],"deg":17,"b":"2025-07-05，空氣黏得每張紙都捲邊。44 歲的許思明正在經歷「連續一個月不敢聞到霉味」。她今天給自己的工作很簡單：打開深夜麥克風，讓來電者講完一個沒有結局的夢，只在必要時問一句當時風從哪邊來。\n\n現場有鹽粒卡在手腕細小的傷口。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":360},{"id":"d471","t":"關店後的城牆｜泡過水的索引卡","d":"2025-07-24","y":2025.563,"c":"body","s":"44 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見社區輪班曬乾八千張卡片留下的影響。","m":"震蕩","f":"memories/2025-07-24-11-walk.md","k":3,"arm":0,"ents":[32,33,93,3,82,34,12],"deg":7,"b":"2025-07-24，午後雷雨把街面洗成深灰。44 歲的許思明正在經歷「社區輪班曬乾八千張卡片」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有鹽粒卡在手腕細小的傷口。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":356},{"id":"d472","t":"旅人帶來的破東西｜泡過水的索引卡","d":"2025-08-12","y":2025.6135,"c":"travel","s":"44 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見社區輪班曬乾八千張卡片留下的影響。","m":"自嘲","f":"memories/2025-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,93,3,82,10,68,12],"deg":8,"b":"2025-08-12，午後雷雨把街面洗成深灰。44 歲的許思明正在經歷「社區輪班曬乾八千張卡片」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有遠處機車聲被風切成斷句。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":368},{"id":"d473","t":"母親說只是順便｜泡過水的索引卡","d":"2025-08-31","y":2025.6655,"c":"kin","s":"44 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見社區輪班曬乾八千張卡片留下的影響。","m":"專注","f":"memories/2025-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,82,29,6],"deg":7,"b":"2025-08-31，午後雷雨把街面洗成深灰。44 歲的許思明正在經歷「社區輪班曬乾八千張卡片」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":408},{"id":"d474","t":"父親的工具牆｜泡過水的索引卡","d":"2025-09-20","y":2025.7187,"c":"kin","s":"44 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見社區輪班曬乾八千張卡片留下的影響。","m":"柔軟","f":"memories/2025-09-20-14-father.md","k":7,"arm":0,"ents":[38,39,93,3,82,10,68,12],"deg":8,"b":"2025-09-20，雲壓得很低，海卻異常平。44 歲的許思明正在經歷「社區輪班曬乾八千張卡片」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":394},{"id":"d475","t":"兩個人各自沉默｜泡過水的索引卡","d":"2025-10-09","y":2025.7719,"c":"love","s":"44 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見社區輪班曬乾八千張卡片留下的影響。","m":"遲疑","f":"memories/2025-10-09-15-love.md","k":3,"arm":0,"ents":[18,41,93,3,82,42,12],"deg":7,"b":"2025-10-09，雲壓得很低，海卻異常平。44 歲的許思明正在經歷「社區輪班曬乾八千張卡片」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有鹽粒卡在手腕細小的傷口。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":372},{"id":"d476","t":"種子櫃的訪客｜泡過水的索引卡","d":"2025-10-28","y":2025.824,"c":"field","s":"44 歲的許思明在思明生活觀測所經歷「種子櫃的訪客」，也重新看見她決定讓檔案從此有多個保管人留下的影響。","m":"震蕩","f":"memories/2025-10-28-16-seed.md","k":7,"arm":1,"ents":[43,90,2,3,82,10,91,12],"deg":8,"b":"2025-10-28，空氣黏得每張紙都捲邊。44 歲的許思明正在經歷「她決定讓檔案從此有多個保管人」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在卡片上誠實寫下不知道，並邀請送來的人一起等待。\n\n現場有曬熱木板摸起來微微發黏。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":369},{"id":"d477","t":"昨夜夢見店長出鰓｜泡過水的索引卡","d":"2025-11-16","y":2025.8744,"c":"thought","s":"44 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見她決定讓檔案從此有多個保管人留下的影響。","m":"自嘲","f":"memories/2025-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,93,3,82,47,6],"deg":7,"b":"2025-11-16，風停了，連狗都顯得不習慣。44 歲的許思明正在經歷「她決定讓檔案從此有多個保管人」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有紙張受潮後像剛醒來的皮膚。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":359},{"id":"d478","t":"離開半島的一天｜泡過水的索引卡","d":"2025-12-05","y":2025.9276,"c":"travel","s":"44 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見她決定讓檔案從此有多個保管人留下的影響。","m":"專注","f":"memories/2025-12-05-18-trip.md","k":7,"arm":1,"ents":[48,49,93,3,82,10,50,12],"deg":9,"b":"2025-12-05，雲壓得很低，海卻異常平。44 歲的許思明正在經歷「她決定讓檔案從此有多個保管人」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有曬熱木板摸起來微微發黏。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":374},{"id":"d479","t":"無法分類的下午｜泡過水的索引卡","d":"2025-12-25","y":2025.9824,"c":"thought","s":"44 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見她決定讓檔案從此有多個保管人留下的影響。","m":"柔軟","f":"memories/2025-12-25-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,82,68,12],"deg":7,"b":"2025-12-25，雲壓得很低，海卻異常平。44 歲的許思明正在經歷「她決定讓檔案從此有多個保管人」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。一場暴雨淹進標本室，紙本索引濕成一團。她本來想全部丟掉，鄰居卻各自帶回家晾曬，字跡散開後像另一種海圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":427},{"id":"d480","t":"今天的風不肯直走｜第五百張公開卡片","d":"2026-01-12","y":2026.0301,"c":"coast","s":"45 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見逐篇重讀二十歲時的自己留下的影響。","m":"明亮","f":"memories/2026-01-12-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,82,5,6],"deg":7,"b":"2026-01-12，空氣黏得每張紙都捲邊。45 歲的許思明正在經歷「逐篇重讀二十歲時的自己」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。四十五歲，她把標本室改名為「思明生活觀測所」，公開二十五年的五百段記錄，並保留一張永遠空白的卡片給明天。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":404},{"id":"d481","t":"市場開門以前｜第五百張公開卡片","d":"2026-01-30","y":2026.0795,"c":"home","s":"45 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見逐篇重讀二十歲時的自己留下的影響。","m":"自嘲","f":"memories/2026-01-30-02-market.md","k":9,"arm":0,"ents":[7,8,94,3,82,10,11,12],"deg":8,"b":"2026-01-30，風停了，連狗都顯得不習慣。45 歲的許思明正在經歷「逐篇重讀二十歲時的自己」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得遠處機車聲被風切成斷句。那不是象徵，只是我確實站在那裡。\n\n現場有遠處機車聲被風切成斷句。四十五歲，她把標本室改名為「思明生活觀測所」，公開二十五年的五百段記錄，並保留一張永遠空白的卡片給明天。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":397},{"id":"d482","t":"維修單上的壞脾氣｜第五百張公開卡片","d":"2026-02-18","y":2026.1299,"c":"craft","s":"45 歲的許思明在思明生活觀測所經歷「維修單上的壞脾氣」，也重新看見逐篇重讀二十歲時的自己留下的影響。","m":"專注","f":"memories/2026-02-18-03-repair.md","k":10,"arm":1,"ents":[13,14,94,3,82,91,12],"deg":7,"b":"2026-02-18，午後雷雨把街面洗成深灰。45 歲的許思明正在經歷「逐篇重讀二十歲時的自己」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有市場冰塊融水流過鞋底。四十五歲，她把標本室改名為「思明生活觀測所」，公開二十五年的五百段記錄，並保留一張永遠空白的卡片給明天。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":370},{"id":"d483","t":"十九的巡邏路線｜第五百張公開卡片","d":"2026-03-08","y":2026.1858,"c":"home","s":"45 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見逐篇重讀二十歲時的自己留下的影響。","m":"柔軟","f":"memories/2026-03-08-04-dog.md","k":7,"arm":0,"ents":[65,66,2,3,82,10,17,12],"deg":14,"b":"2026-03-08，南方的光白得像鹽。45 歲的許思明正在經歷「逐篇重讀二十歲時的自己」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有鹽粒卡在手腕細小的傷口。四十五歲，她把標本室改名為「思明生活觀測所」，公開二十五年的五百段記錄，並保留一張永遠空白的卡片給明天。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":364},{"id":"d484","t":"給遠方的一封慢信｜第五百張公開卡片","d":"2026-03-26","y":2026.2352,"c":"love","s":"45 歲的許思明在思明生活觀測所經歷「給遠方的一封慢信」，也重新看見逐篇重讀二十歲時的自己留下的影響。","m":"遲疑","f":"memories/2026-03-26-05-letter.md","k":5,"arm":0,"ents":[18,19,94,3,82,91,6],"deg":7,"b":"2026-03-26，落山風把招牌吹得咯咯響。45 歲的許思明正在經歷「逐篇重讀二十歲時的自己」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。四十五歲，她把標本室改名為「思明生活觀測所」，公開二十五年的五百段記錄，並保留一張永遠空白的卡片給明天。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":347},{"id":"d485","t":"樣方偏了七公分｜第五百張公開卡片","d":"2026-04-13","y":2026.2829,"c":"field","s":"45 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見把私人傷口改寫成能分享的故事留下的影響。","m":"明亮","f":"memories/2026-04-13-06-field.md","k":7,"arm":1,"ents":[20,21,94,3,82,10,22,12],"deg":9,"b":"2026-04-13，空氣黏得每張紙都捲邊。45 歲的許思明正在經歷「把私人傷口改寫成能分享的故事」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有遠處機車聲被風切成斷句。四十五歲，她把標本室改名為「思明生活觀測所」，公開二十五年的五百段記錄，並保留一張永遠空白的卡片給明天。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":377},{"id":"d486","t":"零錢盒與月底｜第五百張公開卡片","d":"2026-05-02","y":2026.3361,"c":"work","s":"45 歲的許思明在思明生活觀測所經歷「零錢盒與月底」，也重新看見把私人傷口改寫成能分享的故事留下的影響。","m":"自嘲","f":"memories/2026-05-02-07-money.md","k":3,"arm":1,"ents":[23,24,2,3,82,91,12],"deg":7,"b":"2026-05-02，南方的光白得像鹽。45 歲的許思明正在經歷「把私人傷口改寫成能分享的故事」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。四十五歲，她把標本室改名為「思明生活觀測所」，公開二十五年的五百段記錄，並保留一張永遠空白的卡片給明天。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":425},{"id":"d487","t":"颱風來前的四小時｜第五百張公開卡片","d":"2026-05-20","y":2026.3854,"c":"coast","s":"45 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見把私人傷口改寫成能分享的故事留下的影響。","m":"專注","f":"memories/2026-05-20-08-storm.md","k":7,"arm":0,"ents":[25,26,94,3,82,10,27,12],"deg":9,"b":"2026-05-20，風停了，連狗都顯得不習慣。45 歲的許思明正在經歷「把私人傷口改寫成能分享的故事」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得遠處機車聲被風切成斷句。那不是象徵，只是我確實站在那裡。\n\n現場有遠處機車聲被風切成斷句。四十五歲，她把標本室改名為「思明生活觀測所」，公開二十五年的五百段記錄，並保留一張永遠空白的卡片給明天。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":398},{"id":"d488","t":"一鍋太酸的湯｜第五百張公開卡片","d":"2026-06-07","y":2026.4331,"c":"kin","s":"45 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見把私人傷口改寫成能分享的故事留下的影響。","m":"柔軟","f":"memories/2026-06-07-09-meal.md","k":9,"arm":0,"ents":[28,7,94,3,82,29,6],"deg":7,"b":"2026-06-07，空氣黏得每張紙都捲邊。45 歲的許思明正在經歷「把私人傷口改寫成能分享的故事」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有市場冰塊融水流過鞋底。四十五歲，她把標本室改名為「思明生活觀 傘，還有路邊一盆被風吹倒後又自己卡住的植物。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":384},{"id":"d498","t":"無法分類的下午｜第五百張公開卡片","d":"2026-12-07","y":2026.9331,"c":"thought","s":"45 歲的許思明在思明生活觀測所經歷「無法分類的下午」，也重新看見第五百篇寫完時沒有煙火，只有落山風留下的影響。","m":"柔軟","f":"memories/2026-12-07-19-odd.md","k":3,"arm":1,"ents":[51,52,2,3,82,91,12],"deg":7,"b":"2026-12-07，午後雷雨把街面洗成深灰。45 歲的許思明正在經歷「第五百篇寫完時沒有煙火，只有落山風」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。四十五歲，她把標本室改名為「思明生活觀測所」，公開二十五年的五百段記錄，並保留一張永遠空白的卡片給明天。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":439},{"id":"d499","t":"年末不完整清單｜第五百張公開卡片","d":"2026-12-25","y":2026.9824,"c":"thought","s":"45 歲的許思明在思明生活觀測所經歷「年末不完整清單」，也重新看見第五百篇寫完時沒有煙火，只有落山風留下的影響。","m":"遲疑","f":"memories/2026-12-25-20-inventory.md","k":7,"arm":1,"ents":[53,54,94,3,82,10,91,12],"deg":8,"b":"2026-12-25，雲壓得很低，海卻異常平。45 歲的許思明正在經歷「第五百篇寫完時沒有煙火，只有落山風」。她今天給自己的工作很簡單：盤點留下、送走、修好與仍然不明白的東西，故意保留空白，不把一年假裝成已經結案。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。四十五歲，她把標本室改名為「思明生活觀測所」，公開二十五年的五百段記錄，並保留一張永遠空白的卡片給明天。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":400}],"ents":[{"id":"theme_風與季節","l":"風與季節","type":"theme","docs":[0,20,39,58,77,96,116,135,154,173,192,211,231,250,269,288,307,326,346,365,384,404,423,442,461,480]},{"id":"theme_觀察","l":"觀察","type":"theme","docs":[0,3,20,23,39,42,58,61,77,96,116,135,154,173,192,211,231,250,269,288,307,326,346,365,384,404,423,442,461,480]},{"id":"theme_時間與記憶","l":"時間與記憶","type":"theme","docs":[0,3,6,9,12,15,18,20,23,26,29,32,35,38,39,42,45,48,51,54,57,58,61,64,67,70,73,76,77,80,83,86,89,92,95       const g=ac.createGain(); g.gain.value= o.type==='sawtooth'? .03 : .055; o.connect(g); g.connect(padFilter); o.start(); pad.push({o,i}); } });
    sub=ac.createOscillator(); sub.type='sine'; sub.frequency.value=f(-12);
    const sg=ac.createGain(); sg.gain.value=.11; sub.connect(sg); sg.connect(padBus); sub.start();

    const c=CHORDS[Math.max(0,Math.min(CHORDS.length-1,k))], t=ac.currentTime;

let rng = mulberry(7);

// Each doc gets 3 target positions (galaxy / constellation / gravity). We tween between them.
const R = 600;
const armCount=[0,0], armSeen=[0,0]; docs.forEach(d=>armCount[d.arm||0]++);
docs.forEach((d,i)=>{
  const t=(d.y-Y0)/(Y1-Y0);              // 0..1 across the life
  const a=d.arm||0, rank=(armSeen[a]++)/Math.max(1,armCount[a]-1);

// constellation: communities on a ring, docs around their centre
(function(){

// stellar system: the strongest gravity sources become suns; every memory orbits the sun that holds it most specifically
const SUN_QUOTA={theme:7,person:4,place:2,work:2,org:1};
const SUN_COLOR={theme:'#ffd38a',person:'#8fd0ff',place:'#a8f0c0',work:'#c9b6ff',org:'#ffb0a0'};
const suns=[]; let SUNSHARE=[]; const BRIDGES=new Set(); const ROGUE_R=820;
(function(){
  Object.entries(SUN_QUOTA).forEach(([t,n])=>ents.filter(e=>e.type===t).sort((a,b)=>b.docs.length-a.docs.length).slice(0,n).forEach(e=>suns.push(e)));
  suns.forEach((e,i)=>{e.isSun=true; e.sunIdx=i; e.docSet=new Set(e.docs); e.mass=e.docs.length;});
  const N=suns.length;
  // how much two suns share: memories held by both, normalised
  SUNSHARE=suns.map(a=>suns.map(b=>{ if(a===b) return 0; let c=0; for(const d of a.docs) if(b.docSet.has(d)) c++; return c/Math.sqrt(a.mass*b.mass); }));

  const P=suns.map((e,i)=>({x:Math.cos(i/N*6.283)*420,y:Math.sin(i/N*6.283)*420,vx:0,vy:0}));
  for(let it=0;it<600;it++){ const al=1-it/600;
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
      const a=P[i],b=P[j], dx=b.x-a.x, dy=b.y-a.y, d=Math.max(1,Math.hypot(dx,dy));
      const rest=820-640*Math.min(1,SUNSHARE[i][j]*1.6);
      const f=((d-rest)/d*.012 - 90000/(d*d*d))*al;
      a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
    P.forEach(q=>{ q.vx-=q.x*.0015*al; q.vy-=q.y*.0015*al; q.x+=q.vx; q.y+=q.vy; q.vx*=.5; q.vy*=.5; });
  }
  let m=1; P.forEach(q=>m=Math.max(m,Math.hypot(q.x,q.y))); const k=600/m;
  suns.forEach((e,i)=>{ e.fp=[P[i].x*k, P[i].y*k, 0]; });

  const bySun=new Map(suns.map(x=>[x,[]])); const rogue=[];
  docs.forEach(d=>{
    const mine=suns.filter(x=>x.docSet.has(d.idx)).sort((a,b)=>a.mass-b.mass);   // the most specific sun pulls hardest
    if(!mine.length){ d.sun=null; rogue.push(d); return; }
    d.sun=mine[0]; d.suns=mine; bySun.get(d.sun).push(d);
  });
  bySun.forEach((list,sun)=>{
    list.sort((a,b)=>a.y-b.y);
    list.forEach((d,j)=>{
      const t=(d.y-Y0)/(Y1-Y0);
      d.orbR = 30 + Math.sqrt(sun.mass)*3.2 + t*78 + (j%3)*5;          // later memories ride wider orbits
      d.orbA = j*2.39996;
      d.orbW = 1.1/Math.pow(d.orbR/40,1.5);                            // Kepler: inner orbits run faster
      let bx=0,by=0; d.suns.slice(1).forEach(o=>{bx+=o.fp[0]-sun.fp[0]; by+=o.fp[1]-sun.fp[1]});

  });

    const t=(d.y-Y0)/(Y1-Y0), a=t*Math.PI*1.96-Math.PI/2, rr=ROGUE_R+(j%4)*16;
    d.fp=[Math.cos(a)*rr, Math.sin(a)*rr, (rng()-.5)*20];

  suns.forEach((_,i)=>SUNSHARE[i].map((v,j)=>[v,j]).filter(([v])=>v>=.15).sort((a,b)=>b[0]-a[0]).slice(0,3).forEach(([,j])=>BRIDGES.add(Math.min(i,j)+'-'+Math.max(i,j))));
})();
function orbitPos(d,t){ const s=d.sun, a=d.orbA + d.orbW*t*.22;

// entity anchor positions per view = centroid of their docs, lifted
function entityPos(e, key){
  if(key==='fp' && e.isSun) return e.fp;
  if(key==='g'){
    let sx=0,sy=0; e.docs.forEach(i=>{const p=docs[i].g; const a=Math.atan2(p[1],p[0]); sx+=Math.cos(a); sy+=Math.sin(a)});

  let x=0,y=0,z=0; e.docs.forEach(i=>{const p=docs[i][key];x+=p[0];y+=p[1];z+=p[2]});

function project(p){
  const cy=Math.cos(state.yaw), sy=Math.sin(state.yaw);
  let x=p[0]*cy - p[1]*sy, y=p[0]*sy + p[1]*cy, z=p[2];
  const cp=Math.cos(state.pitch), sp=Math.sin(state.pitch);

  const cam = 2400;
  const s = 2400/(cam + z2) * state.zoom * Math.min(W,H)/1000;
  return [W/2 + state.panX + x*s, H/2 + state.panY + y2*s, s, z2];

/* ---------- reader: the whole memory, inside the side panel ---------- */
function md(src){
  const inline=t=>esc(t)
    .replace(/!\[([^\]]*)\]\([^)]*\)/g,'<span class="img">［圖$1］</span>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
  let out='', para=[], list=null, inCode=false, code=[];
  const flushP=()=>{ if(para.length){ out+='<p>'+para.map(inline).join('<br>')+'</p>'; para=[]; } };
  const flushL=()=>{ if(list){ out+=`<${list.t}>`+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+`</${list.t}>`; list=null; } };
  for(const raw of String(src).split('\n')){
    const l=raw.replace(/\s+$/,'');
    if(/^\s*```/.test(l)){ if(inCode){ out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>'; code=[]; inCode=false; } else { flushP(); flushL(); inCode=true; } continue; }
    if(inCode){ code.push(raw); continue; }
    if(!l.trim()){ flushP(); flushL(); continue; }
    let m;
    if((m=l.match(/^(#{1,6})\s+(.*)/))){ flushP(); flushL(); const h=Math.min(4,m[1].length+1); out+=`<h${h}>${inline(m[2])}</h${h}>`; continue; }
    if(/^\s*([-*_]\s*){3,}$/.test(l)){ flushP(); flushL(); out+='<hr>'; continue; }
    if((m=l.match(/^\s*>\s?(.*)/))){ flushP(); flushL(); out+=`<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if((m=l.match(/^\s*([-*•]|\d+[.)、])\s+(.*)/))){ flushP(); const t=/\d/.test(m[1])?'ol':'ul'; if(!list||list.t!==t){ flushL(); list={t,items:[]}; } list.items.push(m[2]); continue; }
    flushL(); para.push(l.trim());
  }
  if(inCode) out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';
  flushP(); flushL(); return out;
}

function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize); resize(); setYear(Y1);

const lerp=(a,b,t)=>a+(b-a)*t;
const FONT=getComputedStyle(document.body).fontFamily;
let labels=[];
function addLabel(text,x,y,pri,{size=11,color='rgba(225,230,250,.7)',align='left'}={}){ labels.push({text,x,y,pri,size,color,align}); }
function drawLabels(){
  labels.sort((a,b)=>b.pri-a.pri);
  const placed=[];
  ctx.globalCompositeOperation='source-over';
  for(const L of labels){
    ctx.font=L.size+'px '+FONT;
    const w=ctx.measureText(L.text).width, x0=L.align==='center'?L.x-w/2:L.x;
    const b=[x0-4,L.y-L.size-1,x0+w+4,L.y+4];
    if(b[2]<0||b[0]>W||b[3]<0||b[1]>H) continue;
    if(placed.some(q=>!(b[2]<q[0]||b[0]>q[2]||b[3]<q[1]||b[1]>q[3]))) continue;
    placed.push(b); ctx.fillStyle=L.color; ctx.textAlign=L.align; ctx.fillText(L.text,L.x,L.y);
  }

}
let last=performance.now();
const trkEls=[...document.querySelectorAll('.trk')].map(el=>({c:el.dataset.c,u:el.querySelector('u')}));
const PLAY_SECONDS = 78;                 // whole life in ~78 s
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; state.t+=dt;
  if(state.playing){ setYear(state.year + dt*(Y1-Y0)/PLAY_SECONDS); showEraFor(state.year); if(state.year>=Y1){stopPlay(); setTimeout(()=>showEraFor(Y1+1),1800)} }
  if(state.autoRotate && !drag) state.tYaw += dt*.035;
  state.yaw=lerp(state.yaw,state.tYaw,.08); state.pitch=lerp(state.pitch,state.tPitch,.06);
  state.zoom=lerp(state.zoom,state.tZoom,.09); state.panX=lerp(state.panX,state.tPanX,.09); state.panY=lerp(state.panY,state.tPanY,.09);

  const key=viewKey[state.view];
  resetBtn.classList.toggle('dirty', isDirty());
  if(state.view==='gravity') for(const d of docs) if(d.sun) d.fp=orbitPos(d,state.t);
  for(const r of trkEls){ const c=r.c; const pk=mix.peak[c]||0; if(pk>0){ mix.peak[c]=Math.max(0,pk-dt*1.5); }
    r.u.style.opacity=pk; r.u.style.transform=`scaleX(${.2+.8*pk})`; }
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#03040a'; ctx.fillRect(0,0,W,H);

  // deep background
  const ng=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  ng.addColorStop(0,'rgba(60,40,120,.20)'); ng.addColorStop(.5,'rgba(20,16,50,.12)'); ng.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);
  for(const s of bgStars){
    const px=(s.x*.5+.5)*W + Math.sin(state.yaw)*s.z*30, py=(s.y*.5+.5)*H + state.pitch*s.z*14;
    const a=.15+.35*s.z*(.6+.4*Math.sin(state.t*1.3+s.tw));
    ctx.fillStyle=`rgba(210,205,255,${a})`; ctx.fillRect(px,py,s.z>.85?1.4:.8,s.z>.85?1.4:.8);
  }

  ctx.globalCompositeOperation='lighter';

  // era rings (galaxy view)
  if(state.view==='galaxy'){
    ctx.lineWidth=1;
    eras.forEach(e=>{
      if(e.y>state.year) return;
      const t=(e.y-Y0)/(Y1-Y0), r=60+Math.pow(t,.85)*R;
      ctx.beginPath();
      for(let a=0;a<=64;a++){const th=a/64*Math.PI*2;const p=project([Math.cos(th)*r,Math.sin(th)*r,0]); a?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}
      ctx.strokeStyle='rgba(160,150,255,.045)'; ctx.stroke();
      const lp=project([Math.cos(-2.2)*r, Math.sin(-2.2)*r, 0]);
      addLabel(e.short||'',lp[0]+4,lp[1],400,{size:10,color:'rgba(190,180,255,.4)'});
    });
  }

  // core: 本體
  const core=project([0,0,0]);
  const coreR=(state.view==='galaxy'?90:state.view==='gravity'?0.001:50)*core[2];
  const cg=ctx.createRadialGradient(core[0],core[1],0,core[0],core[1],coreR);
  const pulse=.75+.25*Math.sin(state.t*.8);
  cg.addColorStop(0,`rgba(255,236,200,${.55*pulse})`); cg.addColorStop(.25,'rgba(255,190,140,.16)'); cg.addColorStop(1,'rgba(255,160,120,0)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(core[0],core[1],coreR,0,7); ctx.fill();

  // update positions & visibility
  const focus=state.focusEnt, sel=state.sel;
  const focusSet = focus ? new Set(focus.docs) : null;
  for(const d of docs){
    const tgt=d[key]; for(let i=0;i<3;i++) d.p[i]=lerp(d.p[i],tgt[i],.07);
    const born = state.year>=d.y;
    const wasOn = d.on;
    d.on = born && catVisible(d.c);
    if(d.on && !wasOn && state.playing){ d.flare=1; SND.birth(d); mix.peak[d.c]=1; }
    d.flare = Math.max(0,(d.flare||0)-dt*.7);
    d.vis = lerp(d.vis, d.on?1:0, born?.12:.2);
    d.age = state.year - d.y;
  }
  for(const e of ents){ const tgt=e[key]; for(let i=0;i<3;i++) e.p[i]=lerp(e.p[i],tgt[i],.07);
    const alive=e.docs.filter(i=>docs[i].on).length; e.alive=alive; e.on = alive>0 && (state.view!=='constellation'||focus===e); }

  // project
  for(const d of docs){ const p=project(d.p); d.sx=p[0]; d.sy=p[1]; d.ss=p[2]; }
  for(const e of ents){ const p=project(e.p); e.sx=p[0]; e.sy=p[1]; e.ss=p[2]; }

  // echoes: faint arcs between memories in different years
  ctx.lineWidth=.6;
  for(const [a,b,w] of echoes){
    const A=docs[a],B=docs[b]; if(A.vis<.3||B.vis<.3) continue;
    const hot = (sel&&(sel===A||sel===B)) || (focusSet&&focusSet.has(a)&&focusSet.has(b));
    const al = hot? .55 : (focus||sel? .025 : (state.view==='gravity'? .03 : .07)*w);
    ctx.strokeStyle=`rgba(255,214,160,${al*Math.min(A.vis,B.vis)})`;
    const mx=(A.sx+B.sx)/2, my=(A.sy+B.sy)/2 - Math.hypot(A.sx-B.sx,A.sy-B.sy)*.18;
    ctx.beginPath(); ctx.moveTo(A.sx,A.sy); ctx.quadraticCurveTo(mx,my,B.sx,B.sy); ctx.stroke();
  }

  // focus threads: entity -> its docs, drawn in time order as a single filament
  const threadEnt = focus || (state.hover && state.hover.l!==undefined ? state.hover : null);
  if(threadEnt){
    const list=threadEnt.docs.map(i=>docs[i]).filter(d=>d.vis>.3).sort((a,b)=>a.y-b.y);
    ctx.lineWidth=1;
    ctx.strokeStyle='rgba(255,230,190,.16)';
    list.forEach(d=>{ctx.beginPath();ctx.moveTo(threadEnt.sx,threadEnt.sy);ctx.lineTo(d.sx,d.sy);ctx.stroke()});
    ctx.lineWidth=1.4; ctx.strokeStyle='rgba(255,220,150,.55)';
    ctx.beginPath(); list.forEach((d,i)=>i?ctx.lineTo(d.sx,d.sy):ctx.moveTo(d.sx,d.sy)); ctx.stroke();
  }
  const hovDoc = state.hover && state.hover.t!==undefined ? state.hover : null;
  const relSet = new Set([...(sel&&sel.t!==undefined?sel.ents:[]), ...(hovDoc?hovDoc.ents:[])]);
  for(const d of [sel&&sel.t!==undefined?sel:null, hovDoc]){
    if(!d) continue;
    ctx.lineWidth=1; ctx.strokeStyle= d===sel?'rgba(200,190,255,.4)':'rgba(200,190,255,.28)';
    (d.ents||[]).forEach(i=>{const e=ents[i]; ctx.beginPath();ctx.moveTo(d.sx,d.sy);ctx.lineTo(e.sx,e.sy);ctx.stroke()});
  }

  // stellar system scaffolding: gravity bridges, orbit rings, rogue belt
  if(state.view==='gravity'){
    for(let i=0;i<suns.length;i++) for(let j=i+1;j<suns.length;j++){
      const sh=SUNSHARE[i][j]; if(!BRIDGES.has(i+'-'+j)) continue;
      const A=suns[i],B=suns[j]; const hot=focus===A||focus===B||state.hover===A||state.hover===B;
      ctx.strokeStyle=`rgba(255,220,170,${hot? .12+sh*.6 : .03+sh*.22})`; ctx.lineWidth=.6+sh*5;
      ctx.beginPath(); ctx.moveTo(A.sx,A.sy); ctx.lineTo(B.sx,B.sy); ctx.stroke();
    }
    ctx.lineWidth=.7;
    for(const sun of suns){
      for(const rr of [50,90,130]){
        ctx.beginPath();
        for(let a=0;a<=40;a++){ const th=a/40*6.2832; const q=project([sun.fp[0]+Math.cos(th)*rr*(1+Math.sqrt(sun.mass)*.04), sun.fp[1]+Math.sin(th)*rr*(1+Math.sqrt(sun.mass)*.04), 0]); a?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }
        ctx.strokeStyle='rgba(170,160,255,.05)'; ctx.stroke();
      }
    }
    ctx.beginPath();
    for(let a=0;a<=96;a++){ const th=a/96*6.2832; const q=project([Math.cos(th)*(ROGUE_R+24),Math.sin(th)*(ROGUE_R+24),0]); a?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }
    ctx.strokeStyle='rgba(170,160,255,.06)'; ctx.setLineDash([3,6]); ctx.stroke(); ctx.setLineDash([]);
    const bl=project([0,-(ROGUE_R+60),0]);
    addLabel('遊星帶 · 沒有被任何恆星牽住的記憶', bl[0], bl[1], 500, {size:10.5,color:'rgba(190,180,255,.45)',align:'center'});
  }

  // community nebulae in constellation view
  if(state.view==='constellation'){
    DATA.comms.forEach(c=>{
      if(!c.pos) return; const p=project(c.pos); const r=(70+Math.sqrt(c.size)*16)*p[2];
      const col=c.color||'#7b6cff';
      const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],r); g.addColorStop(0,hexA(col,.13)); g.addColorStop(1,hexA(col,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p[0],p[1],r,0,7); ctx.fill();
    });
    DATA.comms.forEach(c=>{
      if(!c.pos) return; const p=project(c.pos); const r=(70+Math.sqrt(c.size)*16)*p[2];
      addLabel(c.label, p[0], p[1]-r*.62, 9000, {size:14,color:'rgba(240,235,255,.85)',align:'center'});
      addLabel(`${c.size} 段記憶 · ${c.span[0]}–${c.span[1]}`, p[0], p[1]-r*.62+16, 8990, {size:10,color:'rgba(180,175,210,.55)',align:'center'});
    });
  }

  // stars (sorted back-to-front)
  const order=docs.filter(d=>d.vis>.02).sort((a,b)=>a.ss-b.ss);
  for(const d of order){
    const col=CAT[d.c]?.color||'#ffffff';
    let a=d.vis;
    if(focusSet) a*= focusSet.has(d.idx)?1:.12;
    else if(sel && sel.t!==undefined && sel!==d) a*=.55;
    const fresh = 1 + d.flare*d.flare*3;                 // newborn flare while the clock runs
    const base = (1.3 + Math.sqrt(d.deg)*.42) * d.ss / Math.sqrt(state.zoom) * fresh;
    const twinkle = .85+.15*Math.sin(state.t*2+d.idx);
    const sz = base*6.5*twinkle;
    ctx.globalAlpha=Math.min(1,a);
    ctx.drawImage(sprite(col), d.sx-sz/2, d.sy-sz/2, sz, sz);
    if(state.zoom>1.7 && d.vis>.5 && (!focusSet||focusSet.has(d.idx))) addLabel(d.t, d.sx+base*1.4+4, d.sy+4, 1000+d.deg*10+state.zoom*50, {size:10.5,color:`rgba(215,210,235,${Math.min(.75,(state.zoom-1.7)*.9)})`});
    if(d===sel) addLabel(d.t, d.sx+base*1.6+8, d.sy+4, 9800, {size:12,color:'#fff'});
    if(d===state.hover||d===sel){ ctx.globalAlpha=1; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(d.sx,d.sy,base*1.6+5,0,7); ctx.stroke(); }
  }
  ctx.globalAlpha=1;

  // entities: themes = soft rings, people = small planets, places = diamonds
  ctx.globalCompositeOperation='source-over';
  const zs=Math.sqrt(state.zoom);
  const thr = Math.max(2, (state.view==='gravity'?7:11)/state.zoom);   // zoom in → more gravity sources appear
  for(let ei=0;ei<ents.length;ei++){
    const e=ents[ei];
    const isF = focus===e || state.hover===e;
    const rel = relSet.has(ei);
    const gravity = state.view==='gravity';
    const sun = gravity && e.isSun;
    e.visible = (e.on || rel) && (sun || ((!gravity || isF || rel) &&
      (e.type==='theme' || isF || rel || e.alive>=thr)));
    if(!e.visible) continue;
    const dim = focus && !isF ? .25 : 1;
    const r = (1.5+Math.sqrt(e.alive)*.9)*e.ss/zs;
    const lp = 3000 + e.alive*12 + (isF?7000:0) + (rel?5500:0);
    if(sun){
      const col=SUN_COLOR[e.type], R0=(10+Math.sqrt(e.alive)*3.4)*e.ss/zs*(.94+.06*Math.sin(state.t*1.2+e.sunIdx));
      ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=(isF?1:.85)*dim;
      ctx.drawImage(sprite(col,128), e.sx-R0*3, e.sy-R0*3, R0*6, R0*6);
      ctx.globalCompositeOperation='source-over';
      if(isF){ ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(e.sx,e.sy,R0*1.25+6,0,7); ctx.stroke(); }
      addLabel(e.l, e.sx, e.sy+R0*1.3+16, 9400+e.alive, {size:isF?15:13.5, color:`rgba(255,246,228,${.92*dim})`, align:'center'});
      addLabel(`${typeLabel(e.type)} · ${e.alive} 段記憶`, e.sx, e.sy+R0*1.3+31, 9390+e.alive, {size:10, color:`rgba(200,195,225,${.6*dim})`, align:'center'});
      continue;
    }
    if(e.type==='theme'){
      ctx.globalAlpha=(isF||rel?1:.6)*dim; ctx.strokeStyle= isF||rel?'#ffe2b0':'rgba(255,226,176,.5)'; ctx.lineWidth=isF?1.4:.8;
      ctx.beginPath(); ctx.arc(e.sx,e.sy,r+2,0,7); ctx.stroke();
      addLabel(e.l, e.sx+r+6, e.sy+4, lp+300, {size:isF?13:11.5, color: isF||rel?'#ffe2b0':`rgba(255,226,176,${.7*dim})`});
    } else {
      ctx.globalAlpha=.85*dim;
      ctx.fillStyle = e.type==='person'?'#9fd8ff': e.type==='place'?'#b6f0c8':'#d9c6ff';
      ctx.beginPath(); if(e.type==='place'){ctx.moveTo(e.sx,e.sy-r);ctx.lineTo(e.sx+r,e.sy);ctx.lineTo(e.sx,e.sy+r);ctx.lineTo(e.sx-r,e.sy);} else ctx.arc(e.sx,e.sy,r*.7+1,0,7); ctx.fill();
      addLabel(e.l, e.sx+r+5, e.sy+4, lp, {size:isF?12.5:11, color: isF||rel?'#e8f2ff':`rgba(220,232,255,${.62*dim})`});
    }
  }
  ctx.globalAlpha=1;
  if(state.view!=='gravity') addLabel('本體', core[0], core[1]+4, 9600, {size:12,color:'rgba(255,236,210,.6)',align:'center'});
  drawLabels();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
