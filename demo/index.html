<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一個生命體的宇宙</title>
<style>
  :root{
    --bg:#03040a; --ink:#e9e6f2; --dim:#8c88a3; --faint:#4a4760;
    --glass:rgba(14,14,30,.62); --line:rgba(180,170,255,.14);
    --serif:"Songti TC","Noto Serif TC","PMingLiU",serif;
    --sans:"PingFang TC","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  canvas{position:fixed;inset:0;display:block;cursor:grab;touch-action:pinch-zoom}
  canvas.dragging{cursor:grabbing}
  .ui{position:fixed;z-index:5}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* header */
  #title{top:22px;left:28px;pointer-events:none}
  #title h1{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.18em}
  #title p{color:var(--dim);font-size:12px;letter-spacing:.12em;margin-top:6px}
  #home{top:20px;right:28px;z-index:25;display:inline-flex;align-items:center;min-height:30px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);color:var(--dim);font-size:11px;letter-spacing:.1em;text-decoration:none;transition:color .2s,border-color .2s,transform .2s}
  #home:hover{color:var(--ink);border-color:rgba(220,210,255,.45);transform:translateY(-1px)}
  #home:active{transform:translateY(0) scale(.97)}
  #stats{top:56px;right:28px;text-align:right;color:var(--dim);font-size:12px;letter-spacing:.08em;line-height:1.9}
  #stats b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

  /* view switch */
  #views{top:84px;left:28px;display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(10px)}
  #views button{padding:6px 14px;border-radius:999px;font-size:12px;letter-spacing:.1em;color:var(--dim);transition:.25s}
  #views button.on{background:rgba(200,190,255,.14);color:var(--ink)}
  #reset{top:84px;left:290px;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);font-size:12px;letter-spacing:.1em;color:var(--dim);transition:color .3s,border-color .3s,box-shadow .3s}
  #reset svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s}
  #reset:hover{color:var(--ink);border-color:rgba(220,210,255,.45)}
  #reset:hover svg{transform:rotate(-200deg)}
  #reset.dirty{color:#ffd38a;border-color:rgba(255,211,138,.6);box-shadow:0 0 18px rgba(255,211,138,.18)}
  #reset:active{transform:scale(.97)}

  /* view description */
  #viewdesc{left:30px;top:126px;width:250px;font-size:11.5px;line-height:1.75;color:var(--dim);letter-spacing:.04em}
  /* mixer: memory tracks with solo / mute */
  #mixer{left:28px;top:196px;width:252px;font-size:12px;color:var(--dim);background:rgba(10,10,24,.5);border:1px solid var(--line);border-radius:12px;padding:10px 12px 9px;backdrop-filter:blur(8px)}
  #mixer .mhead{display:flex;align-items:center;gap:6px;margin-bottom:7px;font-size:10px;letter-spacing:.24em;color:var(--faint)}
  #mixer .mhead span{margin-right:auto}
  #mixer .mhead button{padding:2px 8px;border:1px solid var(--line);border-radius:4px;font-size:10px;letter-spacing:.12em;color:var(--dim);transition:.2s}
  #mixer .mhead button:hover{color:var(--ink);border-color:rgba(220,210,255,.45)}
  .trk{display:grid;grid-template-columns:3px 1fr 40px 22px 20px 20px;align-items:center;gap:7px;padding:3px 0;transition:opacity .25s}
  .trk .bar{width:3px;height:15px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
  .trk .nm{cursor:pointer;color:#d2cde6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trk .meter{position:relative;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
  .trk .meter b{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.35;border-radius:2px}
  .trk .meter u{position:absolute;inset:0;background:linear-gradient(90deg,var(--c),#fff);opacity:0;transform-origin:left;transform:scaleX(.2)}
  .trk .n{color:var(--faint);font-variant-numeric:tabular-nums;text-align:right;font-size:11px}
  .trk button{width:20px;height:18px;border-radius:3px;font-size:10px;font-weight:600;border:1px solid rgba(255,255,255,.14);color:var(--faint);font-family:ui-monospace,Menlo,monospace;transition:.15s}
  .trk button:hover{color:var(--ink);border-color:rgba(255,255,255,.35)}
  .trk button.m.on{background:#3d7bff;border-color:#3d7bff;color:#fff;box-shadow:0 0 10px rgba(61,123,255,.5)}
  .trk button.s.on{background:#ffcc33;border-color:#ffcc33;color:#1a1400;box-shadow:0 0 10px rgba(255,204,51,.5)}
  .trk.silent{opacity:.32}
  #mixer .mfoot{margin-top:7px;font-size:10px;color:var(--faint);letter-spacing:.06em;line-height:1.6}
  /* chrome that fades in fullscreen when the mouse rests */
  .chrome{transition:opacity .8s}
  body.fs.idle .chrome{opacity:0;pointer-events:none}
  body.fs.idle canvas{cursor:none}
  #fs{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--dim)}
  #fs:hover{color:var(--ink)}
  #fs svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  body.fs #fs .enter, body:not(.fs) #fs .exit{display:none}

  /* gravity list */
  #gwrap{right:28px;top:148px;width:230px;display:flex;flex-direction:column;align-items:flex-end}
  #gtoggle{display:inline-flex;gap:8px;align-items:center;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--glass);font-size:12px;color:var(--dim);letter-spacing:.12em;backdrop-filter:blur(10px);transition:.25s;max-width:230px}
  #gtoggle:hover{color:var(--ink);border-color:rgba(220,210,255,.4)}
  #gtoggle em{font-style:normal;color:#ffe2b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #gtoggle svg{width:9px;height:9px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .3s}
  #gwrap.open #gtoggle svg{transform:rotate(180deg)}
  #gravity{width:230px;margin-top:10px;font-size:12px;scrollbar-width:none;max-height:0;overflow:hidden;opacity:0;transition:max-height .5s ease,opacity .35s}
  #gwrap.open #gravity{max-height:calc(100vh - 280px);overflow:auto;opacity:1;background:rgba(10,10,24,.5);border:1px solid var(--line);border-radius:12px;padding:12px 16px;backdrop-filter:blur(8px)}
  #gravity::-webkit-scrollbar{display:none}
  #gravity h3,#detail h3.sec{font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.2em;margin:14px 0 6px}
  #gravity h3:first-child{margin-top:0}
  #gravity button{display:flex;width:100%;justify-content:space-between;padding:4px 8px;margin:0 -8px;border-radius:6px;color:var(--dim);transition:.2s}
  #gravity button:hover,#gravity button.on{background:rgba(200,190,255,.1);color:var(--ink)}
  #gravity button span:last-child{color:var(--faint);font-variant-numeric:tabular-nums}

  /* timeline */
  #timeline{left:50%;transform:translateX(-50%);bottom:26px;width:min(760px,calc(100vw - 56px));display:flex;align-items:center;gap:16px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 20px 10px 10px;backdrop-filter:blur(10px)}
  #play{width:34px;height:34px;border-radius:50%;background:rgba(200,190,255,.14);display:grid;place-items:center;flex:none}
  #play svg{width:12px;height:12px;fill:var(--ink)}
  #track{position:relative;flex:1;height:34px;cursor:pointer}
  #track .rail{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
  #track .fill{position:absolute;left:0;top:50%;height:1px;background:linear-gradient(90deg,#6d5cff,#ffd38a)}
  #track .knob{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}
  #track .tick{position:absolute;top:50%;width:1px;height:6px;margin-top:-3px;background:var(--faint)}
  #track .yr{position:absolute;top:calc(50% + 7px);font-size:10px;color:var(--faint);transform:translateX(-50%);font-variant-numeric:tabular-nums}
  #track .hist{position:absolute;bottom:50%;width:3px;margin-left:-1.5px;background:rgba(200,190,255,.28);border-radius:2px 2px 0 0}
  #year{font-family:var(--serif);font-size:20px;min-width:58px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.05em}

  /* narration */
  #caption{left:50%;bottom:104px;transform:translateX(-50%);width:min(640px,calc(100vw - 56px));text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s}
  #caption.show{opacity:1}
  #caption .era{font-size:11px;letter-spacing:.32em;color:#ffd38a;margin-bottom:10px}
  #caption .txt{font-family:var(--serif);font-size:17px;line-height:1.9;color:var(--ink);text-shadow:0 0 18px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.9)}

  /* tooltip */
  #tip{pointer-events:none;padding:9px 12px;background:rgba(8,8,20,.86);border:1px solid var(--line);border-radius:8px;font-size:12px;max-width:260px;opacity:0;transition:opacity .15s;backdrop-filter:blur(6px)}
  #tip.show{opacity:1}
  #tip .t{font-size:13px;color:var(--ink);margin-bottom:3px}
  #tip .m{color:var(--dim);font-size:11px}

  /* detail panel */
  #detail{--detail-pad:30px;top:0;right:0;bottom:0;width:min(380px,100vw);background:rgba(8,8,22,.86);border-left:1px solid var(--line);backdrop-filter:blur(16px);padding:0 var(--detail-pad) 30px;overflow:auto;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:8}
  #detail:not(.open){pointer-events:none}
  #detail.open{transform:none}
  #detail{transition:transform .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1),padding .45s}
  #detail.reading{--detail-pad:clamp(20px,7vw,52px);width:min(720px,100vw);padding-bottom:64px}
  #detail.restoring-list{transition-property:transform}
  #detail .detail-toolbar{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;margin-inline:calc(-1 * var(--detail-pad));padding-inline:var(--detail-pad) 8px;background:#0b0b1a}
  #detail .list-back{min-height:44px;color:#cfcae2;font-size:13px;letter-spacing:.08em}
  #detail .list-back:hover{color:#fff}
  #detail .readbtn{margin-top:20px;display:inline-flex;gap:10px;align-items:center;padding:9px 18px;border:1px solid rgba(220,210,255,.3);border-radius:999px;font-size:13px;letter-spacing:.14em;color:var(--ink);transition:.25s}
  #detail .readbtn:hover{background:rgba(220,210,255,.1);border-color:rgba(220,210,255,.6)}
  #detail .readbtn small{color:var(--faint);letter-spacing:.06em;font-size:11px}
  #detail .back{font-size:12px;color:var(--dim);letter-spacing:.14em;margin-bottom:20px}
  #detail .back:hover{color:var(--ink)}
  #detail .meta{font-size:11px;color:var(--faint);letter-spacing:.14em;margin:-2px 0 26px}
  .article{font-family:var(--serif);font-size:16.5px;line-height:2.05;color:#dedaf0;letter-spacing:.02em;word-break:break-word}
  .article p{margin:0 0 1.15em}
  .article h2,.article h3,.article h4{font-weight:400;color:#fff;margin:1.6em 0 .6em;line-height:1.5}
  .article h2{font-size:20px}.article h3{font-size:18px}.article h4{font-size:16px}
  .article strong{color:#fff;font-weight:600}
  .article blockquote{border-left:2px solid rgba(255,214,160,.5);padding:2px 0 2px 16px;margin:0 0 1.1em;color:#d8cfbd}
  .article ul,.article ol{margin:0 0 1.15em 1.4em}
  .article li{margin:.25em 0}
  .article hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
  .article pre{background:rgba(255,255,255,.04);padding:12px 14px;border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.6;margin:0 0 1.2em;white-space:pre-wrap}
  .article code{font-family:ui-monospace,Menlo,monospace;font-size:.88em}
  .article a{color:#c3b8ff}
  .article .img{color:var(--faint);font-size:.85em}
  #detail .nav{display:flex;justify-content:space-between;gap:16px;margin:36px 0 6px;padding-top:18px;border-top:1px solid var(--line)}
  #detail .nav button{font-size:13px;color:var(--dim);text-align:left;max-width:48%;line-height:1.6;font-family:var(--serif)}
  #detail .nav button.next{text-align:right;margin-left:auto}
  #detail .nav button:hover{color:var(--ink)}
  #detail .nav small{display:block;color:var(--faint);letter-spacing:.14em;font-family:var(--sans);font-size:11px}
  #sound{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--dim);transition:color .2s}
  #sound:hover{color:var(--ink)}
  #sound svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  #sound.off .wave{display:none}
  #sound:not(.off) .x{display:none}
  #prologue .note{margin-top:20px;font-size:11px;color:var(--faint);letter-spacing:.2em}
  #detail .close{margin-left:auto;width:44px;height:44px;color:var(--dim);font-size:20px;line-height:1}
  #detail .kicker{font-size:11px;letter-spacing:.24em;color:var(--dim);display:flex;align-items:center;gap:8px}
  #detail .kicker i{width:8px;height:8px;border-radius:50%;display:inline-block}
  #detail h2{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.5;margin:12px 0 10px}
  #detail .sum{font-family:var(--serif);font-size:15px;line-height:1.9;color:#d6d2e8}
  #detail .secret{margin-top:20px;padding:14px 16px;border:1px dashed rgba(220,210,255,.25);border-radius:12px;font-size:13px;letter-spacing:.14em;color:var(--dim);line-height:1.8}
  #detail .secret b{display:block;font-weight:400;font-family:var(--serif);font-size:15px;color:var(--ink);letter-spacing:.3em;margin-bottom:4px}
  #detail .secret i{font-style:normal;color:var(--faint);letter-spacing:.02em;word-break:break-all}
  #detail .mood{display:inline-block;margin-top:14px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--dim);letter-spacing:.15em}
  #detail .chips{display:flex;flex-wrap:wrap;gap:6px}
  #detail .chips button{padding:4px 10px;border-radius:999px;background:rgba(200,190,255,.08);font-size:12px;color:var(--dim);transition:.2s}
  #detail .chips button:hover{background:rgba(200,190,255,.18);color:var(--ink)}
  #detail .list button{display:block;width:100%;text-align:left;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;color:#cfcae2}
  #detail .list button:hover{color:#fff}
  #detail .list small{color:var(--faint);font-variant-numeric:tabular-nums;margin-right:8px}
  #detail .path{margin-top:22px;font-size:11px;color:var(--faint);word-break:break-all}

  /* prologue */
  #prologue{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(3,4,10,.55),rgba(3,4,10,.96) 70%);transition:opacity 1.6s}
  #prologue.gone{opacity:0;pointer-events:none}
  #prologue .box{max-width:560px;padding:0 28px;text-align:center}
  #prologue .k{font-size:11px;letter-spacing:.4em;color:var(--dim)}
  #prologue h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4.4vw,42px);letter-spacing:.14em;margin:22px 0 28px;line-height:1.5}
  #prologue p{font-family:var(--serif);font-size:16px;line-height:2.1;color:#cfcae2}
  #prologue .sig{margin-top:18px;color:var(--dim);font-size:13px}
  #prologue .go{margin-top:38px;display:inline-flex;gap:14px}
  #prologue .go button{padding:11px 26px;border:1px solid rgba(220,210,255,.3);border-radius:999px;letter-spacing:.24em;font-size:13px;transition:.3s}
  #prologue .go button:hover{background:rgba(220,210,255,.1);border-color:rgba(220,210,255,.6)}
  #prologue .go button.ghost{border-color:transparent;color:var(--dim)}

  #hint{left:50%;transform:translateX(-50%);bottom:82px;font-size:11px;color:var(--faint);letter-spacing:.14em;pointer-events:none;transition:opacity 1s}
  body.embed .ui, body.embed #prologue{display:none!important}
  body.embed canvas{cursor:default}
  @media (max-width:820px){#gwrap,#mixer,#viewdesc{display:none}#stats{display:none}#title{top:18px;left:16px;max-width:220px}#title h1{font-size:19px}#home{top:17px;right:16px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="ui chrome"><h1 id="metaTitle">一個生命體的宇宙</h1><p id="metaSub"></p></div>
<a id="home" class="ui chrome" href="../index.html" aria-label="返回 Life Cosmos 專案首頁">← 專案首頁</a>
<div id="stats" class="ui chrome"></div>
<div id="views" class="ui chrome">
  <button data-v="galaxy" class="on">時間銀河</button>
  <button data-v="constellation">主題星座</button>
  <button data-v="gravity">恆星系</button>
</div>
<button id="reset" class="ui chrome" title="回到原本的宇宙（R）"><svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.5 2.5v3h3"/></svg>還原宇宙</button>
<div id="viewdesc" class="ui chrome"></div>
<div id="mixer" class="ui chrome">
  <div class="mhead"><span>記憶軌道</span><button data-all="on" title="全部打開">全開</button><button data-all="off" title="全部關掉，再一軌一軌打開">全關</button></div>
  <div id="tracks"></div>
  <div class="mfoot">S 獨奏（可多軌疊加，⌥ 點擊只留這一軌）· M 靜音 · 點軌名＝開／關</div>
</div>
<div id="gwrap" class="ui chrome"><button id="gtoggle" aria-expanded="false"><span>引力中心</span><em></em><svg viewBox="0 0 10 10"><path d="M1.5 3.5L5 7l3.5-3.5"/></svg></button><div id="gravity"></div></div>
<div id="caption" class="ui"><div class="era"></div><div class="txt"></div></div>
<div id="hint" class="ui chrome">拖曳旋轉 · 滾輪朝游標縮放 · Shift／右鍵拖曳平移 · 雙擊星星飛近 · R 還原宇宙 · F 全螢幕</div>
<div id="timeline" class="ui chrome">
  <button id="play" aria-label="播放"><svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg></button>
  <div id="track"><div class="rail"></div><div class="fill"></div><div class="knob"></div></div>
  <div id="year">2026</div>
  <button id="sound" aria-label="聲音開關" title="聲音（全部即時合成）"><svg viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path class="wave" d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6.3 6.3 0 0 1 0 9"/><path class="x" d="M11 6l4 4M15 6l-4 4"/></svg></button>
  <button id="fs" aria-label="全螢幕" title="全螢幕（F）"><svg viewBox="0 0 16 16"><path class="enter" d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/><path class="exit" d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg></button>
</div>
<div id="tip" class="ui"></div>
<aside id="detail" class="ui">
  <div class="detail-toolbar">
    <button type="button" id="detailListBack" class="list-back" hidden>‹ 返回列表</button>
    <button type="button" class="close" aria-label="關閉">×</button>
  </div>
  <div id="dbody"></div>
</aside>

<div id="prologue">
  <div class="box">
    <div class="k">A LIFE, SEEN FROM VERY FAR AWAY</div>
    <h1 id="proTitle">一個生命體的宇宙</h1>
    <p id="prologueText"></p>
    <div class="sig" id="prologueSig"></div>
    <div class="go"><button id="begin">從大爆炸開始</button><button id="skip" class="ghost">直接看全貌</button></div>
    <div class="go" style="margin-top:12px"><button id="fsgo" class="ghost">⛶ 全螢幕進入宇宙</button></div>
    <div class="note">聲音由瀏覽器即時合成 · 建議戴耳機</div>
  </div>
</div>

<script>
const DATA = {"categories":{"coast":{"label":"海岸","color":"#69c9d0"},"home":{"label":"家與日常","color":"#ffbd71"},"love":{"label":"愛與親密","color":"#ff7f9d"},"kin":{"label":"家族","color":"#e8cf83"},"body":{"label":"身體","color":"#a6da8d"},"craft":{"label":"器物與手作","color":"#9aa7ff"},"work":{"label":"生計","color":"#aeb5c7"},"field":{"label":"田野","color":"#7fd8a2"},"travel":{"label":"遠行","color":"#71aef5"},"thought":{"label":"思索與怪事","color":"#c5a4f8"}},"docs":[{"id":"d0","t":"今天的風不肯直走｜帆布工具袋","d":"2001-01-12","y":2001.0301,"c":"coast","s":"20 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見第一次離開恆春住進台南留下的影響。","m":"好奇","f":"memories/2001-01-12-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,4,5,6],"deg":7,"b":"2001-01-12，空氣黏得每張紙都捲邊。20 歲的許思明正在經歷「第一次離開恆春住進台南」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":394},{"id":"d1","t":"市場開門以前｜帆布工具袋","d":"2001-01-30","y":2001.0795,"c":"home","s":"20 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見第一次離開恆春住進台南留下的影響。","m":"自嘲","f":"memories/2001-01-30-02-market.md","k":9,"arm":0,"ents":[7,8,9,3,4,10,11,12],"deg":8,"b":"2001-01-30，南方的光白得像鹽。20 歲的許思明正在經歷「第一次離開恆春住進台南」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":384},{"id":"d2","t":"維修單上的壞脾氣｜帆布工具袋","d":"2001-02-18","y":2001.1299,"c":"craft","s":"20 歲的許思明在南方海岸藝術學院工坊經歷「維修單上的壞脾氣」，也重新看見第一次離開恆春住進台南留下的影響。","m":"專注","f":"memories/2001-02-18-03-repair.md","k":10,"arm":1,"ents":[13,14,9,3,4,15,12],"deg":7,"b":"2001-02-18，午後雷雨把街面洗成深灰。20 歲的許思明正在經歷「第一次離開恆春住進台南」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有遠處機車聲被風切成斷句。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":365},{"id":"d3","t":"街角黑狗的巡邏路線｜帆布工具袋","d":"2001-03-08","y":2001.1858,"c":"home","s":"20 歲的許思明在恆春舊城經歷「街角黑狗的巡邏路線」，也重新看見第一次離開恆春住進台南留下的影響。","m":"柔軟","f":"memories/2001-03-08-04-dog.md","k":7,"arm":0,"ents":[16,1,2,3,4,10,17,12],"deg":9,"b":"2001-03-08，午後雷雨把街面洗成深灰。20 歲的許思明正在經歷「第一次離開恆春住進台南」。她今天給自己的工作很簡單：跟著一隻沒有名字的黑狗繞過兩條街，在每個牠停下來的地方記一筆，最後把觀察交給市場口的餵狗阿姨。\n\n現場有紙張受潮後像剛醒來的皮膚。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":360},{"id":"d4","t":"給遠方的一封慢信｜帆布工具袋","d":"2001-03-26","y":2001.2352,"c":"love","s":"20 歲的許思明在南方海岸藝術學院工坊經歷「給遠方的一封慢信」，也重新看見第一次離開恆春住進台南留下的影響。","m":"遲疑","f":"memories/2001-03-26-05-letter.md","k":5,"arm":0,"ents":[18,19,9,3,4,15,6],"deg":7,"b":"2001-03-26，午後雷雨把街面洗成深灰。20 歲的許思明正在經歷「第一次離開恆春住進台南」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":352},{"id":"d5","t":"樣方偏了七公分｜帆布工具袋","d":"2001-04-13","y":2001.2829,"c":"field","s":"20 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見在材料課把漂流木做成一把太重的椅子留下的影響。","m":"好奇","f":"memories/2001-04-13-06-field.md","k":7,"arm":1,"ents":[20,21,9,3,4,10,22,12],"deg":9,"b":"2001-04-13，風停了，連狗都顯得不習慣。20 歲的許思明正在經歷「在材料課把漂流木做成一把太重的椅子」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有遠處機車聲被風切成斷句。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":365},{"id":"d6","t":"零錢盒與月底｜帆布工具袋","d":"2001-05-02","y":2001.3361,"c":"work","s":"20 歲的許思明在南方海岸藝術學院工坊經歷「零錢盒與月底」，也重新看見在材料課把漂流木做成一把太重的椅子留下的影響。","m":"自嘲","f":"memories/2001-05-02-07-money.md","k":2,"arm":1,"ents":[23,24,2,3,4,15,12],"deg":7,"b":"2001-05-02，午後雷雨把街面洗成深灰。20 歲的許思明正在經歷「在材料課把漂流木做成一把太重的椅子」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":424},{"id":"d7","t":"颱風來前的四小時｜帆布工具袋","d":"2001-05-20","y":2001.3854,"c":"coast","s":"20 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見在材料課把漂流木做成一把太重的椅子留下的影響。","m":"專注","f":"memories/2001-05-20-08-storm.md","k":7,"arm":0,"ents":[25,26,9,3,4,10,27,12],"deg":9,"b":"2001-05-20，空氣黏得每張紙都捲邊。20 歲的許思明正在經歷「在材料課把漂流木做成一把太重的椅子」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":396},{"id":"d8","t":"一鍋太酸的湯｜帆布工具袋","d":"2001-06-07","y":2001.4331,"c":"kin","s":"20 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見在材料課把漂流木做成一把太重的椅子留下的影響。","m":"柔軟","f":"memories/2001-06-07-09-meal.md","k":9,"arm":0,"ents":[28,7,9,3,4,29,6],"deg":7,"b":"2001-06-07，空氣黏得每張紙都捲邊。20 歲的許思明正在經歷「在材料課把漂流木做成一把太重的椅子」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有市場冰塊融水流過鞋底。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":377},{"id":"d9","t":"把夜聲收進錄音帶｜帆布工具袋","d":"2001-06-25","y":2001.4824,"c":"thought","s":"20 歲的許思明在南方海岸藝術學院工坊經歷「把夜聲收進錄音帶」，也重新看見在材料課把漂流木做成一把太重的椅子留下的影響。","m":"遲疑","f":"memories/2001-06-25-10-radio.md","k":7,"arm":1,"ents":[30,31,2,3,4,10,15,12],"deg":8,"b":"2001-06-25，午後雷雨把街面洗成深灰。20 歲的許思明正在經歷「在材料課把漂流木做成一把太重的椅子」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有紙張受潮後像剛醒來的皮膚。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":360},{"id":"d10","t":"關店後的城牆｜帆布工具袋","d":"2001-07-14","y":2001.5356,"c":"body","s":"20 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見認識念偶戲的季穗留下的影響。","m":"好奇","f":"memories/2001-07-14-11-walk.md","k":1,"arm":0,"ents":[32,33,9,3,4,34,12],"deg":7,"b":"2001-07-14，雲壓得很低，海卻異常平。20 歲的許思明正在經歷「認識念偶戲的季穗」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有紙張受潮後像剛醒來的皮膚。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":348},{"id":"d11","t":"旅人帶來的破東西｜帆布工具袋","d":"2001-08-01","y":2001.5833,"c":"travel","s":"20 歲的許思明在南方海岸藝術學院工坊經歷「旅人帶來的破東西」，也重新看見認識念偶戲的季穗留下的影響。","m":"自嘲","f":"memories/2001-08-01-12-visitor.md","k":10,"arm":1,"ents":[35,13,9,3,4,10,15,12],"deg":8,"b":"2001-08-01，雲壓得很低，海卻異常平。20 歲的許思明正在經歷「認識念偶戲的季穗」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有遠處機車聲被風切成斷句。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到南方海岸藝術學院工坊。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":366},{"id":"d12","t":"母親說只是順便｜帆布工具袋","d":"2001-08-19","y":2001.6326,"c":"kin","s":"20 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見認識念偶戲的季穗留下的影響。","m":"專注","f":"memories/2001-08-19-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,4,29,6],"deg":7,"b":"2001-08-19，午後雷雨把街面洗成深灰。20 歲的許思明正在經歷「認識念偶戲的季穗」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":386},{"id":"d13","t":"父親的工具牆｜帆布工具袋","d":"2001-09-06","y":2001.6804,"c":"kin","s":"20 歲的許思明在父親的電器行經歷「父親的工具牆」，也重新看見認識念偶戲的季穗留下的影響。","m":"柔軟","f":"memories/2001-09-06-14-father.md","k":7,"arm":0,"ents":[38,39,9,3,4,10,40,12],"deg":10,"b":"2001-09-06，雲壓得很低，海卻異常平。20 歲的許思明正在經歷「認識念偶戲的季穗」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":386},{"id":"d14","t":"兩個人各自沉默｜帆布工具袋","d":"2001-09-25","y":2001.7324,"c":"love","s":"20 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見認識念偶戲的季穗留下的影響。","m":"遲疑","f":"memories/2001-09-25-15-love.md","k":1,"arm":0,"ents":[18,41,9,3,4,42,12],"deg":7,"b":"2001-09-25，南方的光白得像鹽。20 歲的許思明正在經歷「認識念偶戲的季穗」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有曬熱木板摸起來微微發黏。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":353},{"id":"d15","t":"紙袋裡的種子｜帆布工具袋","d":"2001-10-13","y":2001.7829,"c":"field","s":"20 歲的許思明在南方海岸藝術學院工坊經歷「紙袋裡的種子」，也重新看見決定把每次失敗都寫進藍色簿子留下的影響。","m":"好奇","f":"memories/2001-10-13-16-seed.md","k":7,"arm":1,"ents":[43,44,2,3,4,10,15,12],"deg":8,"b":"2001-10-13，風停了，連狗都顯得不習慣。20 歲的許思明正在經歷「決定把每次失敗都寫進藍色簿子」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有曬熱木板摸起來微微發黏。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":355},{"id":"d16","t":"昨夜夢見店長出鰓｜帆布工具袋","d":"2001-10-31","y":2001.8322,"c":"thought","s":"20 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見決定把每次失敗都寫進藍色簿子留下的影響。","m":"自嘲","f":"memories/2001-10-31-17-dream.md","k":5,"arm":1,"ents":[45,46,9,3,4,47,6],"deg":7,"b":"2001-10-31，落山風把招牌吹得咯咯響。20 歲的許思明正在經歷「決定把每次失敗都寫進藍色簿子」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有鹽粒卡在手腕細小的傷口。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":343},{"id":"d17","t":"離開半島的一天｜帆布工具袋","d":"2001-11-18","y":2001.8799,"c":"travel","s":"20 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見決定把每次失敗都寫進藍色簿子留下的影響。","m":"專注","f":"memories/2001-11-18-18-trip.md","k":7,"arm":1,"ents":[48,49,9,3,4,10,50,12],"deg":9,"b":"2001-11-18，午後雷雨把街面洗成深灰。20 歲的許思明正在經歷「決定把每次失敗都寫進藍色簿子」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有曬熱木板摸起來微微發黏。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":368},{"id":"d18","t":"無法分類的下午｜帆布工具袋","d":"2001-12-07","y":2001.9331,"c":"thought","s":"20 歲的許思明在南方海岸藝術學院工坊經歷「無法分類的下午」，也重新看見決定把每次失敗都寫進藍色簿子留下的影響。","m":"柔軟","f":"memories/2001-12-07-19-odd.md","k":2,"arm":1,"ents":[51,52,2,3,4,15,12],"deg":7,"b":"2001-12-07，風停了，連狗都顯得不習慣。20 歲的許思明正在經歷「決定把每次失敗都寫進藍色簿子」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":417},{"id":"d19","t":"年末不完整清單｜帆布工具袋","d":"2001-12-25","y":2001.9824,"c":"thought","s":"20 歲的許思明在南方海岸藝術學院工坊經歷「年末不完整清單」，也重新看見決定把每次失敗都寫進藍色簿子留下的影響。","m":"遲疑","f":"memories/2001-12-25-20-inventory.md","k":7,"arm":1,"ents":[53,54,9,3,4,10,15,12],"deg":8,"b":"2001-12-25，南方的光白得像鹽。20 歲的許思明正在經歷「決定把每次失敗都寫進藍色簿子」。她今天給自己的工作很簡單：盤點留下、送走、修好與仍然不明白的東西，故意保留空白，不把一年假裝成已經結案。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。在虛構的南方海岸藝術學院念材料敘事系，白天學木工與植物辨識，晚上在租屋處替壞掉的電扇命名。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":384},{"id":"d20","t":"今天的風不肯直走｜藍邊搪瓷碗","d":"2002-01-13","y":2002.0329,"c":"coast","s":"21 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見季穗第一次跟她回恆春留下的影響。","m":"雀躍","f":"memories/2002-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,4,5,6],"deg":7,"b":"2002-01-13，空氣黏得每張紙都捲邊。21 歲的許思明正在經歷「季穗第一次跟她回恆春」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":397},{"id":"d21","t":"市場開門以前｜藍邊搪瓷碗","d":"2002-02-01","y":2002.0833,"c":"home","s":"21 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見季穗第一次跟她回恆春留下的影響。","m":"自嘲","f":"memories/2002-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,55,3,4,56,11,12],"deg":8,"b":"2002-02-01，風停了，連狗都顯得不習慣。21 歲的許思明正在經歷「季穗第一次跟她回恆春」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":398},{"id":"d22","t":"維修單上的壞脾氣｜藍邊搪瓷碗","d":"2002-02-20","y":2002.1354,"c":"craft","s":"21 歲的許思明在南方海岸藝術學院工坊經歷「維修單上的壞脾氣」，也重新看見季穗第一次跟她回恆春留下的影響。","m":"專注","f":"memories/2002-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,55,3,4,15,12],"deg":7,"b":"2002-02-20，落山風把招牌吹得咯咯響。21 歲的許思明正在經歷「季穗第一次跟她回恆春」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有市場冰塊融水流過鞋底。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":361},{"id":"d23","t":"街角黑狗的巡邏路線｜藍邊搪瓷碗","d":"2002-03-11","y":2002.1941,"c":"home","s":"21 歲的許思明在恆春舊城經歷「街角黑狗的巡邏路線」，也重新看見季穗第一次跟她回恆春留下的影響。","m":"柔軟","f":"memories/2002-03-11-04-dog.md","k":8,"arm":0,"ents":[16,1,2,3,4,56,17,12],"deg":8,"b":"2002-03-11，雲壓得很低，海卻異常平。21 歲的許思明正在經歷「季穗第一次跟她回恆春」。她今天給自己的工作很簡單：跟著一隻沒有名字的黑狗繞過兩條街，在每個牠停下來的地方記一筆，最後把觀察交給市場口的餵狗阿姨。\n\n現場有遠處機車聲被風切成斷句。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":362},{"id":"d24","t":"給遠方的一封慢信｜藍邊搪瓷碗","d":"2002-03-31","y":2002.2489,"c":"love","s":"21 歲的許思明在南方海岸藝術學院工坊經歷「給遠方的一封慢信」，也重新看見季穗第一次跟她回恆春留下的影響。","m":"遲疑","f":"memories/2002-03-31-05-letter.md","k":5,"arm":0,"ents":[18,19,55,3,4,15,6],"deg":7,"b":"2002-03-31，雲壓得很低，海卻異常平。21 歲的許思明正在經歷「季穗第一次跟她回恆春」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":340},{"id":"d25","t":"樣方偏了七公分｜藍邊搪瓷碗","d":"2002-04-19","y":2002.2993,"c":"field","s":"21 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見父親嫌她做的碗不能盛湯留下的影響。","m":"雀躍","f":"memories/2002-04-19-06-field.md","k":8,"arm":1,"ents":[20,21,55,3,4,56,22,12],"deg":10,"b":"2002-04-19，午後雷雨把街面洗成深灰。21 歲的許思明正在經歷「父親嫌她做的碗不能盛湯」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有鐵鏽和九層塔混在一起的氣味。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":364},{"id":"d26","t":"零錢盒與月底｜藍邊搪瓷碗","d":"2002-05-08","y":2002.3525,"c":"work","s":"21 歲的許思明在南方海岸藝術學院工坊經歷「零錢盒與月底」，也重新看見父親嫌她做的碗不能盛湯留下的影響。","m":"自嘲","f":"memories/2002-05-08-07-money.md","k":2,"arm":1,"ents":[23,24,2,3,4,15,12],"deg":7,"b":"2002-05-08，落山風把招牌吹得咯咯響。21 歲的許思明正在經歷「父親嫌她做的碗不能盛湯」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":406},{"id":"d27","t":"颱風來前的四小時｜藍邊搪瓷碗","d":"2002-05-27","y":2002.4046,"c":"coast","s":"21 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見父親嫌她做的碗不能盛湯留下的影響。","m":"專注","f":"memories/2002-05-27-08-storm.md","k":8,"arm":0,"ents":[25,26,55,3,4,56,27,12],"deg":10,"b":"2002-05-27，午後雷雨把街面洗成深灰。21 歲的許思明正在經歷「父親嫌她做的碗不能盛湯」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鐵鏽和九層塔混在一起的氣味。那不是象徵，只是我確實站在那裡。\n\n現場有鐵鏽和九層塔混在一起的氣味。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":384},{"id":"d28","t":"一鍋太酸的湯｜藍邊搪瓷碗","d":"2002-06-15","y":2002.455,"c":"kin","s":"21 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見父親嫌她做的碗不能盛湯留下的影響。","m":"柔軟","f":"memories/2002-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,55,3,4,29,6],"deg":7,"b":"2002-06-15，風停了，連狗都顯得不習慣。21 歲的許思明正在經歷「父親嫌她做的碗不能盛湯」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有遠處機車聲被風切成斷句。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":363},{"id":"d29","t":"把夜聲收進錄音帶｜藍邊搪瓷碗","d":"2002-07-05","y":2002.511,"c":"thought","s":"21 歲的許思明在南方海岸藝術學院工坊經歷「把夜聲收進錄音帶」，也重新看見父親嫌她做的碗不能盛湯留下的影響。","m":"遲疑","f":"memories/2002-07-05-10-radio.md","k":8,"arm":1,"ents":[30,31,2,3,4,56,15,12],"deg":8,"b":"2002-07-05，南方的光白得像鹽。21 歲的許思明正在經歷「父親嫌她做的碗不能盛湯」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有鐵鏽和九層塔混在一起的氣味。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":357},{"id":"d30","t":"關店後的城牆｜藍邊搪瓷碗","d":"2002-07-24","y":2002.563,"c":"body","s":"21 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見兩人在西門外吵完又去吃綠豆蒜留下的影響。","m":"雀躍","f":"memories/2002-07-24-11-walk.md","k":1,"arm":0,"ents":[32,33,55,3,4,34,12],"deg":7,"b":"2002-07-24，空氣黏得每張紙都捲邊。21 歲的許思明正在經歷「兩人在西門外吵完又去吃綠豆蒜」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":327},{"id":"d31","t":"旅人帶來的破東西｜藍邊搪瓷碗","d":"2002-08-12","y":2002.6135,"c":"travel","s":"21 歲的許思明在南方海岸藝術學院工坊經歷「旅人帶來的破東西」，也重新看見兩人在西門外吵完又去吃綠豆蒜留下的影響。","m":"自嘲","f":"memories/2002-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,55,3,4,56,15,12],"deg":8,"b":"2002-08-12，空氣黏得每張紙都捲邊。21 歲的許思明正在經歷「兩人在西門外吵完又去吃綠豆蒜」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有鹽粒卡在手腕細小的傷口。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到南方海岸藝術學院工坊。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":370},{"id":"d32","t":"母親說只是順便｜藍邊搪瓷碗","d":"2002-08-31","y":2002.6655,"c":"kin","s":"21 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見兩人在西門外吵完又去吃綠豆蒜留下的影響。","m":"專注","f":"memories/2002-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,4,29,6],"deg":7,"b":"2002-08-31，風停了，連狗都顯得不習慣。21 歲的許思明正在經歷「兩人在西門外吵完又去吃綠豆蒜」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":399},{"id":"d33","t":"父親的工具牆｜藍邊搪瓷碗","d":"2002-09-20","y":2002.7187,"c":"kin","s":"21 歲的許思明在父親的電器行經歷「父親的工具牆」，也重新看見兩人在西門外吵完又去吃綠豆蒜留下的影響。","m":"柔軟","f":"memories/2002-09-20-14-father.md","k":8,"arm":0,"ents":[38,39,55,3,4,56,40,12],"deg":9,"b":"2002-09-20，午後雷雨把街面洗成深灰。21 歲的許思明正在經歷「兩人在西門外吵完又去吃綠豆蒜」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鐵鏽和九層塔混在一起的氣味。那不是象徵，只是我確實站在那裡。\n\n現場有鐵鏽和九層塔混在一起的氣味。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":398},{"id":"d34","t":"兩個人各自沉默｜藍邊搪瓷碗","d":"2002-10-09","y":2002.7719,"c":"love","s":"21 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見兩人在西門外吵完又去吃綠豆蒜留下的影響。","m":"遲疑","f":"memories/2002-10-09-15-love.md","k":1,"arm":0,"ents":[18,41,55,3,4,42,12],"deg":7,"b":"2002-10-09，雲壓得很低，海卻異常平。21 歲的許思明正在經歷「兩人在西門外吵完又去吃綠豆蒜」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有市場冰塊融水流過鞋底。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":367},{"id":"d35","t":"紙袋裡的種子｜藍邊搪瓷碗","d":"2002-10-28","y":2002.824,"c":"field","s":"21 歲的許思明在南方海岸藝術學院工坊經歷「紙袋裡的種子」，也重新看見她在期末展寫下器物也會記仇留下的影響。","m":"雀躍","f":"memories/2002-10-28-16-seed.md","k":8,"arm":1,"ents":[43,44,2,3,4,56,15,12],"deg":8,"b":"2002-10-28，午後雷雨把街面洗成深灰。21 歲的許思明正在經歷「她在期末展寫下器物也會記仇」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有鹽粒卡在手腕細小的傷口。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":351},{"id":"d36","t":"昨夜夢見店長出鰓｜藍邊搪瓷碗","d":"2002-11-16","y":2002.8744,"c":"thought","s":"21 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見她在期末展寫下器物也會記仇留下的影響。","m":"自嘲","f":"memories/2002-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,55,3,4,47,6],"deg":7,"b":"2002-11-16，風停了，連狗都顯得不習慣。21 歲的許思明正在經歷「她在期末展寫下器物也會記仇」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":341},{"id":"d37","t":"離開半島的一天｜藍邊搪瓷碗","d":"2002-12-05","y":2002.9276,"c":"travel","s":"21 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見她在期末展寫下器物也會記仇留下的影響。","m":"專注","f":"memories/2002-12-05-18-trip.md","k":8,"arm":1,"ents":[48,49,55,3,4,56,50,12],"deg":10,"b":"2002-12-05，南方的光白得像鹽。21 歲的許思明正在經歷「她在期末展寫下器物也會記仇」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有鹽粒卡在手腕細小的傷口。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":375},{"id":"d38","t":"無法分類的下午｜藍邊搪瓷碗","d":"2002-12-25","y":2002.9824,"c":"thought","s":"21 歲的許思明在南方海岸藝術學院工坊經歷「無法分類的下午」，也重新看見她在期末展寫下器物也會記仇留下的影響。","m":"柔軟","f":"memories/2002-12-25-19-odd.md","k":2,"arm":1,"ents":[51,52,2,3,4,15,12],"deg":7,"b":"2002-12-25，落山風把招牌吹得咯咯響。21 歲的許思明正在經歷「她在期末展寫下器物也會記仇」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。大二開始往返恆春與台南，將海岸撿回的種子、鏽釘和市場叫賣聲做成一套沒有用途的餐具。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":414},{"id":"d39","t":"今天的風不肯直走｜裂了一角的石膏月亮","d":"2003-01-13","y":2003.0329,"c":"coast","s":"22 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見通宵修補畢業製作留下的影響。","m":"倔強","f":"memories/2003-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,4,5,6],"deg":7,"b":"2003-01-13，風停了，連狗都顯得不習慣。22 歲的許思明正在經歷「通宵修補畢業製作」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":400},{"id":"d40","t":"市場開門以前｜裂了一角的石膏月亮","d":"2003-02-01","y":2003.0833,"c":"home","s":"22 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見通宵修補畢業製作留下的影響。","m":"自嘲","f":"memories/2003-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,57,3,4,58,11,12],"deg":9,"b":"2003-02-01，落山風把招牌吹得咯咯響。22 歲的許思明正在經歷「通宵修補畢業製作」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":378},{"id":"d41","t":"維修單上的壞脾氣｜裂了一角的石膏月亮","d":"2003-02-20","y":2003.1354,"c":"craft","s":"22 歲的許思明在南方海岸藝術學院工坊經歷「維修單上的壞脾氣」，也重新看見通宵修補畢業製作留下的影響。","m":"專注","f":"memories/2003-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,57,3,4,15,12],"deg":7,"b":"2003-02-20，南方的光白得像鹽。22 歲的許思明正在經歷「通宵修補畢業製作」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有鹽粒卡在手腕細小的傷口。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":354},{"id":"d42","t":"街角黑狗的巡邏路線｜裂了一角的石膏月亮","d":"2003-03-11","y":2003.1941,"c":"home","s":"22 歲的許思明在恆春舊城經歷「街角黑狗的巡邏路線」，也重新看見通宵修補畢業製作留下的影響。","m":"柔軟","f":"memories/2003-03-11-04-dog.md","k":2,"arm":0,"ents":[16,1,2,3,4,58,17,12],"deg":8,"b":"2003-03-11，風停了，連狗都顯得不習慣。22 歲的許思明正在經歷「通宵修補畢業製作」。她今天給自己的工作很簡單：跟著一隻沒有名字的黑狗繞過兩條街，在每個牠停下來的地方記一筆，最後把觀察交給市場口的餵狗阿姨。\n\n現場有鹽粒卡在手腕細小的傷口。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":366},{"id":"d43","t":"給遠方的一封慢信｜裂了一角的石膏月亮","d":"2003-03-31","y":2003.2489,"c":"love","s":"22 歲的許思明在南方海岸藝術學院工坊經歷「給遠方的一封慢信」，也重新看見通宵修補畢業製作留下的影響。","m":"遲疑","f":"memories/2003-03-31-05-letter.md","k":5,"arm":0,"ents":[18,19,57,3,4,15,6],"deg":7,"b":"2003-03-31，午後雷雨把街面洗成深灰。22 歲的許思明正在經歷「通宵修補畢業製作」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":324},{"id":"d44","t":"樣方偏了七公分｜裂了一角的石膏月亮","d":"2003-04-19","y":2003.2993,"c":"field","s":"22 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見母親搭早班車來看展留下的影響。","m":"倔強","f":"memories/2003-04-19-06-field.md","k":1,"arm":1,"ents":[20,21,57,3,4,58,22,12],"deg":9,"b":"2003-04-19，空氣黏得每張紙都捲邊。22 歲的許思明正在經歷「母親搭早班車來看展」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有鹽粒卡在手腕細小的傷口。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":358},{"id":"d45","t":"零錢盒與月底｜裂了一角的石膏月亮","d":"2003-05-08","y":2003.3525,"c":"work","s":"22 歲的許思明在南方海岸藝術學院工坊經歷「零錢盒與月底」，也重新看見母親搭早班車來看展留下的影響。","m":"自嘲","f":"memories/2003-05-08-07-money.md","k":2,"arm":1,"ents":[23,24,2,3,4,15,12],"deg":7,"b":"2003-05-08，午後雷雨把街面洗成深灰。22 歲的許思明正在經歷「母親搭早班車來看展」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":399},{"id":"d46","t":"颱風來前的四小時｜裂了一角的石膏月亮","d":"2003-05-27","y":2003.4046,"c":"coast","s":"22 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見母親搭早班車來看展留下的影響。","m":"專注","f":"memories/2003-05-27-08-storm.md","k":1,"arm":0,"ents":[25,26,57,3,4,58,27,12],"deg":9,"b":"2003-05-27，南方的光白得像鹽。22 歲的許思明正在經歷「母親搭早班車來看展」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":366},{"id":"d47","t":"一鍋太酸的湯｜裂了一角的石膏月亮","d":"2003-06-15","y":2003.455,"c":"kin","s":"22 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見母親搭早班車來看展留下的影響。","m":"柔軟","f":"memories/2003-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,57,3,4,29,6],"deg":7,"b":"2003-06-15，風停了，連狗都顯得不習慣。22 歲的許思明正在經歷「母親搭早班車來看展」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有市場冰塊融水流過鞋底。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":366},{"id":"d48","t":"把夜聲收進錄音帶｜裂了一角的石膏月亮","d":"2003-07-05","y":2003.511,"c":"thought","s":"22 歲的許思明在南方海岸藝術學院工坊經歷「把夜聲收進錄音帶」，也重新看見母親搭早班車來看展留下的影響。","m":"遲疑","f":"memories/2003-07-05-10-radio.md","k":2,"arm":1,"ents":[30,31,2,3,4,58,15,12],"deg":8,"b":"2003-07-05，午後雷雨把街面洗成深灰。22 歲的許思明正在經歷「母親搭早班車來看展」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有曬熱木板摸起來微微發黏。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":346},{"id":"d49","t":"關店後的城牆｜裂了一角的石膏月亮","d":"2003-07-24","y":2003.563,"c":"body","s":"22 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見收到一間城市設計公司的面試通知留下的影響。","m":"倔強","f":"memories/2003-07-24-11-walk.md","k":1,"arm":0,"ents":[32,33,57,3,4,34,12],"deg":7,"b":"2003-07-24，風停了，連狗都顯得不習慣。22 歲的許思明正在經歷「收到一間城市設計公司的面試通知」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":338},{"id":"d50","t":"旅人帶來的破東西｜裂了一角的石膏月亮","d":"2003-08-12","y":2003.6135,"c":"travel","s":"22 歲的許思明在南方海岸藝術學院工坊經歷「旅人帶來的破東西」，也重新看見收到一間城市設計公司的面試通知留下的影響。","m":"自嘲","f":"memories/2003-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,57,3,4,58,15,12],"deg":8,"b":"2003-08-12，南方的光白得像鹽。22 歲的許思明正在經歷「收到一間城市設計公司的面試通知」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有曬熱木板摸起來微微發黏。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到南方海岸藝術學院工坊。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":357},{"id":"d51","t":"母親說只是順便｜裂了一角的石膏月亮","d":"2003-08-31","y":2003.6655,"c":"kin","s":"22 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見收到一間城市設計公司的面試通知留下的影響。","m":"專注","f":"memories/2003-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,4,29,6],"deg":7,"b":"2003-08-31，南方的光白得像鹽。22 歲的許思明正在經歷「收到一間城市設計公司的面試通知」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":403},{"id":"d52","t":"父親的工具牆｜裂了一角的石膏月亮","d":"2003-09-20","y":2003.7187,"c":"kin","s":"22 歲的許思明在父親的電器行經歷「父親的工具牆」，也重新看見收到一間城市設計公司的面試通知留下的影響。","m":"柔軟","f":"memories/2003-09-20-14-father.md","k":1,"arm":0,"ents":[38,39,57,3,4,58,40,12],"deg":8,"b":"2003-09-20，落山風把招牌吹得咯咯響。22 歲的許思明正在經歷「收到一間城市設計公司的面試通知」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得遠處機車聲被風切成斷句。那不是象徵，只是我確實站在那裡。\n\n現場有遠處機車聲被風切成斷句。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":388},{"id":"d53","t":"兩個人各自沉默｜裂了一角的石膏月亮","d":"2003-10-09","y":2003.7719,"c":"love","s":"22 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見收到一間城市設計公司的面試通知留下的影響。","m":"遲疑","f":"memories/2003-10-09-15-love.md","k":1,"arm":0,"ents":[18,41,57,3,4,42,12],"deg":7,"b":"2003-10-09，落山風把招牌吹得咯咯響。22 歲的許思明正在經歷「收到一間城市設計公司的面試通知」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有紙張受潮後像剛醒來的皮膚。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":364},{"id":"d54","t":"紙袋裡的種子｜裂了一角的石膏月亮","d":"2003-10-28","y":2003.824,"c":"field","s":"22 歲的許思明在南方海岸藝術學院工坊經歷「紙袋裡的種子」，也重新看見把裂掉的月亮帶回恆春留下的影響。","m":"倔強","f":"memories/2003-10-28-16-seed.md","k":2,"arm":1,"ents":[43,44,2,3,4,58,15,12],"deg":8,"b":"2003-10-28，雲壓得很低，海卻異常平。22 歲的許思明正在經歷「把裂掉的月亮帶回恆春」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有曬熱木板摸起來微微發黏。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":351},{"id":"d55","t":"昨夜夢見店長出鰓｜裂了一角的石膏月亮","d":"2003-11-16","y":2003.8744,"c":"thought","s":"22 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見把裂掉的月亮帶回恆春留下的影響。","m":"自嘲","f":"memories/2003-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,57,3,4,47,6],"deg":7,"b":"2003-11-16，落山風把招牌吹得咯咯響。22 歲的許思明正在經歷「把裂掉的月亮帶回恆春」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有紙張受潮後像剛醒來的皮膚。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":330},{"id":"d56","t":"離開半島的一天｜裂了一角的石膏月亮","d":"2003-12-05","y":2003.9276,"c":"travel","s":"22 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見把裂掉的月亮帶回恆春留下的影響。","m":"專注","f":"memories/2003-12-05-18-trip.md","k":1,"arm":1,"ents":[48,49,57,3,4,58,50,12],"deg":9,"b":"2003-12-05，空氣黏得每張紙都捲邊。22 歲的許思明正在經歷「把裂掉的月亮帶回恆春」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有鐵鏽和九層塔混在一起的氣味。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":358},{"id":"d57","t":"無法分類的下午｜裂了一角的石膏月亮","d":"2003-12-25","y":2003.9824,"c":"thought","s":"22 歲的許思明在南方海岸藝術學院工坊經歷「無法分類的下午」，也重新看見把裂掉的月亮帶回恆春留下的影響。","m":"柔軟","f":"memories/2003-12-25-19-odd.md","k":2,"arm":1,"ents":[51,52,2,3,4,15,12],"deg":7,"b":"2003-12-25，南方的光白得像鹽。22 歲的許思明正在經歷「把裂掉的月亮帶回恆春」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。畢業製作《鹽分會留下形狀》把十二種海風封進石膏，展場卻因除濕機故障而整片龜裂。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":413},{"id":"d58","t":"今天的風不肯直走｜夜班識別證","d":"2004-01-13","y":2004.0329,"c":"coast","s":"23 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見第一次領到固定薪水留下的影響。","m":"疲憊","f":"memories/2004-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,4,5,6],"deg":7,"b":"2004-01-13，雲壓得很低，海卻異常平。23 歲的許思明正在經歷「第一次領到固定薪水」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":400},{"id":"d59","t":"市場開門以前｜夜班識別證","d":"2004-02-01","y":2004.0833,"c":"home","s":"23 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見第一次領到固定薪水留下的影響。","m":"自嘲","f":"memories/2004-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,59,3,4,60,11,12],"deg":9,"b":"2004-02-01，南方的光白得像鹽。23 歲的許思明正在經歷「第一次領到固定薪水」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":392},{"id":"d60","t":"維修單上的壞脾氣｜夜班識別證","d":"2004-02-20","y":2004.1354,"c":"craft","s":"23 歲的許思明在水族館維修間經歷「維修單上的壞脾氣」，也重新看見第一次領到固定薪水留下的影響。","m":"專注","f":"memories/2004-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,59,3,4,61,12],"deg":7,"b":"2004-02-20，風停了，連狗都顯得不習慣。23 歲的許思明正在經歷「第一次領到固定薪水」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有遠處機車聲被風切成斷句。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":363},{"id":"d61","t":"街角黑狗的巡邏路線｜夜班識別證","d":"2004-03-11","y":2004.1941,"c":"home","s":"23 歲的許思明在恆春舊城經歷「街角黑狗的巡邏路線」，也重新看見第一次領到固定薪水留下的影響。","m":"柔軟","f":"memories/2004-03-11-04-dog.md","k":2,"arm":0,"ents":[16,1,2,3,4,60,17,12],"deg":9,"b":"2004-03-11，南方的光白得像鹽。23 歲的許思明正在經歷「第一次領到固定薪水」。她今天給自己的工作很簡單：跟著一隻沒有名字的黑狗繞過兩條街，在每個牠停下來的地方記一筆，最後把觀察交給市場口的餵狗阿姨。\n\n現場有鐵鏽和九層塔混在一起的氣味。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":370},{"id":"d62","t":"給遠方的一封慢信｜夜班識別證","d":"2004-03-30","y":2004.2461,"c":"love","s":"23 歲的許思明在水族館維修間經歷「給遠方的一封慢信」，也重新看見第一次領到固定薪水留下的影響。","m":"遲疑","f":"memories/2004-03-30-05-letter.md","k":5,"arm":0,"ents":[18,19,59,3,4,61,6],"deg":7,"b":"2004-03-30，午後雷雨把街面洗成深灰。23 歲的許思明正在經歷「第一次領到固定薪水」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":348},{"id":"d63","t":"樣方偏了七公分｜夜班識別證","d":"2004-04-18","y":2004.2966,"c":"field","s":"23 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見發現自己不擅長沒有窗的工作留下的影響。","m":"疲憊","f":"memories/2004-04-18-06-field.md","k":1,"arm":1,"ents":[20,21,59,3,4,60,22,12],"deg":9,"b":"2004-04-18，空氣黏得每張紙都捲邊。23 歲的許思明正在經歷「發現自己不擅長沒有窗的工作」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有鐵鏽和九層塔混在一起的氣味。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":361},{"id":"d64","t":"零錢盒與月底｜夜班識別證","d":"2004-05-07","y":2004.3498,"c":"work","s":"23 歲的許思明在水族館維修間經歷「零錢盒與月底」，也重新看見發現自己不擅長沒有窗的工作留下的影響。","m":"自嘲","f":"memories/2004-05-07-07-money.md","k":2,"arm":1,"ents":[23,24,2,3,4,61,12],"deg":7,"b":"2004-05-07，空氣黏得每張紙都捲邊。23 歲的許思明正在經歷「發現自己不擅長沒有窗的工作」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":406},{"id":"d65","t":"颱風來前的四小時｜夜班識別證","d":"2004-05-27","y":2004.4046,"c":"coast","s":"23 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見發現自己不擅長沒有窗的工作留下的影響。","m":"專注","f":"memories/2004-05-27-08-storm.md","k":1,"arm":0,"ents":[25,26,59,3,4,60,27,12],"deg":9,"b":"2004-05-27，空氣黏得每張紙都捲邊。23 歲的許思明正在經歷「發現自己不擅長沒有窗的工作」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":377},{"id":"d66","t":"一鍋太酸的湯｜夜班識別證","d":"2004-06-15","y":2004.455,"c":"kin","s":"23 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見發現自己不擅長沒有窗的工作留下的影響。","m":"柔軟","f":"memories/2004-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,59,3,4,29,6],"deg":7,"b":"2004-06-15，風停了，連狗都顯得不習慣。23 歲的許思明正在經歷「發現自己不擅長沒有窗的工作」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有市場冰塊融水流過鞋底。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":370},{"id":"d67","t":"把夜聲收進錄音帶｜夜班識別證","d":"2004-07-04","y":2004.5082,"c":"thought","s":"23 歲的許思明在水族館維修間經歷「把夜聲收進錄音帶」，也重新看見發現自己不擅長沒有窗的工作留下的影響。","m":"遲疑","f":"memories/2004-07-04-10-radio.md","k":2,"arm":1,"ents":[30,31,2,3,4,60,61,12],"deg":9,"b":"2004-07-04，南方的光白得像鹽。23 歲的許思明正在經歷「發現自己不擅長沒有窗的工作」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有鹽粒卡在手腕細小的傷口。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":366},{"id":"d68","t":"關店後的城牆｜夜班識別證","d":"2004-07-23","y":2004.5603,"c":"body","s":"23 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見季穗開始跟劇團巡演留下的影響。","m":"疲憊","f":"memories/2004-07-23-11-walk.md","k":1,"arm":0,"ents":[32,33,59,3,4,34,12],"deg":7,"b":"2004-07-23，午後雷雨把街面洗成深灰。23 歲的許思明正在經歷「季穗開始跟劇團巡演」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":342},{"id":"d69","t":"旅人帶來的破東西｜夜班識別證","d":"2004-08-12","y":2004.6135,"c":"travel","s":"23 歲的許思明在水族館維修間經歷「旅人帶來的破東西」，也重新看見季穗開始跟劇團巡演留下的影響。","m":"自嘲","f":"memories/2004-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,59,3,4,60,61,12],"deg":8,"b":"2004-08-12，午後雷雨把街面洗成深灰。23 歲的許思明正在經歷「季穗開始跟劇團巡演」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有曬熱木板摸起來微微發黏。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她繞了一小段遠路才回到水族館維修間。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":374},{"id":"d70","t":"母親說只是順便｜夜班識別證","d":"2004-08-31","y":2004.6655,"c":"kin","s":"23 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見季穗開始跟劇團巡演留下的影響。","m":"專注","f":"memories/2004-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,4,29,6],"deg":7,"b":"2004-08-31，風停了，連狗都顯得不習慣。23 歲的許思明正在經歷「季穗開始跟劇團巡演」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":406},{"id":"d71","t":"父親的工具牆｜夜班識別證","d":"2004-09-19","y":2004.716,"c":"kin","s":"23 歲的許思明在父親的電器行經歷「父親的工具牆」，也重新看見季穗開始跟劇團巡演留下的影響。","m":"柔軟","f":"memories/2004-09-19-14-father.md","k":1,"arm":0,"ents":[38,39,59,3,4,60,40,12],"deg":9,"b":"2004-09-19，風停了，連狗都顯得不習慣。23 歲的許思明正在經歷「季穗開始跟劇團巡演」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":398},{"id":"d72","t":"兩個人各自沉默｜夜班識別證","d":"2004-10-09","y":2004.7719,"c":"love","s":"23 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見季穗開始跟劇團巡演留下的影響。","m":"遲疑","f":"memories/2004-10-09-15-love.md","k":1,"arm":0,"ents":[18,41,59,3,4,42,12],"deg":7,"b":"2004-10-09，風停了，連狗都顯得不習慣。23 歲的許思明正在經歷「季穗開始跟劇團巡演」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有市場冰塊融水流過鞋底。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":358},{"id":"d73","t":"紙袋裡的種子｜夜班識別證","d":"2004-10-28","y":2004.824,"c":"field","s":"23 歲的許思明在水族館維修間經歷「紙袋裡的種子」，也重新看見用離職信背面畫回恆春的路留下的影響。","m":"疲憊","f":"memories/2004-10-28-16-seed.md","k":2,"arm":1,"ents":[43,44,2,3,4,60,61,12],"deg":8,"b":"2004-10-28，午後雷雨把街面洗成深灰。23 歲的許思明正在經歷「用離職信背面畫回恆春的路」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有遠處機車聲被風切成斷句。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":351},{"id":"d74","t":"昨夜夢見店長出鰓｜夜班識別證","d":"2004-11-16","y":2004.8744,"c":"thought","s":"23 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見用離職信背面畫回恆春的路留下的影響。","m":"自嘲","f":"memories/2004-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,59,3,4,47,6],"deg":7,"b":"2004-11-16，落山風把招牌吹得咯咯響。23 歲的許思明正在經歷「用離職信背面畫回恆春的路」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":346},{"id":"d75","t":"離開半島的一天｜夜班識別證","d":"2004-12-05","y":2004.9276,"c":"travel","s":"23 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見用離職信背面畫回恆春的路留下的影響。","m":"專注","f":"memories/2004-12-05-18-trip.md","k":1,"arm":1,"ents":[48,49,59,3,4,60,50,12],"deg":9,"b":"2004-12-05，南方的光白得像鹽。23 歲的許思明正在經歷「用離職信背面畫回恆春的路」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有鹽粒卡在手腕細小的傷口。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":364},{"id":"d76","t":"無法分類的下午｜夜班識別證","d":"2004-12-25","y":2004.9824,"c":"thought","s":"23 歲的許思明在水族館維修間經歷「無法分類的下午」，也重新看見用離職信背面畫回恆春的路留下的影響。","m":"柔軟","f":"memories/2004-12-25-19-odd.md","k":2,"arm":1,"ents":[51,52,2,3,4,61,12],"deg":7,"b":"2004-12-25，雲壓得很低，海卻異常平。23 歲的許思明正在經歷「用離職信背面畫回恆春的路」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。搬到高雄做水族館夜間維護，工作是擦壓克力、記錄鹽度，並在閉館後跟一尾總是躲著人的石斑說話。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":425},{"id":"d77","t":"今天的風不肯直走｜十九號紅色項圈","d":"2005-01-13","y":2005.0329,"c":"coast","s":"24 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見機車在大武拋錨留下的影響。","m":"漂泊","f":"memories/2005-01-13-01-wind.md","k":6,"arm":0,"ents":[0,1,2,3,62,5,6],"deg":9,"b":"2005-01-13，風停了，連狗都顯得不習慣。24 歲的許思明正在經歷「機車在大武拋錨」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":401},{"id":"d78","t":"市場開門以前｜十九號紅色項圈","d":"2005-02-01","y":2005.0833,"c":"home","s":"24 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見機車在大武拋錨留下的影響。","m":"自嘲","f":"memories/2005-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,63,3,62,10,11,12],"deg":10,"b":"2005-02-01，雲壓得很低，海卻異常平。24 歲的許思明正在經歷「機車在大武拋錨」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鐵鏽和九層塔混在一起的氣味。那不是象徵，只是我確實站在那裡。\n\n現場有鐵鏽和九層塔混在一起的氣味。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":391},{"id":"d79","t":"維修單上的壞脾氣｜十九號紅色項圈","d":"2005-02-20","y":2005.1354,"c":"craft","s":"24 歲的許思明在環島路上的雨棚經歷「維修單上的壞脾氣」，也重新看見機車在大武拋錨留下的影響。","m":"專注","f":"memories/2005-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,63,3,62,64,12],"deg":7,"b":"2005-02-20，空氣黏得每張紙都捲邊。24 歲的許思明正在經歷「機車在大武拋錨」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有鐵鏽和九層塔混在一起的氣味。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":368},{"id":"d80","t":"十九的巡邏路線｜十九號紅色項圈","d":"2005-03-11","y":2005.1941,"c":"home","s":"24 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見機車在大武拋錨留下的影響。","m":"柔軟","f":"memories/2005-03-11-04-dog.md","k":7,"arm":0,"ents":[65,66,2,3,62,10,17,12],"deg":18,"b":"2005-03-11，南方的光白得像鹽。24 歲的許思明正在經歷「機車在大武拋錨」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有遠處機車聲被風切成斷句。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":352},{"id":"d81","t":"給遠方的一封慢信｜十九號紅色項圈","d":"2005-03-31","y":2005.2489,"c":"love","s":"24 歲的許思明在環島路上的雨棚經歷「給遠方的一封慢信」，也重新看見機車在大武拋錨留下的影響。","m":"遲疑","f":"memories/2005-03-31-05-letter.md","k":6,"arm":0,"ents":[18,19,63,3,62,64,6],"deg":7,"b":"2005-03-31，南方的光白得像鹽。24 歲的許思明正在經歷「機車在大武拋錨」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":332},{"id":"d82","t":"樣方偏了七公分｜十九號紅色項圈","d":"2005-04-19","y":2005.2993,"c":"field","s":"24 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見十九第一次願意靠近她留下的影響。","m":"漂泊","f":"memories/2005-04-19-06-field.md","k":7,"arm":1,"ents":[20,21,63,3,62,10,22,12],"deg":10,"b":"2005-04-19，風停了，連狗都顯得不習慣。24 歲的許思明正在經歷「十九第一次願意靠近她」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有紙張受潮後像剛醒來的皮膚。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":361},{"id":"d83","t":"零錢盒與月底｜十九號紅色項圈","d":"2005-05-08","y":2005.3525,"c":"work","s":"24 歲的許思明在環島路上的雨棚經歷「零錢盒與月底」，也重新看見十九第一次願意靠近她留下的影響。","m":"自嘲","f":"memories/2005-05-08-07-money.md","k":6,"arm":1,"ents":[23,24,2,3,62,64,12],"deg":7,"b":"2005-05-08，雲壓得很低，海卻異常平。24 歲的許思明正在經歷「十九第一次願意靠近她」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":418},{"id":"d84","t":"颱風來前的四小時｜十九號紅色項圈","d":"2005-05-27","y":2005.4046,"c":"coast","s":"24 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見十九第一次願意靠近她留下的影響。","m":"專注","f":"memories/2005-05-27-08-storm.md","k":7,"arm":0,"ents":[25,26,63,3,62,10,27,12],"deg":10,"b":"2005-05-27，南方的光白得像鹽。24 歲的許思明正在經歷「十九第一次願意靠近她」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":386},{"id":"d85","t":"一鍋太酸的湯｜十九號紅色項圈","d":"2005-06-15","y":2005.455,"c":"kin","s":"24 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見十九第一次願意靠近她留下的影響。","m":"柔軟","f":"memories/2005-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,63,3,62,29,6],"deg":7,"b":"2005-06-15，落山風把招牌吹得咯咯響。24 歲的許思明正在經歷「十九第一次願意靠近她」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有市場冰塊融水流過鞋底。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":373},{"id":"d86","t":"把夜聲收進錄音帶｜十九號紅色項圈","d":"2005-07-05","y":2005.511,"c":"thought","s":"24 歲的許思明在環島路上的雨棚經歷「把夜聲收進錄音帶」，也重新看見十九第一次願意靠近她留下的影響。","m":"遲疑","f":"memories/2005-07-05-10-radio.md","k":7,"arm":1,"ents":[30,31,2,3,62,10,64,12],"deg":8,"b":"2005-07-05，空氣黏得每張紙都捲邊。24 歲的許思明正在經歷「十九第一次願意靠近她」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有曬熱木板摸起來微微發黏。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":355},{"id":"d87","t":"關店後的城牆｜十九號紅色項圈","d":"2005-07-24","y":2005.563,"c":"body","s":"24 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見用最後一筆存款買二手相機留下的影響。","m":"漂泊","f":"memories/2005-07-24-11-walk.md","k":6,"arm":0,"ents":[32,33,63,3,62,34,12],"deg":7,"b":"2005-07-24，風停了，連狗都顯得不習慣。24 歲的許思明正在經歷「用最後一筆存款買二手相機」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":349},{"id":"d88","t":"旅人帶來的破東西｜十九號紅色項圈","d":"2005-08-12","y":2005.6135,"c":"travel","s":"24 歲的許思明在環島路上的雨棚經歷「旅人帶來的破東西」，也重新看見用最後一筆存款買二手相機留下的影響。","m":"自嘲","f":"memories/2005-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,63,3,62,10,64,12],"deg":8,"b":"2005-08-12，風停了，連狗都顯得不習慣。24 歲的許思明正在經歷「用最後一筆存款買二手相機」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有曬熱木板摸起來微微發黏。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到環島路上的雨棚。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":373},{"id":"d89","t":"母親說只是順便｜十九號紅色項圈","d":"2005-08-31","y":2005.6655,"c":"kin","s":"24 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見用最後一筆存款買二手相機留下的影響。","m":"專注","f":"memories/2005-08-31-13-mother.md","k":6,"arm":0,"ents":[36,37,2,3,62,29,6],"deg":7,"b":"2005-08-31，空氣黏得每張紙都捲邊。24 歲的許思明正在經歷「用最後一筆存款買二手相機」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":399},{"id":"d90","t":"父親的工具牆｜十九號紅色項圈","d":"2005-09-20","y":2005.7187,"c":"kin","s":"24 歲的許思明在父親的電器行經歷「父親的工具牆」，也重新看見用最後一筆存款買二手相機留下的影響。","m":"柔軟","f":"memories/2005-09-20-14-father.md","k":7,"arm":0,"ents":[38,39,63,3,62,10,40,12],"deg":10,"b":"2005-09-20，雲壓得很低，海卻異常平。24 歲的許思明正在經歷「用最後一筆存款買二手相機」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":400},{"id":"d91","t":"兩個人各自沉默｜十九號紅色項圈","d":"2005-10-09","y":2005.7719,"c":"love","s":"24 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見用最後一筆存款買二手相機留下的影響。","m":"遲疑","f":"memories/2005-10-09-15-love.md","k":6,"arm":0,"ents":[18,41,63,3,62,42,12],"deg":7,"b":"2005-10-09，空氣黏得每張紙都捲邊。24 歲的許思明正在經歷「用最後一筆存款買二手相機」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有鐵鏽和九層塔混在一起的氣味。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":372},{"id":"d92","t":"紙袋裡的種子｜十九號紅色項圈","d":"2005-10-28","y":2005.824,"c":"field","s":"24 歲的許思明在環島路上的雨棚經歷「紙袋裡的種子」，也重新看見承認自己其實正在回家留下的影響。","m":"漂泊","f":"memories/2005-10-28-16-seed.md","k":7,"arm":1,"ents":[43,44,2,3,62,10,64,12],"deg":8,"b":"2005-10-28，午後雷雨把街面洗成深灰。24 歲的許思明正在經歷「承認自己其實正在回家」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有遠處機車聲被風切成斷句。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":347},{"id":"d93","t":"昨夜夢見店長出鰓｜十九號紅色項圈","d":"2005-11-16"
