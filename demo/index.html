8.7829,"c":"field","s":"37 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見她們決定每週留一天各自消失留下的影響。","m":"親密","f":"memories/2018-10-13-16-seed.md","k":4,"arm":1,"ents":[43,44,2,3,82,58,68,12],"deg":8,"b":"2018-10-13，雲壓得很低，海卻異常平。37 歲的許思明正在經歷「她們決定每週留一天各自消失」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有紙張受潮後像剛醒來的皮膚。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":370},{"id":"d342","t":"昨夜夢見店長出鰓｜兩把不同高度的牙刷","d":"2018-10-31","y":2018.8322,"c":"thought","s":"37 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見她們決定每週留一天各自消失留下的影響。","m":"自嘲","f":"memories/2018-10-31-17-dream.md","k":5,"arm":1,"ents":[45,46,84,3,82,47,6],"deg":7,"b":"2018-10-31，落山風把招牌吹得咯咯響。37 歲的許思明正在經歷「她們決定每週留一天各自消失」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":349},{"id":"d343","t":"離開半島的一天｜兩把不同高度的牙刷","d":"2018-11-18","y":2018.8799,"c":"travel","s":"37 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見她們決定每週留一天各自消失留下的影響。","m":"專注","f":"memories/2018-11-18-18-trip.md","k":3,"arm":1,"ents":[48,49,84,3,82,58,50,12],"deg":9,"b":"2018-11-18，空氣黏得每張紙都捲邊。37 歲的許思明正在經歷「她們決定每週留一天各自消失」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有市場冰塊融水流過鞋底。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":383},{"id":"d344","t":"無法分類的下午｜兩把不同高度的牙刷","d":"2018-12-07","y":2018.9331,"c":"thought","s":"37 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見她們決定每週留一天各自消失留下的影響。","m":"柔軟","f":"memories/2018-12-07-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,82,68,12],"deg":7,"b":"2018-12-07，南方的光白得像鹽。37 歲的許思明正在經歷「她們決定每週留一天各自消失」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":421},{"id":"d345","t":"年末不完整清單｜兩把不同高度的牙刷","d":"2018-12-25","y":2018.9824,"c":"thought","s":"37 歲的許思明在鹹風標本室經歷「年末不完整清單」，也重新看見她們決定每週留一天各自消失留下的影響。","m":"遲疑","f":"memories/2018-12-25-20-inventory.md","k":4,"arm":1,"ents":[53,54,84,3,82,58,68,12],"deg":9,"b":"2018-12-25，午後雷雨把街面洗成深灰。37 歲的許思明正在經歷「她們決定每週留一天各自消失」。她今天給自己的工作很簡單：盤點留下、送走、修好與仍然不明白的東西，故意保留空白，不把一年假裝成已經結案。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":396},{"id":"d346","t":"今天的風不肯直走｜貼滿便條的開發案地圖","d":"2019-01-13","y":2019.0329,"c":"coast","s":"38 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見連續三夜整理會議資料留下的影響。","m":"堅定","f":"memories/2019-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,82,5,6],"deg":7,"b":"2019-01-13，空氣黏得每張紙都捲邊。38 歲的許思明正在經歷「連續三夜整理會議資料」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":398},{"id":"d347","t":"市場開門以前｜貼滿便條的開發案地圖","d":"2019-02-01","y":2019.0833,"c":"home","s":"38 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見連續三夜整理會議資料留下的影響。","m":"自嘲","f":"memories/2019-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,85,3,82,10,11,12],"deg":8,"b":"2019-02-01，落山風把招牌吹得咯咯響。38 歲的許思明正在經歷「連續三夜整理會議資料」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得遠處機車聲被風切成斷句。那不是象徵，只是我確實站在那裡。\n\n現場有遠處機車聲被風切成斷句。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":392},{"id":"d348","t":"維修單上的壞脾氣｜貼滿便條的開發案地圖","d":"2019-02-20","y":2019.1354,"c":"craft","s":"38 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見連續三夜整理會議資料留下的影響。","m":"專注","f":"memories/2019-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,85,3,82,68,12],"deg":7,"b":"2019-02-20，落山風把招牌吹得咯咯響。38 歲的許思明正在經歷「連續三夜整理會議資料」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有鹽粒卡在手腕細小的傷口。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":363},{"id":"d349","t":"十九的巡邏路線｜貼滿便條的開發案地圖","d":"2019-03-11","y":2019.1941,"c":"home","s":"38 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見連續三夜整理會議資料留下的影響。","m":"柔軟","f":"memories/2019-03-11-04-dog.md","k":7,"arm":0,"ents":[65,66,2,3,82,10,17,12],"deg":15,"b":"2019-03-11，空氣黏得每張紙都捲邊。38 歲的許思明正在經歷「連續三夜整理會議資料」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有市場冰塊融水流過鞋底。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":355},{"id":"d350","t":"給遠方的一封慢信｜貼滿便條的開發案地圖","d":"2019-03-31","y":2019.2489,"c":"love","s":"38 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見連續三夜整理會議資料留下的影響。","m":"遲疑","f":"memories/2019-03-31-05-letter.md","k":5,"arm":0,"ents":[18,19,85,3,82,68,6],"deg":7,"b":"2019-03-31，雲壓得很低，海卻異常平。38 歲的許思明正在經歷「連續三夜整理會議資料」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":338},{"id":"d351","t":"樣方偏了七公分｜貼滿便條的開發案地圖","d":"2019-04-19","y":2019.2993,"c":"field","s":"38 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見青禾提醒她別把自己耗成證據留下的影響。","m":"堅定","f":"memories/2019-04-19-06-field.md","k":7,"arm":1,"ents":[20,21,85,3,82,10,22,12],"deg":10,"b":"2019-04-19，南方的光白得像鹽。38 歲的許思明正在經歷「青禾提醒她別把自己耗成證據」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有市場冰塊融水流過鞋底。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":371},{"id":"d352","t":"零錢盒與月底｜貼滿便條的開發案地圖","d":"2019-05-08","y":2019.3525,"c":"work","s":"38 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見青禾提醒她別把自己耗成證據留下的影響。","m":"自嘲","f":"memories/2019-05-08-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,82,68,12],"deg":7,"b":"2019-05-08，落山風把招牌吹得咯咯響。38 歲的許思明正在經歷「青禾提醒她別把自己耗成證據」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":409},{"id":"d353","t":"颱風來前的四小時｜貼滿便條的開發案地圖","d":"2019-05-27","y":2019.4046,"c":"coast","s":"38 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見青禾提醒她別把自己耗成證據留下的影響。","m":"專注","f":"memories/2019-05-27-08-storm.md","k":7,"arm":0,"ents":[25,26,85,3,82,10,27,12],"deg":10,"b":"2019-05-27，午後雷雨把街面洗成深灰。38 歲的許思明正在經歷「青禾提醒她別把自己耗成證據」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":397},{"id":"d354","t":"一鍋太酸的湯｜貼滿便條的開發案地圖","d":"2019-06-15","y":2019.455,"c":"kin","s":"38 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見青禾提醒她別把自己耗成證據留下的影響。","m":"柔軟","f":"memories/2019-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,85,3,82,29,6],"deg":7,"b":"2019-06-15，風停了，連狗都顯得不習慣。38 歲的許思明正在經歷「青禾提醒她別把自己耗成證據」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有曬熱木板摸起來微微發黏。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":382},{"id":"d355","t":"風不負責回答｜貼滿便條的開發案地圖","d":"2019-07-05","y":2019.511,"c":"thought","s":"38 歲的許思明在思明 FM經歷「風不負責回答」，也重新看見青禾提醒她別把自己耗成證據留下的影響。","m":"遲疑","f":"memories/2019-07-05-10-radio.md","k":7,"arm":1,"ents":[77,78,2,3,82,10,79,12],"deg":16,"b":"2019-07-05，風停了，連狗都顯得不習慣。38 歲的許思明正在經歷「青禾提醒她別把自己耗成證據」。她今天給自己的工作很簡單：打開深夜麥克風，讓來電者講完一個沒有結局的夢，只在必要時問一句當時風從哪邊來。\n\n現場有紙張受潮後像剛醒來的皮膚。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":361},{"id":"d356","t":"關店後的城牆｜貼滿便條的開發案地圖","d":"2019-07-24","y":2019.563,"c":"body","s":"38 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見標本室成為鄰里討論據點留下的影響。","m":"堅定","f":"memories/2019-07-24-11-walk.md","k":3,"arm":0,"ents":[32,33,85,3,82,34,12],"deg":7,"b":"2019-07-24，午後雷雨把街面洗成深灰。38 歲的許思明正在經歷「標本室成為鄰里討論據點」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有紙張受潮後像剛醒來的皮膚。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":340},{"id":"d357","t":"旅人帶來的破東西｜貼滿便條的開發案地圖","d":"2019-08-12","y":2019.6135,"c":"travel","s":"38 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見標本室成為鄰里討論據點留下的影響。","m":"自嘲","f":"memories/2019-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,85,3,82,10,68,12],"deg":8,"b":"2019-08-12，南方的光白得像鹽。38 歲的許思明正在經歷「標本室成為鄰里討論據點」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有市場冰塊融水流過鞋底。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":361},{"id":"d358","t":"母親說只是順便｜貼滿便條的開發案地圖","d":"2019-08-31","y":2019.6655,"c":"kin","s":"38 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見標本室成為鄰里討論據點留下的影響。","m":"專注","f":"memories/2019-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,82,29,6],"deg":7,"b":"2019-08-31，南方的光白得像鹽。38 歲的許思明正在經歷「標本室成為鄰里討論據點」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":402},{"id":"d359","t":"父親的工具牆｜貼滿便條的開發案地圖","d":"2019-09-20","y":2019.7187,"c":"kin","s":"38 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見標本室成為鄰里討論據點留下的影響。","m":"柔軟","f":"memories/2019-09-20-14-father.md","k":7,"arm":0,"ents":[38,39,85,3,82,10,68,12],"deg":8,"b":"2019-09-20，南方的光白得像鹽。38 歲的許思明正在經歷「標本室成為鄰里討論據點」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":388},{"id":"d360","t":"兩個人各自沉默｜貼滿便條的開發案地圖","d":"2019-10-09","y":2019.7719,"c":"love","s":"38 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見標本室成為鄰里討論據點留下的影響。","m":"遲疑","f":"memories/2019-10-09-15-love.md","k":3,"arm":0,"ents":[18,41,85,3,82,42,12],"deg":7,"b":"2019-10-09，風停了，連狗都顯得不習慣。38 歲的許思明正在經歷「標本室成為鄰里討論據點」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有市場冰塊融水流過鞋底。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":369},{"id":"d361","t":"紙袋裡的種子｜貼滿便條的開發案地圖","d":"2019-10-28","y":2019.824,"c":"field","s":"38 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見她第一次在台上把話講完留下的影響。","m":"堅定","f":"memories/2019-10-28-16-seed.md","k":7,"arm":1,"ents":[43,44,2,3,82,10,68,12],"deg":8,"b":"2019-10-28，風停了，連狗都顯得不習慣。38 歲的許思明正在經歷「她第一次在台上把話講完」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有鹽粒卡在手腕細小的傷口。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":361},{"id":"d362","t":"昨夜夢見店長出鰓｜貼滿便條的開發案地圖","d":"2019-11-16","y":2019.8744,"c":"thought","s":"38 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見她第一次在台上把話講完留下的影響。","m":"自嘲","f":"memories/2019-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,85,3,82,47,6],"deg":7,"b":"2019-11-16，空氣黏得每張紙都捲邊。38 歲的許思明正在經歷「她第一次在台上把話講完」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":339},{"id":"d363","t":"離開半島的一天｜貼滿便條的開發案地圖","d":"2019-12-05","y":2019.9276,"c":"travel","s":"38 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見她第一次在台上把話講完留下的影響。","m":"專注","f":"memories/2019-12-05-18-trip.md","k":7,"arm":1,"ents":[48,49,85,3,82,10,50,12],"deg":10,"b":"2019-12-05，風停了，連狗都顯得不習慣。38 歲的許思明正在經歷「她第一次在台上把話講完」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有市場冰塊融水流過鞋底。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":374},{"id":"d364","t":"無法分類的下午｜貼滿便條的開發案地圖","d":"2019-12-25","y":2019.9824,"c":"thought","s":"38 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見她第一次在台上把話講完留下的影響。","m":"柔軟","f":"memories/2019-12-25-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,82,68,12],"deg":7,"b":"2019-12-25，午後雷雨把街面洗成深灰。38 歲的許思明正在經歷「她第一次在台上把話講完」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。海岸開發說明會讓她從旁聽者變成提問者。她不擅長口號，便把潮溝、墓仔埔與居民記憶一一釘回地圖。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":424},{"id":"d365","t":"今天的風不肯直走｜門口的無接觸菜籃","d":"2020-01-13","y":2020.0329,"c":"coast","s":"39 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見第一次整月沒有觀光客留下的影響。","m":"懸著","f":"memories/2020-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,82,5,6],"deg":7,"b":"2020-01-13，風停了，連狗都顯得不習慣。39 歲的許思明正在經歷「第一次整月沒有觀光客」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":409},{"id":"d366","t":"市場開門以前｜門口的無接觸菜籃","d":"2020-02-01","y":2020.0833,"c":"home","s":"39 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見第一次整月沒有觀光客留下的影響。","m":"自嘲","f":"memories/2020-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,86,3,82,56,11,12],"deg":8,"b":"2020-02-01，落山風把招牌吹得咯咯響。39 歲的許思明正在經歷「第一次整月沒有觀光客」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":405},{"id":"d367","t":"維修單上的壞脾氣｜門口的無接觸菜籃","d":"2020-02-20","y":2020.1354,"c":"craft","s":"39 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見第一次整月沒有觀光客留下的影響。","m":"專注","f":"memories/2020-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,86,3,82,68,12],"deg":7,"b":"2020-02-20，落山風把招牌吹得咯咯響。39 歲的許思明正在經歷「第一次整月沒有觀光客」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有遠處機車聲被風切成斷句。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":369},{"id":"d368","t":"十九的巡邏路線｜門口的無接觸菜籃","d":"2020-03-11","y":2020.1941,"c":"home","s":"39 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見第一次整月沒有觀光客留下的影響。","m":"柔軟","f":"memories/2020-03-11-04-dog.md","k":8,"arm":0,"ents":[65,66,2,3,82,56,17,12],"deg":12,"b":"2020-03-11，空氣黏得每張紙都捲邊。39 歲的許思明正在經歷「第一次整月沒有觀光客」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有紙張受潮後像剛醒來的皮膚。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":366},{"id":"d369","t":"給遠方的一封慢信｜門口的無接觸菜籃","d":"2020-03-30","y":2020.2461,"c":"love","s":"39 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見第一次整月沒有觀光客留下的影響。","m":"遲疑","f":"memories/2020-03-30-05-letter.md","k":5,"arm":0,"ents":[18,19,86,3,82,68,6],"deg":7,"b":"2020-03-30，午後雷雨把街面洗成深灰。39 歲的許思明正在經歷「第一次整月沒有觀光客」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":352},{"id":"d370","t":"樣方偏了七公分｜門口的無接觸菜籃","d":"2020-04-18","y":2020.2966,"c":"field","s":"39 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見和青禾隔著門吃生日面留下的影響。","m":"懸著","f":"memories/2020-04-18-06-field.md","k":8,"arm":1,"ents":[20,21,86,3,82,56,22,12],"deg":8,"b":"2020-04-18，空氣黏得每張紙都捲邊。39 歲的許思明正在經歷「和青禾隔著門吃生日面」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有遠處機車聲被風切成斷句。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":359},{"id":"d371","t":"零錢盒與月底｜門口的無接觸菜籃","d":"2020-05-07","y":2020.3498,"c":"work","s":"39 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見和青禾隔著門吃生日面留下的影響。","m":"自嘲","f":"memories/2020-05-07-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,82,68,12],"deg":7,"b":"2020-05-07，雲壓得很低，海卻異常平。39 歲的許思明正在經歷「和青禾隔著門吃生日面」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":421},{"id":"d372","t":"颱風來前的四小時｜門口的無接觸菜籃","d":"2020-05-27","y":2020.4046,"c":"coast","s":"39 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見和青禾隔著門吃生日面留下的影響。","m":"專注","f":"memories/2020-05-27-08-storm.md","k":8,"arm":0,"ents":[25,26,86,3,82,56,27,12],"deg":8,"b":"2020-05-27，南方的光白得像鹽。39 歲的許思明正在經歷「和青禾隔著門吃生日面」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":380},{"id":"d373","t":"一鍋太酸的湯｜門口的無接觸菜籃","d":"2020-06-15","y":2020.455,"c":"kin","s":"39 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見和青禾隔著門吃生日面留下的影響。","m":"柔軟","f":"memories/2020-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,86,3,82,29,6],"deg":7,"b":"2020-06-15，空氣黏得每張紙都捲邊。39 歲的許思明正在經歷「和青禾隔著門吃生日面」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有紙張受潮後像剛醒來的皮膚。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":382},{"id":"d374","t":"風不負責回答｜門口的無接觸菜籃","d":"2020-07-04","y":2020.5082,"c":"thought","s":"39 歲的許思明在思明 FM經歷「風不負責回答」，也重新看見和青禾隔著門吃生日面留下的影響。","m":"遲疑","f":"memories/2020-07-04-10-radio.md","k":8,"arm":1,"ents":[77,78,2,3,82,56,79,12],"deg":15,"b":"2020-07-04，午後雷雨把街面洗成深灰。39 歲的許思明正在經歷「和青禾隔著門吃生日面」。她今天給自己的工作很簡單：打開深夜麥克風，讓來電者講完一個沒有結局的夢，只在必要時問一句當時風從哪邊來。\n\n現場有紙張受潮後像剛醒來的皮膚。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":370},{"id":"d375","t":"關店後的城牆｜門口的無接觸菜籃","d":"2020-07-23","y":2020.5603,"c":"body","s":"39 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見父親學會用視訊卻只拍到天花板留下的影響。","m":"懸著","f":"memories/2020-07-23-11-walk.md","k":3,"arm":0,"ents":[32,33,86,3,82,34,12],"deg":7,"b":"2020-07-23，午後雷雨把街面洗成深灰。39 歲的許思明正在經歷「父親學會用視訊卻只拍到天花板」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":344},{"id":"d376","t":"旅人帶來的破東西｜門口的無接觸菜籃","d":"2020-08-12","y":2020.6135,"c":"travel","s":"39 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見父親學會用視訊卻只拍到天花板留下的影響。","m":"自嘲","f":"memories/2020-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,86,3,82,56,68,12],"deg":8,"b":"2020-08-12，落山風把招牌吹得咯咯響。39 歲的許思明正在經歷「父親學會用視訊卻只拍到天花板」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有紙張受潮後像剛醒來的皮膚。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":385},{"id":"d377","t":"母親說只是順便｜門口的無接觸菜籃","d":"2020-08-31","y":2020.6655,"c":"kin","s":"39 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見父親學會用視訊卻只拍到天花板留下的影響。","m":"專注","f":"memories/2020-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,82,29,6],"deg":7,"b":"2020-08-31，落山風把招牌吹得咯咯響。39 歲的許思明正在經歷「父親學會用視訊卻只拍到天花板」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":413},{"id":"d378","t":"父親的工具牆｜門口的無接觸菜籃","d":"2020-09-19","y":2020.716,"c":"kin","s":"39 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見父親學會用視訊卻只拍到天花板留下的影響。","m":"柔軟","f":"memories/2020-09-19-14-father.md","k":8,"arm":0,"ents":[38,39,86,3,82,56,68,12],"deg":8,"b":"2020-09-19，雲壓得很低，海卻異常平。39 歲的許思明正在經歷「父親學會用視訊卻只拍到天花板」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":401},{"id":"d379","t":"兩個人各自沉默｜門口的無接觸菜籃","d":"2020-10-09","y":2020.7719,"c":"love","s":"39 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見父親學會用視訊卻只拍到天花板留下的影響。","m":"遲疑","f":"memories/2020-10-09-15-love.md","k":3,"arm":0,"ents":[18,41,86,3,82,42,12],"deg":7,"b":"2020-10-09，雲壓得很低，海卻異常平。39 歲的許思明正在經歷「父親學會用視訊卻只拍到天花板」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有遠處機車聲被風切成斷句。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":376},{"id":"d380","t":"紙袋裡的種子｜門口的無接觸菜籃","d":"2020-10-28","y":2020.824,"c":"field","s":"39 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見她把廣播改成每天十分鐘留下的影響。","m":"懸著","f":"memories/2020-10-28-16-seed.md","k":8,"arm":1,"ents":[43,44,2,3,82,56,68,12],"deg":8,"b":"2020-10-28，南方的光白得像鹽。39 歲的許思明正在經歷「她把廣播改成每天十分鐘」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有紙張受潮後像剛醒來的皮膚。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":364},{"id":"d381","t":"昨夜夢見店長出鰓｜門口的無接觸菜籃","d":"2020-11-16","y":2020.8744,"c":"thought","s":"39 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見她把廣播改成每天十分鐘留下的影響。","m":"自嘲","f":"memories/2020-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,86,3,82,47,6],"deg":7,"b":"2020-11-16，空氣黏得每張紙都捲邊。39 歲的許思明正在經歷「她把廣播改成每天十分鐘」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":346},{"id":"d382","t":"離開半島的一天｜門口的無接觸菜籃","d":"2020-12-05","y":2020.9276,"c":"travel","s":"39 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見她把廣播改成每天十分鐘留下的影響。","m":"專注","f":"memories/2020-12-05-18-trip.md","k":8,"arm":1,"ents":[48,49,86,3,82,56,50,12],"deg":8,"b":"2020-12-05，空氣黏得每張紙都捲邊。39 歲的許思明正在經歷「她把廣播改成每天十分鐘」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有鐵鏽和九層塔混在一起的氣味。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":380},{"id":"d383","t":"無法分類的下午｜門口的無接觸菜籃","d":"2020-12-25","y":2020.9824,"c":"thought","s":"39 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見她把廣播改成每天十分鐘留下的影響。","m":"柔軟","f":"memories/2020-12-25-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,82,68,12],"deg":7,"b":"2020-12-25，空氣黏得每張紙都捲邊。39 歲的許思明正在經歷「她把廣播改成每天十分鐘」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。疫情讓店門關了幾個月，她改送發酵物、修好的小家電和手寫風況。沒有旅人之後，標本室反而重新長回鄰里的尺寸。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":426},{"id":"d384","t":"今天的風不肯直走｜四十歲的反向生日蠟燭","d":"2021-01-12","y":2021.0301,"c":"coast","s":"40 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見把生日辦成物件領養會留下的影響。","m":"開闊","f":"memories/2021-01-12-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,82,5,6],"deg":7,"b":"2021-01-12，雲壓得很低，海卻異常平。40 歲的許思明正在經歷「把生日辦成物件領養會」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":410},{"id":"d385","t":"市場開門以前｜四十歲的反向生日蠟燭","d":"2021-01-30","y":2021.0795,"c":"home","s":"40 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見把生日辦成物件領養會留下的影響。","m":"自嘲","f":"memories/2021-01-30-02-market.md","k":9,"arm":0,"ents":[7,8,87,3,82,62,11,12],"deg":8,"b":"2021-01-30，風停了，連狗都顯得不習慣。40 歲的許思明正在經歷「把生日辦成物件領養會」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":392},{"id":"d386","t":"維修單上的壞脾氣｜四十歲的反向生日蠟燭","d":"2021-02-18","y":2021.1299,"c":"craft","s":"40 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見把生日辦成物件領養會留下的影響。","m":"專注","f":"memories/2021-02-18-03-repair.md","k":10,"arm":1,"ents":[13,14,87,3,82,68,12],"deg":7,"b":"2021-02-18，空氣黏得每張紙都捲邊。40 歲的許思明正在經歷「把生日辦成物件領養會」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有鐵鏽和九層塔混在一起的氣味。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":378},{"id":"d387","t":"十九的巡邏路線｜四十歲的反向生日蠟燭","d":"2021-03-08","y":2021.1858,"c":"home","s":"40 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見把生日辦成物件領養會留下的影響。","m":"柔軟","f":"memories/2021-03-08-04-dog.md","k":6,"arm":0,"ents":[65,66,2,3,82,62,17,12],"deg":11,"b":"2021-03-08，雲壓得很低，海卻異常平。40 歲的許思明正在經歷「把生日辦成物件領養會」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有曬熱木板摸起來微微發黏。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":379},{"id":"d388","t":"給遠方的一封慢信｜四十歲的反向生日蠟燭","d":"2021-03-26","y":2021.2352,"c":"love","s":"40 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見把生日辦成物件領養會留下的影響。","m":"遲疑","f":"memories/2021-03-26-05-letter.md","k":5,"arm":0,"ents":[18,19,87,3,82,68,6],"deg":7,"b":"2021-03-26，落山風把招牌吹得咯咯響。40 歲的許思明正在經歷「把生日辦成物件領養會」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有紙張受潮後像剛醒來的皮膚。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":360},{"id":"d389","t":"樣方偏了七公分｜四十歲的反向生日蠟燭","d":"2021-04-13","y":2021.2829,"c":"field","s":"40 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見十九老得走不動卻堅持看門留下的影響。","m":"開闊","f":"memories/2021-04-13-06-field.md","k":6,"arm":1,"ents":[20,21,87,3,82,62,22,12],"deg":9,"b":"2021-04-13，落山風把招牌吹得咯咯響。40 歲的許思明正在經歷「十九老得走不動卻堅持看門」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有鐵鏽和九層塔混在一起的氣味。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":383},{"id":"d390","t":"零錢盒與月底｜四十歲的反向生日蠟燭","d":"2021-05-02","y":2021.3361,"c":"work","s":"40 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見十九老得走不動卻堅持看門留下的影響。","m":"自嘲","f":"memories/2021-05-02-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,82,68,12],"deg":7,"b":"2021-05-02，南方的光白得像鹽。40 歲的許思明正在經歷「十九老得走不動卻堅持看門」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":416},{"id":"d391","t":"颱風來前的四小時｜四十歲的反向生日蠟燭","d":"2021-05-20","y":2021.3854,"c":"coast","s":"40 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見十九老得走不動卻堅持看門留下的影響。","m":"專注","f":"memories/2021-05-20-08-storm.md","k":6,"arm":0,"ents":[25,26,87,3,82,62,27,12],"deg":9,"b":"2021-05-20，風停了，連狗都顯得不習慣。40 歲的許思明正在經歷「十九老得走不動卻堅持看門」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":397},{"id":"d392","t":"一鍋太酸的湯｜四十歲的反向生日蠟燭","d":"2021-06-07","y":2021.4331,"c":"kin","s":"40 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見十九老得走不動卻堅持看門留下的影響。","m":"柔軟","f":"memories/2021-06-07-09-meal.md","k":9,"arm":0,"ents":[28,7,87,3,82,29,6],"deg":7,"b":"2021-06-07，午後雷雨把街面洗成深灰。40 歲的許思明正在經歷「十九老得走不動卻堅持看門」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有鹽粒卡在手腕細小的傷口。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":373},{"id":"d393","t":"風不負責回答｜四十歲的反向生日蠟燭","d":"2021-06-25","y":2021.4824,"c":"thought","s":"40 歲的許思明在思明 FM經歷「風不負責回答」，也重新看見十九老得走不動卻堅持看門留下的影響。","m":"遲疑","f":"memories/2021-06-25-10-radio.md","k":6,"arm":1,"ents":[77,78,2,3,82,62,79,12],"deg":16,"b":"2021-06-25，午後雷雨把街面洗成深灰。40 歲的許思明正在經歷「十九老得走不動卻堅持看門」。她今天給自己的工作很簡單：打開深夜麥克風，讓來電者講完一個沒有結局的夢，只在必要時問一句當時風從哪邊來。\n\n現場有鐵鏽和九層塔混在一起的氣味。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":366},{"id":"d394","t":"關店後的城牆｜四十歲的反向生日蠟燭","d":"2021-07-14","y":2021.5356,"c":"body","s":"40 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見青禾提出共同買一小塊地留下的影響。","m":"開闊","f":"memories/2021-07-14-11-walk.md","k":3,"arm":0,"ents":[32,33,87,3,82,34,12],"deg":7,"b":"2021-07-14，空氣黏得每張紙都捲邊。40 歲的許思明正在經歷「青禾提出共同買一小塊地」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":342},{"id":"d395","t":"旅人帶來的破東西｜四十歲的反向生日蠟燭","d":"2021-08-01","y":2021.5833,"c":"travel","s":"40 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見青禾提出共同買一小塊地留下的影響。","m":"自嘲","f":"memories/2021-08-01-12-visitor.md","k":10,"arm":1,"ents":[35,13,87,3,82,62,68,12],"deg":8,"b":"2021-08-01，落山風把招牌吹得咯咯響。40 歲的許思明正在經歷「青禾提出共同買一小塊地」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有曬熱木板摸起來微微發黏。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":379},{"id":"d396","t":"母親說只是順便｜四十歲的反向生日蠟燭","d":"2021-08-19","y":2021.6326,"c":"kin","s":"40 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見青禾提出共同買一小塊地留下的影響。","m":"專注","f":"memories/2021-08-19-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,82,29,6],"deg":7,"b":"2021-08-19，落山風把招牌吹得咯咯響。40 歲的許思明正在經歷「青禾提出共同買一小塊地」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":407},{"id":"d397","t":"父親的工具牆｜四十歲的反向生日蠟燭","d":"2021-09-06","y":2021.6804,"c":"kin","s":"40 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見青禾提出共同買一小塊地留下的影響。","m":"柔軟","f":"memories/2021-09-06-14-father.md","k":6,"arm":0,"ents":[38,39,87,3,82,62,68,12],"deg":8,"b":"2021-09-06，落山風把招牌吹得咯咯響。40 歲的許思明正在經歷「青禾提出共同買一小塊地」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":387},{"id":"d398","t":"兩個人各自沉默｜四十歲的反向生日蠟燭","d":"2021-09-25","y":2021.7324,"c":"love","s":"40 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見青禾提出共同買一小塊地留下的影響。","m":"遲疑","f":"memories/2021-09-25-15-love.md","k":3,"arm":0,"ents":[18,41,87,3,82,42,12],"deg":7,"b":"2021-09-25，落山風把招牌吹得咯咯響。40 歲的許思明正在經歷「青禾提出共同買一小塊地」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有鐵鏽和九層塔混在一起的氣味。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":377},{"id":"d399","t":"紙袋裡的種子｜四十歲的反向生日蠟燭","d":"2021-10-13","y":2021.7829,"c":"field","s":"40 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見思明說先種樹再談房子留下的影響。","m":"開闊","f":"memories/2021-10-13-16-seed.md","k":6,"arm":1,"ents":[43,44,2,3,82,62,68,12],"deg":8,"b":"2021-10-13，雲壓得很低，海卻異常平。40 歲的許思明正在經歷「思明說先種樹再談房子」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有紙張受潮後像剛醒來的皮膚。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":361},{"id":"d400","t":"昨夜夢見店長出鰓｜四十歲的反向生日蠟燭","d":"2021-10-31","y":2021.8322,"c":"thought","s":"40 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見思明說先種樹再談房子留下的影響。","m":"自嘲","f":"memories/2021-10-31-17-dream.md","k":5,"arm":1,"ents":[45,46,87,3,82,47,6],"deg":7,"b":"2021-10-31，南方的光白得像鹽。40 歲的許思明正在經歷「思明說先種樹再談房子」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有鹽粒卡在手腕細小的傷口。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":336},{"id":"d401","t":"離開半島的一天｜四十歲的反向生日蠟燭","d":"2021-11-18","y":2021.8799,"c":"travel","s":"40 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見思明說先種樹再談房子留下的影響。","m":"專注","f":"memories/2021-11-18-18-trip.md","k":6,"arm":1,"ents":[48,49,87,3,82,62,50,12],"deg":9,"b":"2021-11-18，落山風把招牌吹得咯咯響。40 歲的許思明正在經歷「思明說先種樹再談房子」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有鐵鏽和九層塔混在一起的氣味。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":371},{"id":"d402","t":"無法分類的下午｜四十歲的反向生日蠟燭","d":"2021-12-07","y":2021.9331,"c":"thought","s":"40 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見思明說先種樹再談房子留下的影響。","m":"柔軟","f":"memories/2021-12-07-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,82,68,12],"deg":7,"b":"2021-12-07，風停了，連狗都顯得不習慣。40 歲的許思明正在經歷「思明說先種樹再談房子」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":413},{"id":"d403","t":"年末不完整清單｜四十歲的反向生日蠟燭","d":"2021-12-25","y":2021.9824,"c":"thought","s":"40 歲的許思明在鹹風標本室經歷「年末不完整清單」，也重新看見思明說先種樹再談房子留下的影響。","m":"遲疑","f":"memories/2021-12-25-20-inventory.md","k":6,"arm":1,"ents":[53,54,87,3,82,62,68,12],"deg":10,"b":"2021-12-25，空氣黏得每張紙都捲邊。40 歲的許思明正在經歷「思明說先種樹再談房子」。她今天給自己的工作很簡單：盤點留下、送走、修好與仍然不明白的東西，故意保留空白，不把一年假裝成已經結案。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。四十歲生日，她規定每位來客帶走一樣店裡的東西，結果少掉二十七件雜物，多了二十七段物件後來去了哪裡的消息。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":399},{"id":"d404","t":"今天的風不肯直走｜父親口袋裡的螺絲","d":"2022-01-13","y":2022.0329,"c":"coast","s":"41 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見第一次陪父親做認知檢查留下的影響。","m":"溫柔","f":"memories/2022-01-13-01-wind.md","k":8,"arm":0,"ents":[0,1,2,3,56,5,6],"deg":7,"b":"2022-01-13，雲壓得很低，海卻異常平。41 歲的許思明正在經歷「第一次陪父親做認知檢查」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":417},{"id":"d405","t":"市場開門以前｜父親口袋裡的螺絲","d":"2022-02-01","y":2022.0833,"c":"home","s":"41 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見第一次陪父親做認知檢查留下的影響。","m":"自嘲","f":"memories/2022-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,88,3,56,58,11,12],"deg":8,"b":"2022-02-01，午後雷雨把街面洗成深灰。41 歲的許思明正在經歷「第一次陪父親做認知檢查」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鐵鏽和九層塔混在一起的氣味。那不是象徵，只是我確實站在那裡。\n\n現場有鐵鏽和九層塔混在一起的氣味。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":398},{"id":"d406","t":"維修單上的壞脾氣｜父親口袋裡的螺絲","d":"2022-02-20","y":2022.1354,"c":"craft","s":"41 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見第一次陪父親做認知檢查留下的影響。","m":"專注","f":"memories/2022-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,88,3,56,68,12],"deg":7,"b":"2022-02-20，午後雷雨把街面洗成深灰。41 歲的許思明正在經歷「第一次陪父親做認知檢查」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有遠處機車聲被風切成斷句。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":377},{"id":"d407","t":"十九的巡邏路線｜父親口袋裡的螺絲","d":"2022-03-11","y":2022.1941,"c":"home","s":"41 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見第一次陪父親做認知檢查留下的影響。","m":"柔軟","f":"memories/2022-03-11-04-dog.md","k":8,"arm":0,"ents":[65,66,2,3,56,58,17,12],"deg":14,"b":"2022-03-11，雲壓得很低，海卻異常平。41 歲的許思明正在經歷「第一次陪父親做認知檢查」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有遠處機車聲被風切成斷句。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":377},{"id":"d408","t":"給遠方的一封慢信｜父親口袋裡的螺絲","d":"2022-03-31","y":2022.2489,"c":"love","s":"41 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見第一次陪父親做認知檢查留下的影響。","m":"遲疑","f":"memories/2022-03-31-05-letter.md","k":8,"arm":0,"ents":[18,19,88,3,56,68,6],"deg":7,"b":"2022-03-31，南方的光白得像鹽。41 歲的許思明正在經歷「第一次陪父親做認知檢查」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":346},{"id":"d409","t":"樣方偏了七公分｜父親口袋裡的螺絲","d":"2022-04-19","y":2022.2993,"c":"field","s":"41 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見母親把疲倦說成只是沒睡飽留下的影響。","m":"溫柔","f":"memories/2022-04-19-06-field.md","k":8,"arm":1,"ents":[20,21,88,3,56,58,22,12],"deg":8,"b":"2022-04-19，空氣黏得每張紙都捲邊。41 歲的許思明正在經歷「母親把疲倦說成只是沒睡飽」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有遠處機車聲被風切成斷句。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":373},{"id":"d410","t":"零錢盒與月底｜父親口袋裡的螺絲","d":"2022-05-08","y":2022.3525,"c":"work","s":"41 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見母親把疲倦說成只是沒睡飽留下的影響。","m":"自嘲","f":"memories/2022-05-08-07-money.md","k":8,"arm":1,"ents":[23,24,2,3,56,68,12],"deg":7,"b":"2022-05-08，落山風把招牌吹得咯咯響。41 歲的許思明正在經歷「母親把疲倦說成只是沒睡飽」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":413},{"id":"d411","t":"颱風來前的四小時｜父親口袋裡的螺絲","d":"2022-05-27","y":2022.4046,"c":"coast","s":"41 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見母親把疲倦說成只是沒睡飽留下的影響。","m":"專注","f":"memories/2022-05-27-08-storm.md","k":8,"arm":0,"ents":[25,26,88,3,56,58,27,12],"deg":8,"b":"2022-05-27，空氣黏得每張紙都捲邊。41 歲的許思明正在經歷「母親把疲倦說成只是沒睡飽」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":390},{"id":"d412","t":"一鍋太酸的湯｜父親口袋裡的螺絲","d":"2022-06-15","y":2022.455,"c":"kin","s":"41 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見母親把疲倦說成只是沒睡飽留下的影響。","m":"柔軟","f":"memories/2022-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,88,3,56,29,6],"deg":7,"b":"2022-06-15，落山風把招牌吹得咯咯響。41 歲的許思明正在經歷「母親把疲倦說成只是沒睡飽」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有鐵鏽和九層塔混在一起的氣味。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":382},{"id":"d413","t":"風不負責回答｜父親口袋裡的螺絲","d":"2022-07-05","y":2022.511,"c":"thought","s":"41 歲的許思明在思明 FM經歷「風不負責回答」，也重新看見母親把疲倦說成只是沒睡飽留下的影響。","m":"遲疑","f":"memories/2022-07-05-10-radio.md","k":8,"arm":1,"ents":[77,78,2,3,56,58,79,12],"deg":16,"b":"2022-07-05，午後雷雨把街面洗成深灰。41 歲的許思明正在經歷「母親把疲倦說成只是沒睡飽」。她今天給自己的工作很簡單：打開深夜麥克風，讓來電者講完一個沒有結局的夢，只在必要時問一句當時風從哪邊來。\n\n現場有市場冰塊融水流過鞋底。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":348},{"id":"d414","t":"關店後的城牆｜父親口袋裡的螺絲","d":"2022-07-24","y":2022.563,"c":"body","s":"41 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見青禾接手店裡一半雜務留下的影響。","m":"溫柔","f":"memories/2022-07-24-11-walk.md","k":8,"arm":0,"ents":[32,33,88,3,56,34,12],"deg":7,"b":"2022-07-24，南方的光白得像鹽。41 歲的許思明正在經歷「青禾接手店裡一半雜務」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":350},{"id":"d415","t":"旅人帶來的破東西｜父親口袋裡的螺絲","d":"2022-08-12","y":2022.6135,"c":"travel","s":"41 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見青禾接手店裡一半雜務留下的影響。","m":"自嘲","f":"memories/2022-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,88,3,56,58,68,12],"deg":8,"b":"2022-08-12，風停了，連狗都顯得不習慣。41 歲的許思明正在經歷「青禾接手店裡一半雜務」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有紙張受潮後像剛醒來的皮膚。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":372},{"id":"d416","t":"母親說只是順便｜父親口袋裡的螺絲","d":"2022-08-31","y":2022.6655,"c":"kin","s":"41 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見青禾接手店裡一半雜務留下的影響。","m":"專注","f":"memories/2022-08-31-13-mother.md","k":8,"arm":0,"ents":[36,37,2,3,56,29,6],"deg":7,"b":"2022-08-31，落山風把招牌吹得咯咯響。41 歲的許思明正在經歷「青禾接手店裡一半雜務」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":417},{"id":"d417","t":"父親的工具牆｜父親口袋裡的螺絲","d":"2022-09-20","y":2022.7187,"c":"kin","s":"41 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見青禾接手店裡一半雜務留下的影響。","m":"柔軟","f":"memories/2022-09-20-14-father.md","k":8,"arm":0,"ents":[38,39,88,3,56,58,68,12],"deg":8,"b":"2022-09-20，空氣黏得每張紙都捲邊。41 歲的許思明正在經歷「青禾接手店裡一半雜務」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":392},{"id":"d418","t":"兩個人各自沉默｜父親口袋裡的螺絲","d":"2022-10-09","y":2022.7719,"c":"love","s":"41 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見青禾接手店裡一半雜務留下的影響。","m":"遲疑","f":"memories/2022-10-09-15-love.md","k":8,"arm":0,"ents":[18,41,88,3,56,42,12],"deg":7,"b":"2022-10-09，風停了，連狗都顯得不習慣。41 歲的許思明正在經歷「青禾接手店裡一半雜務」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有鹽粒卡在手腕細小的傷口。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":366},{"id":"d419","t":"紙袋裡的種子｜父親口袋裡的螺絲","d":"2022-10-28","y":2022.824,"c":"field","s":"41 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見她為家人建立不按日期的檔案留下的影響。","m":"溫柔","f":"memories/2022-10-28-16-seed.md","k":8,"arm":1,"ents":[43,44,2,3,56,58,68,12],"deg":8,"b":"2022-10-28，午後雷雨把街面洗成深灰。41 歲的許思明正在經歷「她為家人建立不按日期的檔案」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有遠處機車聲被風切成斷句。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":356},{"id":"d420","t":"昨夜夢見店長出鰓｜父親口袋裡的螺絲","d":"2022-11-16","y":2022.8744,"c":"thought","s":"41 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見她為家人建立不按日期的檔案留下的影響。","m":"自嘲","f":"memories/2022-11-16-17-dream.md","k":8,"arm":1,"ents":[45,46,88,3,56,47,6],"deg":7,"b":"2022-11-16，落山風把招牌吹得咯咯響。41 歲的許思明正在經歷「她為家人建立不按日期的檔案」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有紙張受潮後像剛醒來的皮膚。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":355},{"id":"d421","t":"離開半島的一天｜父親口袋裡的螺絲","d":"2022-12-05","y":2022.9276,"c":"travel","s":"41 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見她為家人建立不按日期的檔案留下的影響。","m":"專注","f":"memories/2022-12-05-18-trip.md","k":8,"arm":1,"ents":[48,49,88,3,56,58,50,12],"deg":8,"b":"2022-12-05，雲壓得很低，海卻異常平。41 歲的許思明正在經歷「她為家人建立不按日期的檔案」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有紙張受潮後像剛醒來的皮膚。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":374},{"id":"d422","t":"無法分類的下午｜父親口袋裡的螺絲","d":"2022-12-25","y":2022.9824,"c":"thought","s":"41 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見她為家人建立不按日期的檔案留下的影響。","m":"柔軟","f":"memories/2022-12-25-19-odd.md","k":8,"arm":1,"ents":[51,52,2,3,56,68,12],"deg":7,"b":"2022-12-25，南方的光白得像鹽。41 歲的許思明正在經歷「她為家人建立不按日期的檔案」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。父親的記憶越來越鬆。他常把螺絲收進口袋，說機器會自己來找。思明不再糾正，只陪他把同一台電扇拆開三次。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":427},{"id":"d423","t":"今天的風不肯直走｜沒有嬰兒房的平面圖","d":"2023-01-13","y":2023.0329,"c":"coast","s":"42 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見列出想要與不想要的人生留下的影響。","m":"清明","f":"memories/2023-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,82,5,6],"deg":7,"b":"2023-01-13，空氣黏得每張紙都捲邊。42 歲的許思明正在經歷「列出想要與不想要的人生」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":400},{"id":"d424","t":"市場開門以前｜沒有嬰兒房的平面圖","d":"2023-02-01","y":2023.0833,"c":"home","s":"42 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見列出想要與不想要的人生留下的影響。","m":"自嘲","f":"memories/2023-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,89,3,82,58,11,12],"deg":9,"b":"2023-02-01，雲壓得很低，海卻異常平。42 歲的許思明正在經歷「列出想要與不想要的人生」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":394},{"id":"d425","t":"維修單上的壞脾氣｜沒有嬰兒房的平面圖","d":"2023-02-20","y":2023.1354,"c":"craft","s":"42 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見列出想要與不想要的人生留下的影響。","m":"專注","f":"memories/2023-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,89,3,82,68,12],"deg":7,"b":"2023-02-20，空氣黏得每張紙都捲邊。42 歲的許思明正在經歷「列出想要與不想要的人生」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有鐵鏽和九層塔混在一起的氣味。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":377},{"id":"d426","t":"十九的巡邏路線｜沒有嬰兒房的平面圖","d":"2023-03-11","y":2023.1941,"c":"home","s":"42 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見列出想要與不想要的人生留下的影響。","m":"柔軟","f":"memories/2023-03-11-04-dog.md","k":3,"arm":0,"ents":[65,66,2,3,82,58,17,12],"deg":10,"b":"2023-03-11，風停了，連狗都顯得不習慣。42 歲的許思明正在經歷「列出想要與不想要的人生」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有曬熱木板摸起來微微發黏。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":374},{"id":"d427","t":"給遠方的一封慢信｜沒有嬰兒房的平面圖","d":"2023-03-31","y":2023.2489,"c":"love","s":"42 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見列出想要與不想要的人生留下的影響。","m":"遲疑","f":"memories/2023-03-31-05-letter.md","k":5,"arm":0,"ents":[18,19,89,3,82,68,6],"deg":7,"b":"2023-03-31，風停了，連狗都顯得不習慣。42 歲的許思明正在經歷「列出想要與不想要的人生」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有鹽粒卡在手腕細小的傷口。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":353},{"id":"d428","t":"樣方偏了七公分｜沒有嬰兒房的平面圖","d":"2023-04-19","y":2023.2993,"c":"field","s":"42 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見母親沉默一週後送來舊櫃子留下的影響。","m":"清明","f":"memories/2023-04-19-06-field.md","k":3,"arm":1,"ents":[20,21,89,3,82,58,22,12],"deg":9,"b":"2023-04-19，落山風把招牌吹得咯咯響。42 歲的許思明正在經歷「母親沉默一週後送來舊櫃子」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有市場冰塊融水流過鞋底。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":370},{"id":"d429","t":"零錢盒與月底｜沒有嬰兒房的平面圖","d":"2023-05-08","y":2023.3525,"c":"work","s":"42 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見母親沉默一週後送來舊櫃子留下的影響。","m":"自嘲","f":"memories/2023-05-08-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,82,68,12],"deg":7,"b":"2023-05-08，落山風把招牌吹得咯咯響。42 歲的許思明正在經歷「母親沉默一週後送來舊櫃子」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":420},{"id":"d430","t":"颱風來前的四小時｜沒有嬰兒房的平面圖","d":"2023-05-27","y":2023.4046,"c":"coast","s":"42 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見母親沉默一週後送來舊櫃子留下的影響。","m":"專注","f":"memories/2023-05-27-08-storm.md","k":3,"arm":0,"ents":[25,26,89,3,82,58,27,12],"deg":9,"b":"2023-05-27，午後雷雨把街面洗成深灰。42 歲的許思明正在經歷「母親沉默一週後送來舊櫃子」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鐵鏽和九層塔混在一起的氣味。那不是象徵，只是我確實站在那裡。\n\n現場有鐵鏽和九層塔混在一起的氣味。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":384},{"id":"d431","t":"一鍋太酸的湯｜沒有嬰兒房的平面圖","d":"2023-06-15","y":2023.455,"c":"kin","s":"42 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見母親沉默一週後送來舊櫃子留下的影響。","m":"柔軟","f":"memories/2023-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,89,3,82,29,6],"deg":7,"b":"2023-06-15，落山風把招牌吹得咯咯響。42 歲的許思明正在經歷「母親沉默一週後送來舊櫃子」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有鐵鏽和九層塔混在一起的氣味。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":368},{"id":"d432","t":"風不負責回答｜沒有嬰兒房的平面圖","d":"2023-07-05","y":2023.511,"c":"thought","s":"42 歲的許思明在思明 FM經歷「風不負責回答」，也重新看見母親沉默一週後送來舊櫃子留下的影響。","m":"遲疑","f":"memories/2023-07-05-10-radio.md","k":3,"arm":1,"ents":[77,78,2,3,82,58,79,12],"deg":15,"b":"2023-07-05，落山風把招牌吹得咯咯響。42 歲的許思明正在經歷「母親沉默一週後送來舊櫃子」。她今天給自己的工作很簡單：打開深夜麥克風，讓來電者講完一個沒有結局的夢，只在必要時問一句當時風從哪邊來。\n\n現場有曬熱木板摸起來微微發黏。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":364},{"id":"d433","t":"關店後的城牆｜沒有嬰兒房的平面圖","d":"2023-07-24","y":2023.563,"c":"body","s":"42 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見種子庫收到第一批豆類留下的影響。","m":"清明","f":"memories/2023-07-24-11-walk.md","k":3,"arm":0,"ents":[32,33,89,3,82,34,12],"deg":7,"b":"2023-07-24，雲壓得很低，海卻異常平。42 歲的許思明正在經歷「種子庫收到第一批豆類」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":338},{"id":"d434","t":"旅人帶來的破東西｜沒有嬰兒房的平面圖","d":"2023-08-12","y":2023.6135,"c":"travel","s":"42 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見種子庫收到第一批豆類留下的影響。","m":"自嘲","f":"memories/2023-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,89,3,82,58,68,12],"deg":8,"b":"2023-08-12，午後雷雨把街面洗成深灰。42 歲的許思明正在經歷「種子庫收到第一批豆類」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有遠處機車聲被風切成斷句。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":375},{"id":"d435","t":"母親說只是順便｜沒有嬰兒房的平面圖","d":"2023-08-31","y":2023.6655,"c":"kin","s":"42 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見種子庫收到第一批豆類留下的影響。","m":"專注","f":"memories/2023-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,82,29,6],"deg":7,"b":"2023-08-31，午後雷雨把街面洗成深灰。42 歲的許思明正在經歷「種子庫收到第一批豆類」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":403},{"id":"d436","t":"父親的工具牆｜沒有嬰兒房的平面圖","d":"2023-09-20","y":2023.7187,"c":"kin","s":"42 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見種子庫收到第一批豆類留下的影響。","m":"柔軟","f":"memories/2023-09-20-14-father.md","k":4,"arm":0,"ents":[38,39,89,3,82,58,68,12],"deg":8,"b":"2023-09-20，落山風把招牌吹得咯咯響。42 歲的許思明正在經歷「種子庫收到第一批豆類」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":397},{"id":"d437","t":"兩個人各自沉默｜沒有嬰兒房的平面圖","d":"2023-10-09","y":2023.7719,"c":"love","s":"42 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見種子庫收到第一批豆類留下的影響。","m":"遲疑","f":"memories/2023-10-09-15-love.md","k":3,"arm":0,"ents":[18,41,89,3,82,42,12],"deg":7,"b":"2023-10-09，午後雷雨把街面洗成深灰。42 歲的許思明正在經歷「種子庫收到第一批豆類」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有市場冰塊融水流過鞋底。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":359},{"id":"d438","t":"種子櫃的訪客｜沒有嬰兒房的平面圖","d":"2023-10-28","y":2023.824,"c":"field","s":"42 歲的許思明在思明生活觀測所經歷「種子櫃的訪客」，也重新看見她們去海邊慶祝一個沒有發生的未來留下的影響。","m":"清明","f":"memories/2023-10-28-16-seed.md","k":3,"arm":1,"ents":[43,90,2,3,82,58,91,12],"deg":8,"b":"2023-10-28，午後雷雨把街面洗成深灰。42 歲的許思明正在經歷「她們去海邊慶祝一個沒有發生的未來」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在卡片上誠實寫下不知道，並邀請送來的人一起等待。\n\n現場有鐵鏽和九層塔混在一起的氣味。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":368},{"id":"d439","t":"昨夜夢見店長出鰓｜沒有嬰兒房的平面圖","d":"2023-11-16","y":2023.8744,"c":"thought","s":"42 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見她們去海邊慶祝一個沒有發生的未來留下的影響。","m":"自嘲","f":"memories/2023-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,89,3,82,47,6],"deg":7,"b":"2023-11-16，落山風把招牌吹得咯咯響。42 歲的許思明正在經歷「她們去海邊慶祝一個沒有發生的未來」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":349},{"id":"d440","t":"離開半島的一天｜沒有嬰兒房的平面圖","d":"2023-12-05","y":2023.9276,"c":"travel","s":"42 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見她們去海邊慶祝一個沒有發生的未來留下的影響。","m":"專注","f":"memories/2023-12-05-18-trip.md","k":3,"arm":1,"ents":[48,49,89,3,82,58,50,12],"deg":9,"b":"2023-12-05，午後雷雨把街面洗成深灰。42 歲的許思明正在經歷「她們去海邊慶祝一個沒有發生的未來」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有遠處機車聲被風切成斷句。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":374},{"id":"d441","t":"無法分類的下午｜沒有嬰兒房的平面圖","d":"2023-12-25","y":2023.9824,"c":"thought","s":"42 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見她們去海邊慶祝一個沒有發生的未來留下的影響。","m":"柔軟","f":"memories/2023-12-25-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,82,68,12],"deg":7,"b":"2023-12-25，空氣黏得每張紙都捲邊。42 歲的許思明正在經歷「她們去海邊慶祝一個沒有發生的未來」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。她和青禾認真談過要不要成為母親，最後決定把那間預留的房間做成社區種子庫。決定並不悲壯，只是很清楚。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":428},{"id":"d442","t":"今天的風不肯直走｜四十種風的紙旗","d":"2024-01-13","y":2024.0329,"c":"coast","s":"43 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見向四十位居民收集風名留下的影響。","m":"釋然","f":"memories/2024-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,82,5,6],"deg":7,"b":"2024-01-13，風停了，連狗都顯得不習慣。43 歲的許思明正在經歷「向四十位居民收集風名」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。《風經過的四十種名字》在舊城裡展開。紙旗記錄居民對風的稱呼，風一吹就互相遮住，正好證明記憶從來不會整齊排隊。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":416},{"id":"d443","t":"市場開門以前｜四十種風的紙旗","d":"2024-02-01","y":2024.0833,"c":"home","s":"43 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見向四十位居民收集風名留下的影響。","m":"自嘲","f":"memories/2024-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,92,3,82,4,11,12],"deg":8,"b":"2024-02-01，午後雷雨把街面洗成深灰。43 歲的許思明正在經歷「向四十位居民收集風名」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得遠處機車聲被風切成斷句。那不是象徵，只是我確實站在那裡。\n\n現場有遠處機車聲被風切成斷句。《風經過的四十種名字》在舊城裡展開。紙旗記錄居民對風的稱呼，風一吹就互相遮住，正好證明記憶從來不會整齊排隊。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":396},{"id":"d444","t":"維修單上的壞脾氣｜四十種風的紙旗","d":"2024-02-20","y":2024.1354,"c":"craft","s":"43 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見向四十位居民收集風名留下的影響。","m":"專注","f":"memories/2024-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,92,3,82,68,12],"deg":7,"b":"2024-02-20，雲壓得很低，海卻異常平。43 歲的許思明正在經歷「向四十位居民收集風名」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有曬熱木板摸起來微微發黏。《風經過的四十種名字》在舊城裡展開。紙旗記錄居民對風的稱呼，風一吹就互相遮住，正好證明記憶從來不會整齊排隊。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":373},{"id":"d445","t":"十九的巡邏路線｜四十種風的紙旗","d":"2024-03-11","y":2024.1941,"c":"home","s":"43 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見向四十位居民收集風名留下的影響。","m":"柔軟","f":"memories/2024-03-11-04-dog.md","k":3,"arm":0,"ents":[65,66,2,3,82,4,17,12],"deg":8,"b":"2024-03-11，雲壓得很低，海卻異常平。43 歲的許思明正在經歷「向四十位居民收集風名」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有市場冰塊融水流過鞋底。《風經過的四十種名字》在舊城裡展開。紙旗記錄居民對風的稱呼，風一吹就互相遮住，正好證明記憶從來不會整齊排隊。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":376},{"id":"d446","t":"給遠方的一封慢信｜四十種風的紙旗","d":"2024-03-30","y":2024.2461,"c":"love","s":"43 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見向四十位居民收集風名留下的影響。","m":"遲疑","f":"memories/2024-03-30-05-letter.md","k":5,"arm":0,"ents":[18,19,92,3,82,68,6],"deg":7,"b":"2024-03-30，南方的光白得像鹽。43 歲的許思明正在經歷「向四十位居民收集風名」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。《風經過的四十種名字》在舊城裡展開。紙旗記錄居民對風的稱呼，風一吹就互相遮住，正好證明記憶從來不會整齊排隊。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":356},{"id":"d447","t":"樣方偏了七公分｜四十種風的紙旗","d":"2024-04-18","y":2024.2966,"c":"field","s":"43 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見季穗帶著劇團回來協作留下的影響。","m":"釋然","f":"memories/2024-04-18-06-field.md","k":3,"arm":1,"ents":[20,21,92,3,82,4,22,12],"deg":8,"b":"2024-04-18，空氣黏得每張紙都捲邊。43 歲的許思明正在經歷「季穗帶著劇團回來協作」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有鐵鏽和九層塔混在一起的氣味。《風經過的四十種名字》在舊城裡展開。紙旗記錄居民對風的稱呼，風一吹就互相遮住，正好證明記憶從來不會整齊排隊。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":378},{"id":"d448","t":"零錢盒與月底｜四十種風的紙旗","d":"2024-05-07","y":2024.3498,"c":"work","s":"43 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見季穗帶著劇團回來協作留下的影響。","m":"自嘲","f":"memories/2024-05-07-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,82,68,12],"deg":7,"b":"2024-05-07，落山風把招牌吹得咯咯響。43 歲的許思明正在經歷「季穗帶著劇團回來協作」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\
