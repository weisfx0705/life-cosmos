察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":419},{"id":"d218","t":"颱風來前的四小時｜空著的木衣架","d":"2012-05-19","y":2012.3826,"c":"coast","s":"31 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見十九守在空衣架下睡了三天留下的影響。","m":"專注","f":"memories/2012-05-19-08-storm.md","k":6,"arm":0,"ents":[25,26,74,3,4,62,27,12],"deg":9,"b":"2012-05-19，午後雷雨把街面洗成深灰。31 歲的許思明正在經歷「十九守在空衣架下睡了三天」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":382},{"id":"d219","t":"一鍋太酸的湯｜空著的木衣架","d":"2012-06-07","y":2012.4331,"c":"kin","s":"31 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見十九守在空衣架下睡了三天留下的影響。","m":"柔軟","f":"memories/2012-06-07-09-meal.md","k":9,"arm":0,"ents":[28,7,74,3,4,29,6],"deg":7,"b":"2012-06-07，南方的光白得像鹽。31 歲的許思明正在經歷「十九守在空衣架下睡了三天」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有遠處機車聲被風切成斷句。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":365},{"id":"d220","t":"把夜聲收進錄音帶｜空著的木衣架","d":"2012-06-25","y":2012.4824,"c":"thought","s":"31 歲的許思明在鹹風標本室經歷「把夜聲收進錄音帶」，也重新看見十九守在空衣架下睡了三天留下的影響。","m":"遲疑","f":"memories/2012-06-25-10-radio.md","k":6,"arm":1,"ents":[30,31,2,3,4,62,68,12],"deg":9,"b":"2012-06-25，午後雷雨把街面洗成深灰。31 歲的許思明正在經歷「十九守在空衣架下睡了三天」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有曬熱木板摸起來微微發黏。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":366},{"id":"d221","t":"關店後的城牆｜空著的木衣架","d":"2012-07-13","y":2012.5329,"c":"body","s":"31 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見思明第一次獨自關店過年留下的影響。","m":"失落","f":"memories/2012-07-13-11-walk.md","k":1,"arm":0,"ents":[32,33,74,3,4,34,12],"deg":7,"b":"2012-07-13，午後雷雨把街面洗成深灰。31 歲的許思明正在經歷「思明第一次獨自關店過年」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":340},{"id":"d222","t":"旅人帶來的破東西｜空著的木衣架","d":"2012-08-01","y":2012.5833,"c":"travel","s":"31 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見思明第一次獨自關店過年留下的影響。","m":"自嘲","f":"memories/2012-08-01-12-visitor.md","k":10,"arm":1,"ents":[35,13,74,3,4,62,68,12],"deg":8,"b":"2012-08-01，午後雷雨把街面洗成深灰。31 歲的許思明正在經歷「思明第一次獨自關店過年」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有紙張受潮後像剛醒來的皮膚。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":382},{"id":"d223","t":"母親說只是順便｜空著的木衣架","d":"2012-08-19","y":2012.6326,"c":"kin","s":"31 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見思明第一次獨自關店過年留下的影響。","m":"專注","f":"memories/2012-08-19-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,4,29,6],"deg":7,"b":"2012-08-19，空氣黏得每張紙都捲邊。31 歲的許思明正在經歷「思明第一次獨自關店過年」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":409},{"id":"d224","t":"父親的工具牆｜空著的木衣架","d":"2012-09-06","y":2012.6804,"c":"kin","s":"31 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見思明第一次獨自關店過年留下的影響。","m":"柔軟","f":"memories/2012-09-06-14-father.md","k":6,"arm":0,"ents":[38,39,74,3,4,62,68,12],"deg":8,"b":"2012-09-06，空氣黏得每張紙都捲邊。31 歲的許思明正在經歷「思明第一次獨自關店過年」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":384},{"id":"d225","t":"兩個人各自沉默｜空著的木衣架","d":"2012-09-24","y":2012.7297,"c":"love","s":"31 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見思明第一次獨自關店過年留下的影響。","m":"遲疑","f":"memories/2012-09-24-15-love.md","k":1,"arm":0,"ents":[18,41,74,3,4,42,12],"deg":7,"b":"2012-09-24，南方的光白得像鹽。31 歲的許思明正在經歷「思明第一次獨自關店過年」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有鐵鏽和九層塔混在一起的氣味。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":361},{"id":"d226","t":"紙袋裡的種子｜空著的木衣架","d":"2012-10-13","y":2012.7829,"c":"field","s":"31 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見她把失戀寫成一張維修單留下的影響。","m":"失落","f":"memories/2012-10-13-16-seed.md","k":6,"arm":1,"ents":[43,44,2,3,4,62,68,12],"deg":8,"b":"2012-10-13，落山風把招牌吹得咯咯響。31 歲的許思明正在經歷「她把失戀寫成一張維修單」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有鹽粒卡在手腕細小的傷口。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":361},{"id":"d227","t":"昨夜夢見店長出鰓｜空著的木衣架","d":"2012-10-31","y":2012.8322,"c":"thought","s":"31 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見她把失戀寫成一張維修單留下的影響。","m":"自嘲","f":"memories/2012-10-31-17-dream.md","k":5,"arm":1,"ents":[45,46,74,3,4,47,6],"deg":7,"b":"2012-10-31，午後雷雨把街面洗成深灰。31 歲的許思明正在經歷「她把失戀寫成一張維修單」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有鹽粒卡在手腕細小的傷口。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":341},{"id":"d228","t":"離開半島的一天｜空著的木衣架","d":"2012-11-18","y":2012.8799,"c":"travel","s":"31 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見她把失戀寫成一張維修單留下的影響。","m":"專注","f":"memories/2012-11-18-18-trip.md","k":6,"arm":1,"ents":[48,49,74,3,4,62,50,12],"deg":9,"b":"2012-11-18，午後雷雨把街面洗成深灰。31 歲的許思明正在經歷「她把失戀寫成一張維修單」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有市場冰塊融水流過鞋底。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":367},{"id":"d229","t":"無法分類的下午｜空著的木衣架","d":"2012-12-07","y":2012.9331,"c":"thought","s":"31 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見她把失戀寫成一張維修單留下的影響。","m":"柔軟","f":"memories/2012-12-07-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,4,68,12],"deg":7,"b":"2012-12-07，雲壓得很低，海卻異常平。31 歲的許思明正在經歷「她把失戀寫成一張維修單」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":423},{"id":"d230","t":"年末不完整清單｜空著的木衣架","d":"2012-12-25","y":2012.9824,"c":"thought","s":"31 歲的許思明在鹹風標本室經歷「年末不完整清單」，也重新看見她把失戀寫成一張維修單留下的影響。","m":"遲疑","f":"memories/2012-12-25-20-inventory.md","k":6,"arm":1,"ents":[53,54,74,3,4,62,68,12],"deg":10,"b":"2012-12-25，空氣黏得每張紙都捲邊。31 歲的許思明正在經歷「她把失戀寫成一張維修單」。她今天給自己的工作很簡單：盤點留下、送走、修好與仍然不明白的東西，故意保留空白，不把一年假裝成已經結案。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":392},{"id":"d231","t":"今天的風不肯直走｜沒有寄出的維修單","d":"2013-01-13","y":2013.0329,"c":"coast","s":"32 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見拒絕把標本室改成網美店留下的影響。","m":"安靜","f":"memories/2013-01-13-01-wind.md","k":6,"arm":0,"ents":[0,1,2,3,62,5,6],"deg":9,"b":"2013-01-13，午後雷雨把街面洗成深灰。32 歲的許思明正在經歷「拒絕把標本室改成網美店」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":403},{"id":"d232","t":"市場開門以前｜沒有寄出的維修單","d":"2013-02-01","y":2013.0833,"c":"home","s":"32 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見拒絕把標本室改成網美店留下的影響。","m":"自嘲","f":"memories/2013-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,75,3,62,10,11,12],"deg":10,"b":"2013-02-01，南方的光白得像鹽。32 歲的許思明正在經歷「拒絕把標本室改成網美店」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":396},{"id":"d233","t":"維修單上的壞脾氣｜沒有寄出的維修單","d":"2013-02-20","y":2013.1354,"c":"craft","s":"32 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見拒絕把標本室改成網美店留下的影響。","m":"專注","f":"memories/2013-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,75,3,62,68,12],"deg":7,"b":"2013-02-20，風停了，連狗都顯得不習慣。32 歲的許思明正在經歷「拒絕把標本室改成網美店」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有鹽粒卡在手腕細小的傷口。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":377},{"id":"d234","t":"十九的巡邏路線｜沒有寄出的維修單","d":"2013-03-11","y":2013.1941,"c":"home","s":"32 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見拒絕把標本室改成網美店留下的影響。","m":"柔軟","f":"memories/2013-03-11-04-dog.md","k":7,"arm":0,"ents":[65,66,2,3,62,10,17,12],"deg":14,"b":"2013-03-11，空氣黏得每張紙都捲邊。32 歲的許思明正在經歷「拒絕把標本室改成網美店」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有紙張受潮後像剛醒來的皮膚。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":364},{"id":"d235","t":"給遠方的一封慢信｜沒有寄出的維修單","d":"2013-03-31","y":2013.2489,"c":"love","s":"32 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見拒絕把標本室改成網美店留下的影響。","m":"遲疑","f":"memories/2013-03-31-05-letter.md","k":6,"arm":0,"ents":[18,19,75,3,62,68,6],"deg":7,"b":"2013-03-31，空氣黏得每張紙都捲邊。32 歲的許思明正在經歷「拒絕把標本室改成網美店」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":349},{"id":"d236","t":"樣方偏了七公分｜沒有寄出的維修單","d":"2013-04-19","y":2013.2993,"c":"field","s":"32 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見開始一個人夜走西門留下的影響。","m":"安靜","f":"memories/2013-04-19-06-field.md","k":7,"arm":1,"ents":[20,21,75,3,62,10,22,12],"deg":9,"b":"2013-04-19，風停了，連狗都顯得不習慣。32 歲的許思明正在經歷「開始一個人夜走西門」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有紙張受潮後像剛醒來的皮膚。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":370},{"id":"d237","t":"零錢盒與月底｜沒有寄出的維修單","d":"2013-05-08","y":2013.3525,"c":"work","s":"32 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見開始一個人夜走西門留下的影響。","m":"自嘲","f":"memories/2013-05-08-07-money.md","k":6,"arm":1,"ents":[23,24,2,3,62,68,12],"deg":7,"b":"2013-05-08，午後雷雨把街面洗成深灰。32 歲的許思明正在經歷「開始一個人夜走西門」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":411},{"id":"d238","t":"颱風來前的四小時｜沒有寄出的維修單","d":"2013-05-27","y":2013.4046,"c":"coast","s":"32 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見開始一個人夜走西門留下的影響。","m":"專注","f":"memories/2013-05-27-08-storm.md","k":7,"arm":0,"ents":[25,26,75,3,62,10,27,12],"deg":10,"b":"2013-05-27，南方的光白得像鹽。32 歲的許思明正在經歷「開始一個人夜走西門」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得遠處機車聲被風切成斷句。那不是象徵，只是我確實站在那裡。\n\n現場有遠處機車聲被風切成斷句。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":391},{"id":"d239","t":"一鍋太酸的湯｜沒有寄出的維修單","d":"2013-06-15","y":2013.455,"c":"kin","s":"32 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見開始一個人夜走西門留下的影響。","m":"柔軟","f":"memories/2013-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,75,3,62,29,6],"deg":7,"b":"2013-06-15，雲壓得很低，海卻異常平。32 歲的許思明正在經歷「開始一個人夜走西門」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有鐵鏽和九層塔混在一起的氣味。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":363},{"id":"d240","t":"把夜聲收進錄音帶｜沒有寄出的維修單","d":"2013-07-05","y":2013.511,"c":"thought","s":"32 歲的許思明在鹹風標本室經歷「把夜聲收進錄音帶」，也重新看見開始一個人夜走西門留下的影響。","m":"遲疑","f":"memories/2013-07-05-10-radio.md","k":7,"arm":1,"ents":[30,31,2,3,62,10,68,12],"deg":8,"b":"2013-07-05，午後雷雨把街面洗成深灰。32 歲的許思明正在經歷「開始一個人夜走西門」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有曬熱木板摸起來微微發黏。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":356},{"id":"d241","t":"關店後的城牆｜沒有寄出的維修單","d":"2013-07-24","y":2013.563,"c":"body","s":"32 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見收到季穗從北海道寄來的明信片留下的影響。","m":"安靜","f":"memories/2013-07-24-11-walk.md","k":6,"arm":0,"ents":[32,33,75,3,62,34,12],"deg":7,"b":"2013-07-24，午後雷雨把街面洗成深灰。32 歲的許思明正在經歷「收到季穗從北海道寄來的明信片」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":351},{"id":"d242","t":"旅人帶來的破東西｜沒有寄出的維修單","d":"2013-08-12","y":2013.6135,"c":"travel","s":"32 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見收到季穗從北海道寄來的明信片留下的影響。","m":"自嘲","f":"memories/2013-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,75,3,62,10,68,12],"deg":8,"b":"2013-08-12，落山風把招牌吹得咯咯響。32 歲的許思明正在經歷「收到季穗從北海道寄來的明信片」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有鹽粒卡在手腕細小的傷口。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":373},{"id":"d243","t":"母親說只是順便｜沒有寄出的維修單","d":"2013-08-31","y":2013.6655,"c":"kin","s":"32 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見收到季穗從北海道寄來的明信片留下的影響。","m":"專注","f":"memories/2013-08-31-13-mother.md","k":6,"arm":0,"ents":[36,37,2,3,62,29,6],"deg":7,"b":"2013-08-31，午後雷雨把街面洗成深灰。32 歲的許思明正在經歷「收到季穗從北海道寄來的明信片」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":405},{"id":"d244","t":"父親的工具牆｜沒有寄出的維修單","d":"2013-09-20","y":2013.7187,"c":"kin","s":"32 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見收到季穗從北海道寄來的明信片留下的影響。","m":"柔軟","f":"memories/2013-09-20-14-father.md","k":7,"arm":0,"ents":[38,39,75,3,62,10,68,12],"deg":8,"b":"2013-09-20，雲壓得很低，海卻異常平。32 歲的許思明正在經歷「收到季穗從北海道寄來的明信片」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":402},{"id":"d245","t":"一個人也有兩份沉默｜沒有寄出的維修單","d":"2013-10-09","y":2013.7719,"c":"love","s":"32 歲的許思明在萬里桐經歷「一個人也有兩份沉默」，也重新看見收到季穗從北海道寄來的明信片留下的影響。","m":"遲疑","f":"memories/2013-10-09-15-love.md","k":6,"arm":0,"ents":[33,41,75,3,62,42,12],"deg":7,"b":"2013-10-09，落山風把招牌吹得咯咯響。32 歲的許思明正在經歷「收到季穗從北海道寄來的明信片」。她今天給自己的工作很簡單：獨自在萬里桐坐到海面轉暗，不把安靜誤認成缺少誰，而是辨認自己終於願意承認的需要。\n\n現場有鐵鏽和九層塔混在一起的氣味。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":374},{"id":"d246","t":"紙袋裡的種子｜沒有寄出的維修單","d":"2013-10-28","y":2013.824,"c":"field","s":"32 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見學會不回覆也是一種回答留下的影響。","m":"安靜","f":"memories/2013-10-28-16-seed.md","k":7,"arm":1,"ents":[43,44,2,3,62,10,68,12],"deg":8,"b":"2013-10-28，雲壓得很低，海卻異常平。32 歲的許思明正在經歷「學會不回覆也是一種回答」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有市場冰塊融水流過鞋底。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":363},{"id":"d247","t":"昨夜夢見店長出鰓｜沒有寄出的維修單","d":"2013-11-16","y":2013.8744,"c":"thought","s":"32 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見學會不回覆也是一種回答留下的影響。","m":"自嘲","f":"memories/2013-11-16-17-dream.md","k":6,"arm":1,"ents":[45,46,75,3,62,47,6],"deg":7,"b":"2013-11-16，風停了，連狗都顯得不習慣。32 歲的許思明正在經歷「學會不回覆也是一種回答」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":352},{"id":"d248","t":"離開半島的一天｜沒有寄出的維修單","d":"2013-12-05","y":2013.9276,"c":"travel","s":"32 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見學會不回覆也是一種回答留下的影響。","m":"專注","f":"memories/2013-12-05-18-trip.md","k":7,"arm":1,"ents":[48,49,75,3,62,10,50,12],"deg":10,"b":"2013-12-05，風停了，連狗都顯得不習慣。32 歲的許思明正在經歷「學會不回覆也是一種回答」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有紙張受潮後像剛醒來的皮膚。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":364},{"id":"d249","t":"無法分類的下午｜沒有寄出的維修單","d":"2013-12-25","y":2013.9824,"c":"thought","s":"32 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見學會不回覆也是一種回答留下的影響。","m":"柔軟","f":"memories/2013-12-25-19-odd.md","k":6,"arm":1,"ents":[51,52,2,3,62,68,12],"deg":7,"b":"2013-12-25，落山風把招牌吹得咯咯響。32 歲的許思明正在經歷「學會不回覆也是一種回答」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。她把生活縮得很小，清晨採集、午後修東西、晚上煮一人份的湯。沉默久了，反而聽見自己真正不願妥協的部分。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":418},{"id":"d250","t":"今天的風不肯直走｜思明 FM 的紅燈","d":"2014-01-13","y":2014.0329,"c":"coast","s":"33 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見第一集只有七位聽眾留下的影響。","m":"興奮","f":"memories/2014-01-13-01-wind.md","k":7,"arm":0,"ents":[0,1,2,3,10,5,6],"deg":7,"b":"2014-01-13，雲壓得很低，海卻異常平。33 歲的許思明正在經歷「第一集只有七位聽眾」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":416},{"id":"d251","t":"市場開門以前｜思明 FM 的紅燈","d":"2014-02-01","y":2014.0833,"c":"home","s":"33 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見第一集只有七位聽眾留下的影響。","m":"自嘲","f":"memories/2014-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,76,3,10,56,11,12],"deg":8,"b":"2014-02-01，風停了，連狗都顯得不習慣。33 歲的許思明正在經歷「第一集只有七位聽眾」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":393},{"id":"d252","t":"維修單上的壞脾氣｜思明 FM 的紅燈","d":"2014-02-20","y":2014.1354,"c":"craft","s":"33 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見第一集只有七位聽眾留下的影響。","m":"專注","f":"memories/2014-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,76,3,10,68,12],"deg":7,"b":"2014-02-20，雲壓得很低，海卻異常平。33 歲的許思明正在經歷「第一集只有七位聽眾」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有市場冰塊融水流過鞋底。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":376},{"id":"d253","t":"十九的巡邏路線｜思明 FM 的紅燈","d":"2014-03-11","y":2014.1941,"c":"home","s":"33 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見第一集只有七位聽眾留下的影響。","m":"柔軟","f":"memories/2014-03-11-04-dog.md","k":8,"arm":0,"ents":[65,66,2,3,10,56,17,12],"deg":17,"b":"2014-03-11，風停了，連狗都顯得不習慣。33 歲的許思明正在經歷「第一集只有七位聽眾」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有曬熱木板摸起來微微發黏。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":365},{"id":"d254","t":"給遠方的一封慢信｜思明 FM 的紅燈","d":"2014-03-31","y":2014.2489,"c":"love","s":"33 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見第一集只有七位聽眾留下的影響。","m":"遲疑","f":"memories/2014-03-31-05-letter.md","k":7,"arm":0,"ents":[18,19,76,3,10,68,6],"deg":7,"b":"2014-03-31，午後雷雨把街面洗成深灰。33 歲的許思明正在經歷「第一集只有七位聽眾」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":349},{"id":"d255","t":"樣方偏了七公分｜思明 FM 的紅燈","d":"2014-04-19","y":2014.2993,"c":"field","s":"33 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見父親在電話裡糾正她修馬達的方法留下的影響。","m":"興奮","f":"memories/2014-04-19-06-field.md","k":8,"arm":1,"ents":[20,21,76,3,10,56,22,12],"deg":8,"b":"2014-04-19，風停了，連狗都顯得不習慣。33 歲的許思明正在經歷「父親在電話裡糾正她修馬達的方法」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有市場冰塊融水流過鞋底。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":377},{"id":"d256","t":"零錢盒與月底｜思明 FM 的紅燈","d":"2014-05-08","y":2014.3525,"c":"work","s":"33 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見父親在電話裡糾正她修馬達的方法留下的影響。","m":"自嘲","f":"memories/2014-05-08-07-money.md","k":7,"arm":1,"ents":[23,24,2,3,10,68,12],"deg":7,"b":"2014-05-08，空氣黏得每張紙都捲邊。33 歲的許思明正在經歷「父親在電話裡糾正她修馬達的方法」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":418},{"id":"d257","t":"颱風來前的四小時｜思明 FM 的紅燈","d":"2014-05-27","y":2014.4046,"c":"coast","s":"33 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見父親在電話裡糾正她修馬達的方法留下的影響。","m":"專注","f":"memories/2014-05-27-08-storm.md","k":8,"arm":0,"ents":[25,26,76,3,10,56,27,12],"deg":8,"b":"2014-05-27，落山風把招牌吹得咯咯響。33 歲的許思明正在經歷「父親在電話裡糾正她修馬達的方法」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":398},{"id":"d258","t":"一鍋太酸的湯｜思明 FM 的紅燈","d":"2014-06-15","y":2014.455,"c":"kin","s":"33 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見父親在電話裡糾正她修馬達的方法留下的影響。","m":"柔軟","f":"memories/2014-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,76,3,10,29,6],"deg":7,"b":"2014-06-15，南方的光白得像鹽。33 歲的許思明正在經歷「父親在電話裡糾正她修馬達的方法」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有鹽粒卡在手腕細小的傷口。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":373},{"id":"d259","t":"風不負責回答｜思明 FM 的紅燈","d":"2014-07-05","y":2014.511,"c":"thought","s":"33 歲的許思明在思明 FM經歷「風不負責回答」，也重新看見父親在電話裡糾正她修馬達的方法留下的影響。","m":"遲疑","f":"memories/2014-07-05-10-radio.md","k":8,"arm":1,"ents":[77,78,2,3,10,56,79,12],"deg":18,"b":"2014-07-05，空氣黏得每張紙都捲邊。33 歲的許思明正在經歷「父親在電話裡糾正她修馬達的方法」。她今天給自己的工作很簡單：打開深夜麥克風，讓來電者講完一個沒有結局的夢，只在必要時問一句當時風從哪邊來。\n\n現場有鐵鏽和九層塔混在一起的氣味。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":369},{"id":"d260","t":"關店後的城牆｜思明 FM 的紅燈","d":"2014-07-24","y":2014.563,"c":"body","s":"33 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見陌生人寄來一卷海上錄音留下的影響。","m":"興奮","f":"memories/2014-07-24-11-walk.md","k":7,"arm":0,"ents":[32,33,76,3,10,34,12],"deg":7,"b":"2014-07-24，南方的光白得像鹽。33 歲的許思明正在經歷「陌生人寄來一卷海上錄音」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":347},{"id":"d261","t":"旅人帶來的破東西｜思明 FM 的紅燈","d":"2014-08-12","y":2014.6135,"c":"travel","s":"33 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見陌生人寄來一卷海上錄音留下的影響。","m":"自嘲","f":"memories/2014-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,76,3,10,56,68,12],"deg":8,"b":"2014-08-12，雲壓得很低，海卻異常平。33 歲的許思明正在經歷「陌生人寄來一卷海上錄音」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有鹽粒卡在手腕細小的傷口。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":382},{"id":"d262","t":"母親說只是順便｜思明 FM 的紅燈","d":"2014-08-31","y":2014.6655,"c":"kin","s":"33 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見陌生人寄來一卷海上錄音留下的影響。","m":"專注","f":"memories/2014-08-31-13-mother.md","k":7,"arm":0,"ents":[36,37,2,3,10,29,6],"deg":7,"b":"2014-08-31，落山風把招牌吹得咯咯響。33 歲的許思明正在經歷「陌生人寄來一卷海上錄音」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":407},{"id":"d263","t":"父親的工具牆｜思明 FM 的紅燈","d":"2014-09-20","y":2014.7187,"c":"kin","s":"33 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見陌生人寄來一卷海上錄音留下的影響。","m":"柔軟","f":"memories/2014-09-20-14-father.md","k":8,"arm":0,"ents":[38,39,76,3,10,56,68,12],"deg":8,"b":"2014-09-20，雲壓得很低，海卻異常平。33 歲的許思明正在經歷「陌生人寄來一卷海上錄音」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得遠處機車聲被風切成斷句。那不是象徵，只是我確實站在那裡。\n\n現場有遠處機車聲被風切成斷句。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":400},{"id":"d264","t":"一個人也有兩份沉默｜思明 FM 的紅燈","d":"2014-10-09","y":2014.7719,"c":"love","s":"33 歲的許思明在萬里桐經歷「一個人也有兩份沉默」，也重新看見陌生人寄來一卷海上錄音留下的影響。","m":"遲疑","f":"memories/2014-10-09-15-love.md","k":7,"arm":0,"ents":[33,41,76,3,10,42,12],"deg":7,"b":"2014-10-09，雲壓得很低，海卻異常平。33 歲的許思明正在經歷「陌生人寄來一卷海上錄音」。她今天給自己的工作很簡單：獨自在萬里桐坐到海面轉暗，不把安靜誤認成缺少誰，而是辨認自己終於願意承認的需要。\n\n現場有鹽粒卡在手腕細小的傷口。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":369},{"id":"d265","t":"紙袋裡的種子｜思明 FM 的紅燈","d":"2014-10-28","y":2014.824,"c":"field","s":"33 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見她第一次覺得孤單也能發射留下的影響。","m":"興奮","f":"memories/2014-10-28-16-seed.md","k":8,"arm":1,"ents":[43,44,2,3,10,56,68,12],"deg":8,"b":"2014-10-28，風停了，連狗都顯得不習慣。33 歲的許思明正在經歷「她第一次覺得孤單也能發射」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有曬熱木板摸起來微微發黏。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":358},{"id":"d266","t":"昨夜夢見店長出鰓｜思明 FM 的紅燈","d":"2014-11-16","y":2014.8744,"c":"thought","s":"33 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見她第一次覺得孤單也能發射留下的影響。","m":"自嘲","f":"memories/2014-11-16-17-dream.md","k":7,"arm":1,"ents":[45,46,76,3,10,47,6],"deg":7,"b":"2014-11-16，南方的光白得像鹽。33 歲的許思明正在經歷「她第一次覺得孤單也能發射」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":350},{"id":"d267","t":"離開半島的一天｜思明 FM 的紅燈","d":"2014-12-05","y":2014.9276,"c":"travel","s":"33 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見她第一次覺得孤單也能發射留下的影響。","m":"專注","f":"memories/2014-12-05-18-trip.md","k":8,"arm":1,"ents":[48,49,76,3,10,56,50,12],"deg":8,"b":"2014-12-05，空氣黏得每張紙都捲邊。33 歲的許思明正在經歷「她第一次覺得孤單也能發射」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有曬熱木板摸起來微微發黏。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":382},{"id":"d268","t":"無法分類的下午｜思明 FM 的紅燈","d":"2014-12-25","y":2014.9824,"c":"thought","s":"33 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見她第一次覺得孤單也能發射留下的影響。","m":"柔軟","f":"memories/2014-12-25-19-odd.md","k":7,"arm":1,"ents":[51,52,2,3,10,68,12],"deg":7,"b":"2014-12-25，空氣黏得每張紙都捲邊。33 歲的許思明正在經歷「她第一次覺得孤單也能發射」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。和阿芒架起一台低功率網路電台，每週三深夜播市場訪談、修理聲與聽眾打來的怪夢，節目叫《風不負責回答》。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":429},{"id":"d269","t":"今天的風不肯直走｜鹽叔的雲圖","d":"2015-01-13","y":2015.0329,"c":"coast","s":"34 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見逐張攤開受潮的雲圖留下的影響。","m":"鄭重","f":"memories/2015-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,60,5,6],"deg":7,"b":"2015-01-13，落山風把招牌吹得咯咯響。34 歲的許思明正在經歷「逐張攤開受潮的雲圖」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":409},{"id":"d270","t":"市場開門以前｜鹽叔的雲圖","d":"2015-02-01","y":2015.0833,"c":"home","s":"34 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見逐張攤開受潮的雲圖留下的影響。","m":"自嘲","f":"memories/2015-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,80,3,60,56,11,12],"deg":8,"b":"2015-02-01，雲壓得很低，海卻異常平。34 歲的許思明正在經歷「逐張攤開受潮的雲圖」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":398},{"id":"d271","t":"維修單上的壞脾氣｜鹽叔的雲圖","d":"2015-02-20","y":2015.1354,"c":"craft","s":"34 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見逐張攤開受潮的雲圖留下的影響。","m":"專注","f":"memories/2015-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,80,3,60,68,12],"deg":7,"b":"2015-02-20，午後雷雨把街面洗成深灰。34 歲的許思明正在經歷「逐張攤開受潮的雲圖」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有鹽粒卡在手腕細小的傷口。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":380},{"id":"d272","t":"十九的巡邏路線｜鹽叔的雲圖","d":"2015-03-11","y":2015.1941,"c":"home","s":"34 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見逐張攤開受潮的雲圖留下的影響。","m":"柔軟","f":"memories/2015-03-11-04-dog.md","k":8,"arm":0,"ents":[65,66,2,3,60,56,17,12],"deg":13,"b":"2015-03-11，南方的光白得像鹽。34 歲的許思明正在經歷「逐張攤開受潮的雲圖」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有市場冰塊融水流過鞋底。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":365},{"id":"d273","t":"給遠方的一封慢信｜鹽叔的雲圖","d":"2015-03-31","y":2015.2489,"c":"love","s":"34 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見逐張攤開受潮的雲圖留下的影響。","m":"遲疑","f":"memories/2015-03-31-05-letter.md","k":5,"arm":0,"ents":[18,19,80,3,60,68,6],"deg":7,"b":"2015-03-31，落山風把招牌吹得咯咯響。34 歲的許思明正在經歷「逐張攤開受潮的雲圖」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有鹽粒卡在手腕細小的傷口。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":347},{"id":"d274","t":"樣方偏了七公分｜鹽叔的雲圖","d":"2015-04-19","y":2015.2993,"c":"field","s":"34 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見帶學生走讀港口溪留下的影響。","m":"鄭重","f":"memories/2015-04-19-06-field.md","k":8,"arm":1,"ents":[20,21,80,3,60,56,22,12],"deg":8,"b":"2015-04-19，午後雷雨把街面洗成深灰。34 歲的許思明正在經歷「帶學生走讀港口溪」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有鐵鏽和九層塔混在一起的氣味。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":364},{"id":"d275","t":"零錢盒與月底｜鹽叔的雲圖","d":"2015-05-08","y":2015.3525,"c":"work","s":"34 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見帶學生走讀港口溪留下的影響。","m":"自嘲","f":"memories/2015-05-08-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,60,68,12],"deg":7,"b":"2015-05-08，空氣黏得每張紙都捲邊。34 歲的許思明正在經歷「帶學生走讀港口溪」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":420},{"id":"d276","t":"颱風來前的四小時｜鹽叔的雲圖","d":"2015-05-27","y":2015.4046,"c":"coast","s":"34 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見帶學生走讀港口溪留下的影響。","m":"專注","f":"memories/2015-05-27-08-storm.md","k":8,"arm":0,"ents":[25,26,80,3,60,56,27,12],"deg":8,"b":"2015-05-27，空氣黏得每張紙都捲邊。34 歲的許思明正在經歷「帶學生走讀港口溪」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得遠處機車聲被風切成斷句。那不是象徵，只是我確實站在那裡。\n\n現場有遠處機車聲被風切成斷句。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":386},{"id":"d277","t":"一鍋太酸的湯｜鹽叔的雲圖","d":"2015-06-15","y":2015.455,"c":"kin","s":"34 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見帶學生走讀港口溪留下的影響。","m":"柔軟","f":"memories/2015-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,80,3,60,29,6],"deg":7,"b":"2015-06-15，風停了，連狗都顯得不習慣。34 歲的許思明正在經歷「帶學生走讀港口溪」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有遠處機車聲被風切成斷句。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":369},{"id":"d278","t":"風不負責回答｜鹽叔的雲圖","d":"2015-07-05","y":2015.511,"c":"thought","s":"34 歲的許思明在思明 FM經歷「風不負責回答」，也重新看見帶學生走讀港口溪留下的影響。","m":"遲疑","f":"memories/2015-07-05-10-radio.md","k":8,"arm":1,"ents":[77,78,2,3,60,56,79,12],"deg":16,"b":"2015-07-05，雲壓得很低，海卻異常平。34 歲的許思明正在經歷「帶學生走讀港口溪」。她今天給自己的工作很簡單：打開深夜麥克風，讓來電者講完一個沒有結局的夢，只在必要時問一句當時風從哪邊來。\n\n現場有市場冰塊融水流過鞋底。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":351},{"id":"d279","t":"關店後的城牆｜鹽叔的雲圖","d":"2015-07-24","y":2015.563,"c":"body","s":"34 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見父親開始忘記剛說過的話留下的影響。","m":"鄭重","f":"memories/2015-07-24-11-walk.md","k":0,"arm":0,"ents":[32,33,80,3,60,34,12],"deg":7,"b":"2015-07-24，雲壓得很低，海卻異常平。34 歲的許思明正在經歷「父親開始忘記剛說過的話」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":350},{"id":"d280","t":"旅人帶來的破東西｜鹽叔的雲圖","d":"2015-08-12","y":2015.6135,"c":"travel","s":"34 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見父親開始忘記剛說過的話留下的影響。","m":"自嘲","f":"memories/2015-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,80,3,60,56,68,12],"deg":8,"b":"2015-08-12，落山風把招牌吹得咯咯響。34 歲的許思明正在經歷「父親開始忘記剛說過的話」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有紙張受潮後像剛醒來的皮膚。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":367},{"id":"d281","t":"母親說只是順便｜鹽叔的雲圖","d":"2015-08-31","y":2015.6655,"c":"kin","s":"34 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見父親開始忘記剛說過的話留下的影響。","m":"專注","f":"memories/2015-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,60,29,6],"deg":7,"b":"2015-08-31，南方的光白得像鹽。34 歲的許思明正在經歷「父親開始忘記剛說過的話」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":405},{"id":"d282","t":"父親的工具牆｜鹽叔的雲圖","d":"2015-09-20","y":2015.7187,"c":"kin","s":"34 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見父親開始忘記剛說過的話留下的影響。","m":"柔軟","f":"memories/2015-09-20-14-father.md","k":8,"arm":0,"ents":[38,39,80,3,60,56,68,12],"deg":8,"b":"2015-09-20，風停了，連狗都顯得不習慣。34 歲的許思明正在經歷「父親開始忘記剛說過的話」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":394},{"id":"d283","t":"一個人也有兩份沉默｜鹽叔的雲圖","d":"2015-10-09","y":2015.7719,"c":"love","s":"34 歲的許思明在萬里桐經歷「一個人也有兩份沉默」，也重新看見父親開始忘記剛說過的話留下的影響。","m":"遲疑","f":"memories/2015-10-09-15-love.md","k":0,"arm":0,"ents":[33,41,80,3,60,42,12],"deg":7,"b":"2015-10-09，空氣黏得每張紙都捲邊。34 歲的許思明正在經歷「父親開始忘記剛說過的話」。她今天給自己的工作很簡單：獨自在萬里桐坐到海面轉暗，不把安靜誤認成缺少誰，而是辨認自己終於願意承認的需要。\n\n現場有鹽粒卡在手腕細小的傷口。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":378},{"id":"d284","t":"紙袋裡的種子｜鹽叔的雲圖","d":"2015-10-28","y":2015.824,"c":"field","s":"34 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見她把天氣和記憶放在同一套索引裡留下的影響。","m":"鄭重","f":"memories/2015-10-28-16-seed.md","k":8,"arm":1,"ents":[43,44,2,3,60,56,68,12],"deg":8,"b":"2015-10-28，風停了，連狗都顯得不習慣。34 歲的許思明正在經歷「她把天氣和記憶放在同一套索引裡」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有鹽粒卡在手腕細小的傷口。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":361},{"id":"d285","t":"昨夜夢見店長出鰓｜鹽叔的雲圖","d":"2015-11-16","y":2015.8744,"c":"thought","s":"34 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見她把天氣和記憶放在同一套索引裡留下的影響。","m":"自嘲","f":"memories/2015-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,80,3,60,47,6],"deg":7,"b":"2015-11-16，午後雷雨把街面洗成深灰。34 歲的許思明正在經歷「她把天氣和記憶放在同一套索引裡」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":346},{"id":"d286","t":"離開半島的一天｜鹽叔的雲圖","d":"2015-12-05","y":2015.9276,"c":"travel","s":"34 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見她把天氣和記憶放在同一套索引裡留下的影響。","m":"專注","f":"memories/2015-12-05-18-trip.md","k":8,"arm":1,"ents":[48,49,80,3,60,56,50,12],"deg":8,"b":"2015-12-05，雲壓得很低，海卻異常平。34 歲的許思明正在經歷「她把天氣和記憶放在同一套索引裡」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有市場冰塊融水流過鞋底。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":375},{"id":"d287","t":"無法分類的下午｜鹽叔的雲圖","d":"2015-12-25","y":2015.9824,"c":"thought","s":"34 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見她把天氣和記憶放在同一套索引裡留下的影響。","m":"柔軟","f":"memories/2015-12-25-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,60,68,12],"deg":7,"b":"2015-12-25，空氣黏得每張紙都捲邊。34 歲的許思明正在經歷「她把天氣和記憶放在同一套索引裡」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。鹽叔把四十年手畫的雲圖交給她保管。思明開始整理半島的民間氣象詞，發現知識常躲在一句看似迷信的提醒裡。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":422},{"id":"d288","t":"今天的風不肯直走｜十九嘴裡的藍絲帶","d":"2016-01-13","y":2016.0329,"c":"coast","s":"35 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見沿著舊城牆找狗留下的影響。","m":"後怕","f":"memories/2016-01-13-01-wind.md","k":6,"arm":0,"ents":[0,1,2,3,62,5,6],"deg":9,"b":"2016-01-13，南方的光白得像鹽。35 歲的許思明正在經歷「沿著舊城牆找狗」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":393},{"id":"d289","t":"市場開門以前｜十九嘴裡的藍絲帶","d":"2016-02-01","y":2016.0833,"c":"home","s":"35 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見沿著舊城牆找狗留下的影響。","m":"自嘲","f":"memories/2016-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,81,3,62,10,11,12],"deg":10,"b":"2016-02-01，南方的光白得像鹽。35 歲的許思明正在經歷「沿著舊城牆找狗」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":391},{"id":"d290","t":"維修單上的壞脾氣｜十九嘴裡的藍絲帶","d":"2016-02-20","y":2016.1354,"c":"craft","s":"35 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見沿著舊城牆找狗留下的影響。","m":"專注","f":"memories/2016-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,81,3,62,68,12],"deg":7,"b":"2016-02-20，風停了，連狗都顯得不習慣。35 歲的許思明正在經歷「沿著舊城牆找狗」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有曬熱木板摸起來微微發黏。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":374},{"id":"d291","t":"十九的巡邏路線｜十九嘴裡的藍絲帶","d":"2016-03-11","y":2016.1941,"c":"home","s":"35 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見沿著舊城牆找狗留下的影響。","m":"柔軟","f":"memories/2016-03-11-04-dog.md","k":7,"arm":0,"ents":[65,66,2,3,62,10,17,12],"deg":16,"b":"2016-03-11，落山風把招牌吹得咯咯響。35 歲的許思明正在經歷「沿著舊城牆找狗」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有遠處機車聲被風切成斷句。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":359},{"id":"d292","t":"給遠方的一封慢信｜十九嘴裡的藍絲帶","d":"2016-03-30","y":2016.2461,"c":"love","s":"35 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見沿著舊城牆找狗留下的影響。","m":"遲疑","f":"memories/2016-03-30-05-letter.md","k":6,"arm":0,"ents":[18,19,81,3,62,68,6],"deg":7,"b":"2016-03-30，空氣黏得每張紙都捲邊。35 歲的許思明正在經歷「沿著舊城牆找狗」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":350},{"id":"d293","t":"樣方偏了七公分｜十九嘴裡的藍絲帶","d":"2016-04-18","y":2016.2966,"c":"field","s":"35 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見第一次承認自己害怕失去留下的影響。","m":"後怕","f":"memories/2016-04-18-06-field.md","k":7,"arm":1,"ents":[20,21,81,3,62,10,22,12],"deg":9,"b":"2016-04-18，落山風把招牌吹得咯咯響。35 歲的許思明正在經歷「第一次承認自己害怕失去」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有紙張受潮後像剛醒來的皮膚。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":358},{"id":"d294","t":"零錢盒與月底｜十九嘴裡的藍絲帶","d":"2016-05-07","y":2016.3498,"c":"work","s":"35 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見第一次承認自己害怕失去留下的影響。","m":"自嘲","f":"memories/2016-05-07-07-money.md","k":6,"arm":1,"ents":[23,24,2,3,62,68,12],"deg":7,"b":"2016-05-07，雲壓得很低，海卻異常平。35 歲的許思明正在經歷「第一次承認自己害怕失去」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":421},{"id":"d295","t":"颱風來前的四小時｜十九嘴裡的藍絲帶","d":"2016-05-27","y":2016.4046,"c":"coast","s":"35 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見第一次承認自己害怕失去留下的影響。","m":"專注","f":"memories/2016-05-27-08-storm.md","k":7,"arm":0,"ents":[25,26,81,3,62,10,27,12],"deg":10,"b":"2016-05-27，空氣黏得每張紙都捲邊。35 歲的許思明正在經歷「第一次承認自己害怕失去」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":396},{"id":"d296","t":"一鍋太酸的湯｜十九嘴裡的藍絲帶","d":"2016-06-15","y":2016.455,"c":"kin","s":"35 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見第一次承認自己害怕失去留下的影響。","m":"柔軟","f":"memories/2016-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,81,3,62,29,6],"deg":7,"b":"2016-06-15，空氣黏得每張紙都捲邊。35 歲的許思明正在經歷「第一次承認自己害怕失去」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有紙張受潮後像剛醒來的皮膚。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":377},{"id":"d297","t":"風不負責回答｜十九嘴裡的藍絲帶","d":"2016-07-04","y":2016.5082,"c":"thought","s":"35 歲的許思明在思明 FM經歷「風不負責回答」，也重新看見第一次承認自己害怕失去留下的影響。","m":"遲疑","f":"memories/2016-07-04-10-radio.md","k":7,"arm":1,"ents":[77,78,2,3,62,10,79,12],"deg":16,"b":"2016-07-04，落山風把招牌吹得咯咯響。35 歲的許思明正在經歷「第一次承認自己害怕失去」。她今天給自己的工作很簡單：打開深夜麥克風，讓來電者講完一個沒有結局的夢，只在必要時問一句當時風從哪邊來。\n\n現場有鹽粒卡在手腕細小的傷口。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":352},{"id":"d298","t":"關店後的城牆｜十九嘴裡的藍絲帶","d":"2016-07-23","y":2016.5603,"c":"body","s":"35 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見把尋狗啟事全數撕下留下的影響。","m":"後怕","f":"memories/2016-07-23-11-walk.md","k":6,"arm":0,"ents":[32,33,81,3,62,34,12],"deg":7,"b":"2016-07-23，落山風把招牌吹得咯咯響。35 歲的許思明正在經歷「把尋狗啟事全數撕下」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有紙張受潮後像剛醒來的皮膚。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":337},{"id":"d299","t":"旅人帶來的破東西｜十九嘴裡的藍絲帶","d":"2016-08-12","y":2016.6135,"c":"travel","s":"35 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見把尋狗啟事全數撕下留下的影響。","m":"自嘲","f":"memories/2016-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,81,3,62,10,68,12],"deg":8,"b":"2016-08-12，南方的光白得像鹽。35 歲的許思明正在經歷「把尋狗啟事全數撕下」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有曬熱木板摸起來微微發黏。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":363},{"id":"d300","t":"母親說只是順便｜十九嘴裡的藍絲帶","d":"2016-08-31","y":2016.6655,"c":"kin","s":"35 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見把尋狗啟事全數撕下留下的影響。","m":"專注","f":"memories/2016-08-31-13-mother.md","k":6,"arm":0,"ents":[36,37,2,3,62,29,6],"deg":7,"b":"2016-08-31，午後雷雨把街面洗成深灰。35 歲的許思明正在經歷「把尋狗啟事全數撕下」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":399},{"id":"d301","t":"父親的工具牆｜十九嘴裡的藍絲帶","d":"2016-09-19","y":2016.716,"c":"kin","s":"35 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見把尋狗啟事全數撕下留下的影響。","m":"柔軟","f":"memories/2016-09-19-14-father.md","k":7,"arm":0,"ents":[38,39,81,3,62,10,68,12],"deg":8,"b":"2016-09-19，南方的光白得像鹽。35 歲的許思明正在經歷「把尋狗啟事全數撕下」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":393},{"id":"d302","t":"一個人也有兩份沉默｜十九嘴裡的藍絲帶","d":"2016-10-09","y":2016.7719,"c":"love","s":"35 歲的許思明在萬里桐經歷「一個人也有兩份沉默」，也重新看見把尋狗啟事全數撕下留下的影響。","m":"遲疑","f":"memories/2016-10-09-15-love.md","k":6,"arm":0,"ents":[33,41,81,3,62,42,12],"deg":7,"b":"2016-10-09，南方的光白得像鹽。35 歲的許思明正在經歷「把尋狗啟事全數撕下」。她今天給自己的工作很簡單：獨自在萬里桐坐到海面轉暗，不把安靜誤認成缺少誰，而是辨認自己終於願意承認的需要。\n\n現場有紙張受潮後像剛醒來的皮膚。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":361},{"id":"d303","t":"紙袋裡的種子｜十九嘴裡的藍絲帶","d":"2016-10-28","y":2016.824,"c":"field","s":"35 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見為十九做一張更低的睡台留下的影響。","m":"後怕","f":"memories/2016-10-28-16-seed.md","k":7,"arm":1,"ents":[43,44,2,3,62,10,68,12],"deg":8,"b":"2016-10-28，空氣黏得每張紙都捲邊。35 歲的許思明正在經歷「為十九做一張更低的睡台」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有鐵鏽和九層塔混在一起的氣味。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":362},{"id":"d304","t":"昨夜夢見店長出鰓｜十九嘴裡的藍絲帶","d":"2016-11-16","y":2016.8744,"c":"thought","s":"35 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見為十九做一張更低的睡台留下的影響。","m":"自嘲","f":"memories/2016-11-16-17-dream.md","k":6,"arm":1,"ents":[45,46,81,3,62,47,6],"deg":7,"b":"2016-11-16，空氣黏得每張紙都捲邊。35 歲的許思明正在經歷「為十九做一張更低的睡台」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":341},{"id":"d305","t":"離開半島的一天｜十九嘴裡的藍絲帶","d":"2016-12-05","y":2016.9276,"c":"travel","s":"35 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見為十九做一張更低的睡台留下的影響。","m":"專注","f":"memories/2016-12-05-18-trip.md","k":7,"arm":1,"ents":[48,49,81,3,62,10,50,12],"deg":10,"b":"2016-12-05，風停了，連狗都顯得不習慣。35 歲的許思明正在經歷「為十九做一張更低的睡台」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有遠處機車聲被風切成斷句。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":376},{"id":"d306","t":"無法分類的下午｜十九嘴裡的藍絲帶","d":"2016-12-25","y":2016.9824,"c":"thought","s":"35 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見為十九做一張更低的睡台留下的影響。","m":"柔軟","f":"memories/2016-12-25-19-odd.md","k":6,"arm":1,"ents":[51,52,2,3,62,68,12],"deg":7,"b":"2016-12-25，南方的光白得像鹽。35 歲的許思明正在經歷「為十九做一張更低的睡台」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。十九在雷雨夜失蹤八天，回來時嘴裡咬著一截藍絲帶。思明沒有追查它去了哪裡，只在門邊放了第九天的水。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":417},{"id":"d307","t":"今天的風不肯直走｜港口溪的透明樣方","d":"2017-01-13","y":2017.0329,"c":"coast","s":"36 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見第一次和青禾做港口溪調查留下的影響。","m":"戒備","f":"memories/2017-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,82,5,6],"deg":7,"b":"2017-01-13，南方的光白得像鹽。36 歲的許思明正在經歷「第一次和青禾做港口溪調查」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":406},{"id":"d308","t":"市場開門以前｜港口溪的透明樣方","d":"2017-02-01","y":2017.0833,"c":"home","s":"36 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見第一次和青禾做港口溪調查留下的影響。","m":"自嘲","f":"memories/2017-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,83,3,82,62,11,12],"deg":8,"b":"2017-02-01，雲壓得很低，海卻異常平。36 歲的許思明正在經歷「第一次和青禾做港口溪調查」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":395},{"id":"d309","t":"維修單上的壞脾氣｜港口溪的透明樣方","d":"2017-02-20","y":2017.1354,"c":"craft","s":"36 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見第一次和青禾做港口溪調查留下的影響。","m":"專注","f":"memories/2017-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,83,3,82,68,12],"deg":7,"b":"2017-02-20，午後雷雨把街面洗成深灰。36 歲的許思明正在經歷「第一次和青禾做港口溪調查」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有遠處機車聲被風切成斷句。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":373},{"id":"d310","t":"十九的巡邏路線｜港口溪的透明樣方","d":"2017-03-11","y":2017.1941,"c":"home","s":"36 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見第一次和青禾做港口溪調查留下的影響。","m":"柔軟","f":"memories/2017-03-11-04-dog.md","k":6,"arm":0,"ents":[65,66,2,3,82,62,17,12],"deg":11,"b":"2017-03-11，南方的光白得像鹽。36 歲的許思明正在經歷「第一次和青禾做港口溪調查」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有鹽粒卡在手腕細小的傷口。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":366},{"id":"d311","t":"給遠方的一封慢信｜港口溪的透明樣方","d":"2017-03-31","y":2017.2489,"c":"love","s":"36 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見第一次和青禾做港口溪調查留下的影響。","m":"遲疑","f":"memories/2017-03-31-05-letter.md","k":5,"arm":0,"ents":[18,19,83,3,82,68,6],"deg":7,"b":"2017-03-31，雲壓得很低，海卻異常平。36 歲的許思明正在經歷「第一次和青禾做港口溪調查」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":344},{"id":"d312","t":"樣方偏了七公分｜港口溪的透明樣方","d":"2017-04-19","y":2017.2993,"c":"field","s":"36 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見思明嫌她把植物講得太像公文留下的影響。","m":"戒備","f":"memories/2017-04-19-06-field.md","k":6,"arm":1,"ents":[20,21,83,3,82,62,22,12],"deg":9,"b":"2017-04-19，空氣黏得每張紙都捲邊。36 歲的許思明正在經歷「思明嫌她把植物講得太像公文」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有遠處機車聲被風切成斷句。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":353},{"id":"d313","t":"零錢盒與月底｜港口溪的透明樣方","d":"2017-05-08","y":2017.3525,"c":"work","s":"36 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見思明嫌她把植物講得太像公文留下的影響。","m":"自嘲","f":"memories/2017-05-08-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,82,68,12],"deg":7,"b":"2017-05-08，南方的光白得像鹽。36 歲的許思明正在經歷「思明嫌她把植物講得太像公文」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":410},{"id":"d314","t":"颱風來前的四小時｜港口溪的透明樣方","d":"2017-05-27","y":2017.4046,"c":"coast","s":"36 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見思明嫌她把植物講得太像公文留下的影響。","m":"專注","f":"memories/2017-05-27-08-storm.md","k":6,"arm":0,"ents":[25,26,83,3,82,62,27,12],"deg":9,"b":"2017-05-27，風停了，連狗都顯得不習慣。36 歲的許思明正在經歷「思明嫌她把植物講得太像公文」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":388},{"id":"d315","t":"一鍋太酸的湯｜港口溪的透明樣方","d":"2017-06-15","y":2017.455,"c":"kin","s":"36 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見思明嫌她把植物講得太像公文留下的影響。","m":"柔軟","f":"memories/2017-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,83,3,82,29,6],"deg":7,"b":"2017-06-15，風停了，連狗都顯得不習慣。36 歲的許思明正在經歷「思明嫌她把植物講得太像公文」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有遠處機車聲被風切成斷句。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":373},{"id":"d316","t":"風不負責回答｜港口溪的透明樣方","d":"2017-07-05","y":2017.511,"c":"thought","s":"36 歲的許思明在思明 FM經歷「風不負責回答」，也重新看見思明嫌她把植物講得太像公文留下的影響。","m":"遲疑","f":"memories/2017-07-05-10-radio.md","k":6,"arm":1,"ents":[77,78,2,3,82,62,79,12],"deg":15,"b":"2017-07-05，南方的光白得像鹽。36 歲的許思明正在經歷「思明嫌她把植物講得太像公文」。她今天給自己的工作很簡單：打開深夜麥克風，讓來電者講完一個沒有結局的夢，只在必要時問一句當時風從哪邊來。\n\n現場有曬熱木板摸起來微微發黏。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":362},{"id":"d317","t":"關店後的城牆｜港口溪的透明樣方","d":"2017-07-24","y":2017.563,"c":"body","s":"36 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見青禾替十九修好輪椅留下的影響。","m":"戒備","f":"memories/2017-07-24-11-walk.md","k":3,"arm":0,"ents":[32,33,83,3,82,34,12],"deg":7,"b":"2017-07-24，落山風把招牌吹得咯咯響。36 歲的許思明正在經歷「青禾替十九修好輪椅」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":337},{"id":"d318","t":"旅人帶來的破東西｜港口溪的透明樣方","d":"2017-08-12","y":2017.6135,"c":"travel","s":"36 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見青禾替十九修好輪椅留下的影響。","m":"自嘲","f":"memories/2017-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,83,3,82,62,68,12],"deg":8,"b":"2017-08-12，雲壓得很低，海卻異常平。36 歲的許思明正在經歷「青禾替十九修好輪椅」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有鹽粒卡在手腕細小的傷口。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":365},{"id":"d319","t":"母親說只是順便｜港口溪的透明樣方","d":"2017-08-31","y":2017.6655,"c":"kin","s":"36 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見青禾替十九修好輪椅留下的影響。","m":"專注","f":"memories/2017-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,82,29,6],"deg":7,"b":"2017-08-31，午後雷雨把街面洗成深灰。36 歲的許思明正在經歷「青禾替十九修好輪椅」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":410},{"id":"d320","t":"父親的工具牆｜港口溪的透明樣方","d":"2017-09-20","y":2017.7187,"c":"kin","s":"36 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見青禾替十九修好輪椅留下的影響。","m":"柔軟","f":"memories/2017-09-20-14-father.md","k":6,"arm":0,"ents":[38,39,83,3,82,62,68,12],"deg":8,"b":"2017-09-20，雲壓得很低，海卻異常平。36 歲的許思明正在經歷「青禾替十九修好輪椅」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":396},{"id":"d321","t":"兩個人各自沉默｜港口溪的透明樣方","d":"2017-10-09","y":2017.7719,"c":"love","s":"36 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見青禾替十九修好輪椅留下的影響。","m":"遲疑","f":"memories/2017-10-09-15-love.md","k":3,"arm":0,"ents":[18,41,83,3,82,42,12],"deg":7,"b":"2017-10-09，風停了，連狗都顯得不習慣。36 歲的許思明正在經歷「青禾替十九修好輪椅」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有遠處機車聲被風切成斷句。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":371},{"id":"d322","t":"紙袋裡的種子｜港口溪的透明樣方","d":"2017-10-28","y":2017.824,"c":"field","s":"36 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見兩人約定只合作不談感情留下的影響。","m":"戒備","f":"memories/2017-10-28-16-seed.md","k":6,"arm":1,"ents":[43,44,2,3,82,62,68,12],"deg":8,"b":"2017-10-28，南方的光白得像鹽。36 歲的許思明正在經歷「兩人約定只合作不談感情」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有鹽粒卡在手腕細小的傷口。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":356},{"id":"d323","t":"昨夜夢見店長出鰓｜港口溪的透明樣方","d":"2017-11-16","y":2017.8744,"c":"thought","s":"36 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見兩人約定只合作不談感情留下的影響。","m":"自嘲","f":"memories/2017-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,83,3,82,47,6],"deg":7,"b":"2017-11-16，南方的光白得像鹽。36 歲的許思明正在經歷「兩人約定只合作不談感情」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":344},{"id":"d324","t":"離開半島的一天｜港口溪的透明樣方","d":"2017-12-05","y":2017.9276,"c":"travel","s":"36 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見兩人約定只合作不談感情留下的影響。","m":"專注","f":"memories/2017-12-05-18-trip.md","k":6,"arm":1,"ents":[48,49,83,3,82,62,50,12],"deg":9,"b":"2017-12-05，午後雷雨把街面洗成深灰。36 歲的許思明正在經歷「兩人約定只合作不談感情」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有曬熱木板摸起來微微發黏。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":366},{"id":"d325","t":"無法分類的下午｜港口溪的透明樣方","d":"2017-12-25","y":2017.9824,"c":"thought","s":"36 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見兩人約定只合作不談感情留下的影響。","m":"柔軟","f":"memories/2017-12-25-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,82,68,12],"deg":7,"b":"2017-12-25，空氣黏得每張紙都捲邊。36 歲的許思明正在經歷「兩人約定只合作不談感情」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。植物調查員阮青禾來借標本桌，兩人從海濱植物的名字吵到樣方應該擺在哪裡，吵完一起吃了兩碗鴨肉冬粉。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":422},{"id":"d326","t":"今天的風不肯直走｜兩把不同高度的牙刷","d":"2018-01-12","y":2018.0301,"c":"coast","s":"37 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見第一次一起過落山風季留下的影響。","m":"親密","f":"memories/2018-01-12-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,82,5,6],"deg":7,"b":"2018-01-12，風停了，連狗都顯得不習慣。37 歲的許思明正在經歷「第一次一起過落山風季」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":400},{"id":"d327","t":"市場開門以前｜兩把不同高度的牙刷","d":"2018-01-30","y":2018.0795,"c":"home","s":"37 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見第一次一起過落山風季留下的影響。","m":"自嘲","f":"memories/2018-01-30-02-market.md","k":9,"arm":0,"ents":[7,8,84,3,82,58,11,12],"deg":9,"b":"2018-01-30，雲壓得很低，海卻異常平。37 歲的許思明正在經歷「第一次一起過落山風季」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鐵鏽和九層塔混在一起的氣味。那不是象徵，只是我確實站在那裡。\n\n現場有鐵鏽和九層塔混在一起的氣味。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":409},{"id":"d328","t":"維修單上的壞脾氣｜兩把不同高度的牙刷","d":"2018-02-18","y":2018.1299,"c":"craft","s":"37 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見第一次一起過落山風季留下的影響。","m":"專注","f":"memories/2018-02-18-03-repair.md","k":10,"arm":1,"ents":[13,14,84,3,82,68,12],"deg":7,"b":"2018-02-18，午後雷雨把街面洗成深灰。37 歲的許思明正在經歷「第一次一起過落山風季」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有紙張受潮後像剛醒來的皮膚。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":372},{"id":"d329","t":"十九的巡邏路線｜兩把不同高度的牙刷","d":"2018-03-08","y":2018.1858,"c":"home","s":"37 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見第一次一起過落山風季留下的影響。","m":"柔軟","f":"memories/2018-03-08-04-dog.md","k":3,"arm":0,"ents":[65,66,2,3,82,58,17,12],"deg":11,"b":"2018-03-08，午後雷雨把街面洗成深灰。37 歲的許思明正在經歷「第一次一起過落山風季」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有紙張受潮後像剛醒來的皮膚。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":368},{"id":"d330","t":"給遠方的一封慢信｜兩把不同高度的牙刷","d":"2018-03-26","y":2018.2352,"c":"love","s":"37 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見第一次一起過落山風季留下的影響。","m":"遲疑","f":"memories/2018-03-26-05-letter.md","k":5,"arm":0,"ents":[18,19,84,3,82,68,6],"deg":7,"b":"2018-03-26，風停了，連狗都顯得不習慣。37 歲的許思明正在經歷「第一次一起過落山風季」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":354},{"id":"d331","t":"樣方偏了七公分｜兩把不同高度的牙刷","d":"2018-04-13","y":2018.2829,"c":"field","s":"37 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見為是否公開關係爭執留下的影響。","m":"親密","f":"memories/2018-04-13-06-field.md","k":3,"arm":1,"ents":[20,21,84,3,82,58,22,12],"deg":9,"b":"2018-04-13，風停了，連狗都顯得不習慣。37 歲的許思明正在經歷「為是否公開關係爭執」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有遠處機車聲被風切成斷句。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":373},{"id":"d332","t":"零錢盒與月底｜兩把不同高度的牙刷","d":"2018-05-02","y":2018.3361,"c":"work","s":"37 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見為是否公開關係爭執留下的影響。","m":"自嘲","f":"memories/2018-05-02-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,82,68,12],"deg":7,"b":"2018-05-02，午後雷雨把街面洗成深灰。37 歲的許思明正在經歷「為是否公開關係爭執」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":424},{"id":"d333","t":"颱風來前的四小時｜兩把不同高度的牙刷","d":"2018-05-20","y":2018.3854,"c":"coast","s":"37 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見為是否公開關係爭執留下的影響。","m":"專注","f":"memories/2018-05-20-08-storm.md","k":3,"arm":0,"ents":[25,26,84,3,82,58,27,12],"deg":9,"b":"2018-05-20，午後雷雨把街面洗成深灰。37 歲的許思明正在經歷「為是否公開關係爭執」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":399},{"id":"d334","t":"一鍋太酸的湯｜兩把不同高度的牙刷","d":"2018-06-07","y":2018.4331,"c":"kin","s":"37 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見為是否公開關係爭執留下的影響。","m":"柔軟","f":"memories/2018-06-07-09-meal.md","k":9,"arm":0,"ents":[28,7,84,3,82,29,6],"deg":7,"b":"2018-06-07，空氣黏得每張紙都捲邊。37 歲的許思明正在經歷「為是否公開關係爭執」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有遠處機車聲被風切成斷句。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":373},{"id":"d335","t":"風不負責回答｜兩把不同高度的牙刷","d":"2018-06-25","y":2018.4824,"c":"thought","s":"37 歲的許思明在思明 FM經歷「風不負責回答」，也重新看見為是否公開關係爭執留下的影響。","m":"遲疑","f":"memories/2018-06-25-10-radio.md","k":3,"arm":1,"ents":[77,78,2,3,82,58,79,12],"deg":15,"b":"2018-06-25，雲壓得很低，海卻異常平。37 歲的許思明正在經歷「為是否公開關係爭執」。她今天給自己的工作很簡單：打開深夜麥克風，讓來電者講完一個沒有結局的夢，只在必要時問一句當時風從哪邊來。\n\n現場有遠處機車聲被風切成斷句。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。青禾說：『不知道就寫不知道，田野不會扣妳分。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":365},{"id":"d336","t":"關店後的城牆｜兩把不同高度的牙刷","d":"2018-07-14","y":2018.5356,"c":"body","s":"37 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見母親只問青禾吃不吃辣留下的影響。","m":"親密","f":"memories/2018-07-14-11-walk.md","k":3,"arm":0,"ents":[32,33,84,3,82,34,12],"deg":7,"b":"2018-07-14，空氣黏得每張紙都捲邊。37 歲的許思明正在經歷「母親只問青禾吃不吃辣」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有紙張受潮後像剛醒來的皮膚。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":357},{"id":"d337","t":"旅人帶來的破東西｜兩把不同高度的牙刷","d":"2018-08-01","y":2018.5833,"c":"travel","s":"37 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見母親只問青禾吃不吃辣留下的影響。","m":"自嘲","f":"memories/2018-08-01-12-visitor.md","k":10,"arm":1,"ents":[35,13,84,3,82,58,68,12],"deg":8,"b":"2018-08-01，風停了，連狗都顯得不習慣。37 歲的許思明正在經歷「母親只問青禾吃不吃辣」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有遠處機車聲被風切成斷句。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":371},{"id":"d338","t":"母親說只是順便｜兩把不同高度的牙刷","d":"2018-08-19","y":2018.6326,"c":"kin","s":"37 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見母親只問青禾吃不吃辣留下的影響。","m":"專注","f":"memories/2018-08-19-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,82,29,6],"deg":7,"b":"2018-08-19，雲壓得很低，海卻異常平。37 歲的許思明正在經歷「母親只問青禾吃不吃辣」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":406},{"id":"d339","t":"父親的工具牆｜兩把不同高度的牙刷","d":"2018-09-06","y":2018.6804,"c":"kin","s":"37 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見母親只問青禾吃不吃辣留下的影響。","m":"柔軟","f":"memories/2018-09-06-14-father.md","k":4,"arm":0,"ents":[38,39,84,3,82,58,68,12],"deg":8,"b":"2018-09-06，落山風把招牌吹得咯咯響。37 歲的許思明正在經歷「母親只問青禾吃不吃辣」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":393},{"id":"d340","t":"兩個人各自沉默｜兩把不同高度的牙刷","d":"2018-09-25","y":2018.7324,"c":"love","s":"37 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見母親只問青禾吃不吃辣留下的影響。","m":"遲疑","f":"memories/2018-09-25-15-love.md","k":3,"arm":0,"ents":[18,41,84,3,82,42,12],"deg":7,"b":"2018-09-25，雲壓得很低，海卻異常平。37 歲的許思明正在經歷「母親只問青禾吃不吃辣」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有曬熱木板摸起來微微發黏。所謂只合作維持了九個月。青禾沒有搬進來，卻在標本室放了一把牙刷和一件雨衣，她們保留各自的房間與關門的權利。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":375},{"id":"d341","t":"紙袋裡的種子｜兩把不同高度的牙刷","d":"2018-10-13","y":201
