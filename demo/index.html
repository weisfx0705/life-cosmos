,"y":2005.8744,"c":"thought","s":"24 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見承認自己其實正在回家留下的影響。","m":"自嘲","f":"memories/2005-11-16-17-dream.md","k":6,"arm":1,"ents":[45,46,63,3,62,47,6],"deg":7,"b":"2005-11-16，空氣黏得每張紙都捲邊。24 歲的許思明正在經歷「承認自己其實正在回家」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":342},{"id":"d94","t":"離開半島的一天｜十九號紅色項圈","d":"2005-12-05","y":2005.9276,"c":"travel","s":"24 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見承認自己其實正在回家留下的影響。","m":"專注","f":"memories/2005-12-05-18-trip.md","k":7,"arm":1,"ents":[48,49,63,3,62,10,50,12],"deg":10,"b":"2005-12-05，南方的光白得像鹽。24 歲的許思明正在經歷「承認自己其實正在回家」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有遠處機車聲被風切成斷句。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":371},{"id":"d95","t":"無法分類的下午｜十九號紅色項圈","d":"2005-12-25","y":2005.9824,"c":"thought","s":"24 歲的許思明在環島路上的雨棚經歷「無法分類的下午」，也重新看見承認自己其實正在回家留下的影響。","m":"柔軟","f":"memories/2005-12-25-19-odd.md","k":6,"arm":1,"ents":[51,52,2,3,62,64,12],"deg":7,"b":"2005-12-25，落山風把招牌吹得咯咯響。24 歲的許思明正在經歷「承認自己其實正在回家」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。辭職後騎舊機車繞島，在東岸雨棚下撿到一隻三腳黑狗，因為那天是十九日，便替牠取名十九。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":415},{"id":"d96","t":"今天的風不肯直走｜綠色鐵捲門","d":"2006-01-12","y":2006.0301,"c":"coast","s":"25 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見刷掉店裡二十年的油煙留下的影響。","m":"踏實","f":"memories/2006-01-12-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,4,5,6],"deg":7,"b":"2006-01-12，空氣黏得每張紙都捲邊。25 歲的許思明正在經歷「刷掉店裡二十年的油煙」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":397},{"id":"d97","t":"市場開門以前｜綠色鐵捲門","d":"2006-01-30","y":2006.0795,"c":"home","s":"25 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見刷掉店裡二十年的油煙留下的影響。","m":"自嘲","f":"memories/2006-01-30-02-market.md","k":9,"arm":0,"ents":[7,8,67,3,4,56,11,12],"deg":8,"b":"2006-01-30，風停了，連狗都顯得不習慣。25 歲的許思明正在經歷「刷掉店裡二十年的油煙」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":391},{"id":"d98","t":"維修單上的壞脾氣｜綠色鐵捲門","d":"2006-02-18","y":2006.1299,"c":"craft","s":"25 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見刷掉店裡二十年的油煙留下的影響。","m":"專注","f":"memories/2006-02-18-03-repair.md","k":10,"arm":1,"ents":[13,14,67,3,4,68,12],"deg":7,"b":"2006-02-18，午後雷雨把街面洗成深灰。25 歲的許思明正在經歷「刷掉店裡二十年的油煙」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有市場冰塊融水流過鞋底。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":372},{"id":"d99","t":"十九的巡邏路線｜綠色鐵捲門","d":"2006-03-08","y":2006.1858,"c":"home","s":"25 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見刷掉店裡二十年的油煙留下的影響。","m":"柔軟","f":"memories/2006-03-08-04-dog.md","k":8,"arm":0,"ents":[65,66,2,3,4,56,17,12],"deg":12,"b":"2006-03-08，落山風把招牌吹得咯咯響。25 歲的許思明正在經歷「刷掉店裡二十年的油煙」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有曬熱木板摸起來微微發黏。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":369},{"id":"d100","t":"給遠方的一封慢信｜綠色鐵捲門","d":"2006-03-26","y":2006.2352,"c":"love","s":"25 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見刷掉店裡二十年的油煙留下的影響。","m":"遲疑","f":"memories/2006-03-26-05-letter.md","k":5,"arm":0,"ents":[18,19,67,3,4,68,6],"deg":7,"b":"2006-03-26，空氣黏得每張紙都捲邊。25 歲的許思明正在經歷「刷掉店裡二十年的油煙」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有鹽粒卡在手腕細小的傷口。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":343},{"id":"d101","t":"樣方偏了七公分｜綠色鐵捲門","d":"2006-04-13","y":2006.2829,"c":"field","s":"25 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見父親把工具牆的鑰匙交給她留下的影響。","m":"踏實","f":"memories/2006-04-13-06-field.md","k":8,"arm":1,"ents":[20,21,67,3,4,56,22,12],"deg":9,"b":"2006-04-13，南方的光白得像鹽。25 歲的許思明正在經歷「父親把工具牆的鑰匙交給她」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有市場冰塊融水流過鞋底。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":366},{"id":"d102","t":"零錢盒與月底｜綠色鐵捲門","d":"2006-05-02","y":2006.3361,"c":"work","s":"25 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見父親把工具牆的鑰匙交給她留下的影響。","m":"自嘲","f":"memories/2006-05-02-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,4,68,12],"deg":7,"b":"2006-05-02，落山風把招牌吹得咯咯響。25 歲的許思明正在經歷「父親把工具牆的鑰匙交給她」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":428},{"id":"d103","t":"颱風來前的四小時｜綠色鐵捲門","d":"2006-05-20","y":2006.3854,"c":"coast","s":"25 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見父親把工具牆的鑰匙交給她留下的影響。","m":"專注","f":"memories/2006-05-20-08-storm.md","k":8,"arm":0,"ents":[25,26,67,3,4,56,27,12],"deg":9,"b":"2006-05-20，南方的光白得像鹽。25 歲的許思明正在經歷「父親把工具牆的鑰匙交給她」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":390},{"id":"d104","t":"一鍋太酸的湯｜綠色鐵捲門","d":"2006-06-07","y":2006.4331,"c":"kin","s":"25 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見父親把工具牆的鑰匙交給她留下的影響。","m":"柔軟","f":"memories/2006-06-07-09-meal.md","k":9,"arm":0,"ents":[28,7,67,3,4,29,6],"deg":7,"b":"2006-06-07，空氣黏得每張紙都捲邊。25 歲的許思明正在經歷「父親把工具牆的鑰匙交給她」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有鹽粒卡在手腕細小的傷口。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":379},{"id":"d105","t":"把夜聲收進錄音帶｜綠色鐵捲門","d":"2006-06-25","y":2006.4824,"c":"thought","s":"25 歲的許思明在鹹風標本室經歷「把夜聲收進錄音帶」，也重新看見父親把工具牆的鑰匙交給她留下的影響。","m":"遲疑","f":"memories/2006-06-25-10-radio.md","k":8,"arm":1,"ents":[30,31,2,3,4,56,68,12],"deg":8,"b":"2006-06-25，空氣黏得每張紙都捲邊。25 歲的許思明正在經歷「父親把工具牆的鑰匙交給她」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有鹽粒卡在手腕細小的傷口。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":354},{"id":"d106","t":"關店後的城牆｜綠色鐵捲門","d":"2006-07-14","y":2006.5356,"c":"body","s":"25 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見第一位客人拿來壞掉的收音機留下的影響。","m":"踏實","f":"memories/2006-07-14-11-walk.md","k":1,"arm":0,"ents":[32,33,67,3,4,34,12],"deg":7,"b":"2006-07-14，午後雷雨把街面洗成深灰。25 歲的許思明正在經歷「第一位客人拿來壞掉的收音機」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":352},{"id":"d107","t":"旅人帶來的破東西｜綠色鐵捲門","d":"2006-08-01","y":2006.5833,"c":"travel","s":"25 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見第一位客人拿來壞掉的收音機留下的影響。","m":"自嘲","f":"memories/2006-08-01-12-visitor.md","k":10,"arm":1,"ents":[35,13,67,3,4,56,68,12],"deg":8,"b":"2006-08-01，空氣黏得每張紙都捲邊。25 歲的許思明正在經歷「第一位客人拿來壞掉的收音機」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有市場冰塊融水流過鞋底。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":373},{"id":"d108","t":"母親說只是順便｜綠色鐵捲門","d":"2006-08-19","y":2006.6326,"c":"kin","s":"25 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見第一位客人拿來壞掉的收音機留下的影響。","m":"專注","f":"memories/2006-08-19-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,4,29,6],"deg":7,"b":"2006-08-19，落山風把招牌吹得咯咯響。25 歲的許思明正在經歷「第一位客人拿來壞掉的收音機」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":394},{"id":"d109","t":"父親的工具牆｜綠色鐵捲門","d":"2006-09-06","y":2006.6804,"c":"kin","s":"25 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見第一位客人拿來壞掉的收音機留下的影響。","m":"柔軟","f":"memories/2006-09-06-14-father.md","k":8,"arm":0,"ents":[38,39,67,3,4,56,68,12],"deg":8,"b":"2006-09-06，南方的光白得像鹽。25 歲的許思明正在經歷「第一位客人拿來壞掉的收音機」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":389},{"id":"d110","t":"兩個人各自沉默｜綠色鐵捲門","d":"2006-09-25","y":2006.7324,"c":"love","s":"25 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見第一位客人拿來壞掉的收音機留下的影響。","m":"遲疑","f":"memories/2006-09-25-15-love.md","k":1,"arm":0,"ents":[18,41,67,3,4,42,12],"deg":7,"b":"2006-09-25，午後雷雨把街面洗成深灰。25 歲的許思明正在經歷「第一位客人拿來壞掉的收音機」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有市場冰塊融水流過鞋底。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":367},{"id":"d111","t":"紙袋裡的種子｜綠色鐵捲門","d":"2006-10-13","y":2006.7829,"c":"field","s":"25 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見季穗搬進店後的小房間留下的影響。","m":"踏實","f":"memories/2006-10-13-16-seed.md","k":8,"arm":1,"ents":[43,44,2,3,4,56,68,12],"deg":8,"b":"2006-10-13，落山風把招牌吹得咯咯響。25 歲的許思明正在經歷「季穗搬進店後的小房間」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有鐵鏽和九層塔混在一起的氣味。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":362},{"id":"d112","t":"昨夜夢見店長出鰓｜綠色鐵捲門","d":"2006-10-31","y":2006.8322,"c":"thought","s":"25 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見季穗搬進店後的小房間留下的影響。","m":"自嘲","f":"memories/2006-10-31-17-dream.md","k":5,"arm":1,"ents":[45,46,67,3,4,47,6],"deg":7,"b":"2006-10-31，雲壓得很低，海卻異常平。25 歲的許思明正在經歷「季穗搬進店後的小房間」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有鹽粒卡在手腕細小的傷口。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":347},{"id":"d113","t":"離開半島的一天｜綠色鐵捲門","d":"2006-11-18","y":2006.8799,"c":"travel","s":"25 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見季穗搬進店後的小房間留下的影響。","m":"專注","f":"memories/2006-11-18-18-trip.md","k":8,"arm":1,"ents":[48,49,67,3,4,56,50,12],"deg":9,"b":"2006-11-18，南方的光白得像鹽。25 歲的許思明正在經歷「季穗搬進店後的小房間」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有鹽粒卡在手腕細小的傷口。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":370},{"id":"d114","t":"無法分類的下午｜綠色鐵捲門","d":"2006-12-07","y":2006.9331,"c":"thought","s":"25 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見季穗搬進店後的小房間留下的影響。","m":"柔軟","f":"memories/2006-12-07-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,4,68,12],"deg":7,"b":"2006-12-07，午後雷雨把街面洗成深灰。25 歲的許思明正在經歷「季穗搬進店後的小房間」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":422},{"id":"d115","t":"年末不完整清單｜綠色鐵捲門","d":"2006-12-25","y":2006.9824,"c":"thought","s":"25 歲的許思明在鹹風標本室經歷「年末不完整清單」，也重新看見季穗搬進店後的小房間留下的影響。","m":"遲疑","f":"memories/2006-12-25-20-inventory.md","k":8,"arm":1,"ents":[53,54,67,3,4,56,68,12],"deg":9,"b":"2006-12-25，空氣黏得每張紙都捲邊。25 歲的許思明正在經歷「季穗搬進店後的小房間」。她今天給自己的工作很簡單：盤點留下、送走、修好與仍然不明白的東西，故意保留空白，不把一年假裝成已經結案。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。回恆春接下父親閒置的電器行，把一半改成修理所，一半放植物標本，門口掛上歪斜木牌「鹹風標本室」。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":399},{"id":"d116","t":"今天的風不肯直走｜颱風後的白色窗框","d":"2007-01-13","y":2007.0329,"c":"coast","s":"26 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見和鄰居一起釘回屋瓦留下的影響。","m":"警醒","f":"memories/2007-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,4,5,6],"deg":7,"b":"2007-01-13，風停了，連狗都顯得不習慣。26 歲的許思明正在經歷「和鄰居一起釘回屋瓦」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":396},{"id":"d117","t":"市場開門以前｜颱風後的白色窗框","d":"2007-02-01","y":2007.0833,"c":"home","s":"26 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見和鄰居一起釘回屋瓦留下的影響。","m":"自嘲","f":"memories/2007-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,69,3,4,62,11,12],"deg":8,"b":"2007-02-01，午後雷雨把街面洗成深灰。26 歲的許思明正在經歷「和鄰居一起釘回屋瓦」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鐵鏽和九層塔混在一起的氣味。那不是象徵，只是我確實站在那裡。\n\n現場有鐵鏽和九層塔混在一起的氣味。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":399},{"id":"d118","t":"維修單上的壞脾氣｜颱風後的白色窗框","d":"2007-02-20","y":2007.1354,"c":"craft","s":"26 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見和鄰居一起釘回屋瓦留下的影響。","m":"專注","f":"memories/2007-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,69,3,4,68,12],"deg":7,"b":"2007-02-20，空氣黏得每張紙都捲邊。26 歲的許思明正在經歷「和鄰居一起釘回屋瓦」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有市場冰塊融水流過鞋底。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":360},{"id":"d119","t":"十九的巡邏路線｜颱風後的白色窗框","d":"2007-03-11","y":2007.1941,"c":"home","s":"26 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見和鄰居一起釘回屋瓦留下的影響。","m":"柔軟","f":"memories/2007-03-11-04-dog.md","k":6,"arm":0,"ents":[65,66,2,3,4,62,17,12],"deg":13,"b":"2007-03-11，空氣黏得每張紙都捲邊。26 歲的許思明正在經歷「和鄰居一起釘回屋瓦」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有市場冰塊融水流過鞋底。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":365},{"id":"d120","t":"給遠方的一封慢信｜颱風後的白色窗框","d":"2007-03-31","y":2007.2489,"c":"love","s":"26 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見和鄰居一起釘回屋瓦留下的影響。","m":"遲疑","f":"memories/2007-03-31-05-letter.md","k":5,"arm":0,"ents":[18,19,69,3,4,68,6],"deg":7,"b":"2007-03-31，風停了，連狗都顯得不習慣。26 歲的許思明正在經歷「和鄰居一起釘回屋瓦」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有紙張受潮後像剛醒來的皮膚。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":348},{"id":"d121","t":"樣方偏了七公分｜颱風後的白色窗框","d":"2007-04-19","y":2007.2993,"c":"field","s":"26 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見第一次辦免費修理日留下的影響。","m":"警醒","f":"memories/2007-04-19-06-field.md","k":6,"arm":1,"ents":[20,21,69,3,4,62,22,12],"deg":9,"b":"2007-04-19，雲壓得很低，海卻異常平。26 歲的許思明正在經歷「第一次辦免費修理日」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有市場冰塊融水流過鞋底。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":369},{"id":"d122","t":"零錢盒與月底｜颱風後的白色窗框","d":"2007-05-08","y":2007.3525,"c":"work","s":"26 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見第一次辦免費修理日留下的影響。","m":"自嘲","f":"memories/2007-05-08-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,4,68,12],"deg":7,"b":"2007-05-08，空氣黏得每張紙都捲邊。26 歲的許思明正在經歷「第一次辦免費修理日」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":396},{"id":"d123","t":"颱風來前的四小時｜颱風後的白色窗框","d":"2007-05-27","y":2007.4046,"c":"coast","s":"26 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見第一次辦免費修理日留下的影響。","m":"專注","f":"memories/2007-05-27-08-storm.md","k":6,"arm":0,"ents":[25,26,69,3,4,62,27,12],"deg":9,"b":"2007-05-27，風停了，連狗都顯得不習慣。26 歲的許思明正在經歷「第一次辦免費修理日」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鐵鏽和九層塔混在一起的氣味。那不是象徵，只是我確實站在那裡。\n\n現場有鐵鏽和九層塔混在一起的氣味。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":396},{"id":"d124","t":"一鍋太酸的湯｜颱風後的白色窗框","d":"2007-06-15","y":2007.455,"c":"kin","s":"26 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見第一次辦免費修理日留下的影響。","m":"柔軟","f":"memories/2007-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,69,3,4,29,6],"deg":7,"b":"2007-06-15，午後雷雨把街面洗成深灰。26 歲的許思明正在經歷「第一次辦免費修理日」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有紙張受潮後像剛醒來的皮膚。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":364},{"id":"d125","t":"把夜聲收進錄音帶｜颱風後的白色窗框","d":"2007-07-05","y":2007.511,"c":"thought","s":"26 歲的許思明在鹹風標本室經歷「把夜聲收進錄音帶」，也重新看見第一次辦免費修理日留下的影響。","m":"遲疑","f":"memories/2007-07-05-10-radio.md","k":6,"arm":1,"ents":[30,31,2,3,4,62,68,12],"deg":9,"b":"2007-07-05，午後雷雨把街面洗成深灰。26 歲的許思明正在經歷「第一次辦免費修理日」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有紙張受潮後像剛醒來的皮膚。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":352},{"id":"d126","t":"關店後的城牆｜颱風後的白色窗框","d":"2007-07-24","y":2007.563,"c":"body","s":"26 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見十九在積水裡叼回一隻鞋留下的影響。","m":"警醒","f":"memories/2007-07-24-11-walk.md","k":1,"arm":0,"ents":[32,33,69,3,4,34,12],"deg":7,"b":"2007-07-24，風停了，連狗都顯得不習慣。26 歲的許思明正在經歷「十九在積水裡叼回一隻鞋」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":338},{"id":"d127","t":"旅人帶來的破東西｜颱風後的白色窗框","d":"2007-08-12","y":2007.6135,"c":"travel","s":"26 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見十九在積水裡叼回一隻鞋留下的影響。","m":"自嘲","f":"memories/2007-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,69,3,4,62,68,12],"deg":8,"b":"2007-08-12，午後雷雨把街面洗成深灰。26 歲的許思明正在經歷「十九在積水裡叼回一隻鞋」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有曬熱木板摸起來微微發黏。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":373},{"id":"d128","t":"母親說只是順便｜颱風後的白色窗框","d":"2007-08-31","y":2007.6655,"c":"kin","s":"26 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見十九在積水裡叼回一隻鞋留下的影響。","m":"專注","f":"memories/2007-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,4,29,6],"deg":7,"b":"2007-08-31，風停了，連狗都顯得不習慣。26 歲的許思明正在經歷「十九在積水裡叼回一隻鞋」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":405},{"id":"d129","t":"父親的工具牆｜颱風後的白色窗框","d":"2007-09-20","y":2007.7187,"c":"kin","s":"26 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見十九在積水裡叼回一隻鞋留下的影響。","m":"柔軟","f":"memories/2007-09-20-14-father.md","k":6,"arm":0,"ents":[38,39,69,3,4,62,68,12],"deg":8,"b":"2007-09-20，空氣黏得每張紙都捲邊。26 歲的許思明正在經歷「十九在積水裡叼回一隻鞋」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得紙張受潮後像剛醒來的皮膚。那不是象徵，只是我確實站在那裡。\n\n現場有紙張受潮後像剛醒來的皮膚。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":395},{"id":"d130","t":"兩個人各自沉默｜颱風後的白色窗框","d":"2007-10-09","y":2007.7719,"c":"love","s":"26 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見十九在積水裡叼回一隻鞋留下的影響。","m":"遲疑","f":"memories/2007-10-09-15-love.md","k":1,"arm":0,"ents":[18,41,69,3,4,42,12],"deg":7,"b":"2007-10-09，南方的光白得像鹽。26 歲的許思明正在經歷「十九在積水裡叼回一隻鞋」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有鹽粒卡在手腕細小的傷口。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":364},{"id":"d131","t":"紙袋裡的種子｜颱風後的白色窗框","d":"2007-10-28","y":2007.824,"c":"field","s":"26 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見季穗說這間店已經不像店留下的影響。","m":"警醒","f":"memories/2007-10-28-16-seed.md","k":6,"arm":1,"ents":[43,44,2,3,4,62,68,12],"deg":8,"b":"2007-10-28，落山風把招牌吹得咯咯響。26 歲的許思明正在經歷「季穗說這間店已經不像店」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有鐵鏽和九層塔混在一起的氣味。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":355},{"id":"d132","t":"昨夜夢見店長出鰓｜颱風後的白色窗框","d":"2007-11-16","y":2007.8744,"c":"thought","s":"26 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見季穗說這間店已經不像店留下的影響。","m":"自嘲","f":"memories/2007-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,69,3,4,47,6],"deg":7,"b":"2007-11-16，落山風把招牌吹得咯咯響。26 歲的許思明正在經歷「季穗說這間店已經不像店」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有紙張受潮後像剛醒來的皮膚。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":345},{"id":"d133","t":"離開半島的一天｜颱風後的白色窗框","d":"2007-12-05","y":2007.9276,"c":"travel","s":"26 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見季穗說這間店已經不像店留下的影響。","m":"專注","f":"memories/2007-12-05-18-trip.md","k":6,"arm":1,"ents":[48,49,69,3,4,62,50,12],"deg":9,"b":"2007-12-05，空氣黏得每張紙都捲邊。26 歲的許思明正在經歷「季穗說這間店已經不像店」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有紙張受潮後像剛醒來的皮膚。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":355},{"id":"d134","t":"無法分類的下午｜颱風後的白色窗框","d":"2007-12-25","y":2007.9824,"c":"thought","s":"26 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見季穗說這間店已經不像店留下的影響。","m":"柔軟","f":"memories/2007-12-25-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,4,68,12],"deg":7,"b":"2007-12-25，午後雷雨把街面洗成深灰。26 歲的許思明正在經歷「季穗說這間店已經不像店」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。一場颱風掀走後院屋頂，她開始替鄰居畫避風地圖，也學會每次修理前先問物件曾經陪誰度過什麼。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":422},{"id":"d135","t":"今天的風不肯直走｜第一罐海茄苳蜜餞","d":"2008-01-13","y":2008.0329,"c":"coast","s":"27 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見失敗的十二罐蜜餞一起冒泡留下的影響。","m":"忙碌","f":"memories/2008-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,4,5,6],"deg":7,"b":"2008-01-13，風停了，連狗都顯得不習慣。27 歲的許思明正在經歷「失敗的十二罐蜜餞一起冒泡」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":389},{"id":"d136","t":"市場開門以前｜第一罐海茄苳蜜餞","d":"2008-02-01","y":2008.0833,"c":"home","s":"27 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見失敗的十二罐蜜餞一起冒泡留下的影響。","m":"自嘲","f":"memories/2008-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,70,3,4,56,11,12],"deg":8,"b":"2008-02-01，雲壓得很低，海卻異常平。27 歲的許思明正在經歷「失敗的十二罐蜜餞一起冒泡」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":379},{"id":"d137","t":"維修單上的壞脾氣｜第一罐海茄苳蜜餞","d":"2008-02-20","y":2008.1354,"c":"craft","s":"27 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見失敗的十二罐蜜餞一起冒泡留下的影響。","m":"專注","f":"memories/2008-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,70,3,4,68,12],"deg":7,"b":"2008-02-20，午後雷雨把街面洗成深灰。27 歲的許思明正在經歷「失敗的十二罐蜜餞一起冒泡」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有鹽粒卡在手腕細小的傷口。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":372},{"id":"d138","t":"十九的巡邏路線｜第一罐海茄苳蜜餞","d":"2008-03-11","y":2008.1941,"c":"home","s":"27 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見失敗的十二罐蜜餞一起冒泡留下的影響。","m":"柔軟","f":"memories/2008-03-11-04-dog.md","k":8,"arm":0,"ents":[65,66,2,3,4,56,17,12],"deg":12,"b":"2008-03-11，空氣黏得每張紙都捲邊。27 歲的許思明正在經歷「失敗的十二罐蜜餞一起冒泡」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有紙張受潮後像剛醒來的皮膚。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":366},{"id":"d139","t":"給遠方的一封慢信｜第一罐海茄苳蜜餞","d":"2008-03-30","y":2008.2461,"c":"love","s":"27 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見失敗的十二罐蜜餞一起冒泡留下的影響。","m":"遲疑","f":"memories/2008-03-30-05-letter.md","k":5,"arm":0,"ents":[18,19,70,3,4,68,6],"deg":7,"b":"2008-03-30，雲壓得很低，海卻異常平。27 歲的許思明正在經歷「失敗的十二罐蜜餞一起冒泡」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":343},{"id":"d140","t":"樣方偏了七公分｜第一罐海茄苳蜜餞","d":"2008-04-18","y":2008.2966,"c":"field","s":"27 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見季穗替瓶身畫了一隻暴躁海鳥留下的影響。","m":"忙碌","f":"memories/2008-04-18-06-field.md","k":8,"arm":1,"ents":[20,21,70,3,4,56,22,12],"deg":9,"b":"2008-04-18，落山風把招牌吹得咯咯響。27 歲的許思明正在經歷「季穗替瓶身畫了一隻暴躁海鳥」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有鐵鏽和九層塔混在一起的氣味。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":364},{"id":"d141","t":"零錢盒與月底｜第一罐海茄苳蜜餞","d":"2008-05-07","y":2008.3498,"c":"work","s":"27 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見季穗替瓶身畫了一隻暴躁海鳥留下的影響。","m":"自嘲","f":"memories/2008-05-07-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,4,68,12],"deg":7,"b":"2008-05-07，雲壓得很低，海卻異常平。27 歲的許思明正在經歷「季穗替瓶身畫了一隻暴躁海鳥」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":416},{"id":"d142","t":"颱風來前的四小時｜第一罐海茄苳蜜餞","d":"2008-05-27","y":2008.4046,"c":"coast","s":"27 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見季穗替瓶身畫了一隻暴躁海鳥留下的影響。","m":"專注","f":"memories/2008-05-27-08-storm.md","k":8,"arm":0,"ents":[25,26,70,3,4,56,27,12],"deg":9,"b":"2008-05-27，午後雷雨把街面洗成深灰。27 歲的許思明正在經歷「季穗替瓶身畫了一隻暴躁海鳥」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":394},{"id":"d143","t":"一鍋太酸的湯｜第一罐海茄苳蜜餞","d":"2008-06-15","y":2008.455,"c":"kin","s":"27 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見季穗替瓶身畫了一隻暴躁海鳥留下的影響。","m":"柔軟","f":"memories/2008-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,70,3,4,29,6],"deg":7,"b":"2008-06-15，風停了，連狗都顯得不習慣。27 歲的許思明正在經歷「季穗替瓶身畫了一隻暴躁海鳥」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有紙張受潮後像剛醒來的皮膚。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":378},{"id":"d144","t":"把夜聲收進錄音帶｜第一罐海茄苳蜜餞","d":"2008-07-04","y":2008.5082,"c":"thought","s":"27 歲的許思明在鹹風標本室經歷「把夜聲收進錄音帶」，也重新看見季穗替瓶身畫了一隻暴躁海鳥留下的影響。","m":"遲疑","f":"memories/2008-07-04-10-radio.md","k":8,"arm":1,"ents":[30,31,2,3,4,56,68,12],"deg":8,"b":"2008-07-04，雲壓得很低，海卻異常平。27 歲的許思明正在經歷「季穗替瓶身畫了一隻暴躁海鳥」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有鐵鏽和九層塔混在一起的氣味。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":366},{"id":"d145","t":"關店後的城牆｜第一罐海茄苳蜜餞","d":"2008-07-23","y":2008.5603,"c":"body","s":"27 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見父親第一次稱讚她的生意留下的影響。","m":"忙碌","f":"memories/2008-07-23-11-walk.md","k":1,"arm":0,"ents":[32,33,70,3,4,34,12],"deg":7,"b":"2008-07-23，落山風把招牌吹得咯咯響。27 歲的許思明正在經歷「父親第一次稱讚她的生意」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":341},{"id":"d146","t":"旅人帶來的破東西｜第一罐海茄苳蜜餞","d":"2008-08-12","y":2008.6135,"c":"travel","s":"27 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見父親第一次稱讚她的生意留下的影響。","m":"自嘲","f":"memories/2008-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,70,3,4,56,68,12],"deg":8,"b":"2008-08-12，南方的光白得像鹽。27 歲的許思明正在經歷「父親第一次稱讚她的生意」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有鐵鏽和九層塔混在一起的氣味。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":367},{"id":"d147","t":"母親說只是順便｜第一罐海茄苳蜜餞","d":"2008-08-31","y":2008.6655,"c":"kin","s":"27 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見父親第一次稱讚她的生意留下的影響。","m":"專注","f":"memories/2008-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,4,29,6],"deg":7,"b":"2008-08-31，風停了，連狗都顯得不習慣。27 歲的許思明正在經歷「父親第一次稱讚她的生意」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":400},{"id":"d148","t":"父親的工具牆｜第一罐海茄苳蜜餞","d":"2008-09-19","y":2008.716,"c":"kin","s":"27 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見父親第一次稱讚她的生意留下的影響。","m":"柔軟","f":"memories/2008-09-19-14-father.md","k":8,"arm":0,"ents":[38,39,70,3,4,56,68,12],"deg":8,"b":"2008-09-19，空氣黏得每張紙都捲邊。27 歲的許思明正在經歷「父親第一次稱讚她的生意」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":394},{"id":"d149","t":"兩個人各自沉默｜第一罐海茄苳蜜餞","d":"2008-10-09","y":2008.7719,"c":"love","s":"27 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見父親第一次稱讚她的生意留下的影響。","m":"遲疑","f":"memories/2008-10-09-15-love.md","k":1,"arm":0,"ents":[18,41,70,3,4,42,12],"deg":7,"b":"2008-10-09，午後雷雨把街面洗成深灰。27 歲的許思明正在經歷「父親第一次稱讚她的生意」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有曬熱木板摸起來微微發黏。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":365},{"id":"d150","t":"紙袋裡的種子｜第一罐海茄苳蜜餞","d":"2008-10-28","y":2008.824,"c":"field","s":"27 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見兩人開始為錢和遠方爭執留下的影響。","m":"忙碌","f":"memories/2008-10-28-16-seed.md","k":8,"arm":1,"ents":[43,44,2,3,4,56,68,12],"deg":8,"b":"2008-10-28，午後雷雨把街面洗成深灰。27 歲的許思明正在經歷「兩人開始為錢和遠方爭執」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有曬熱木板摸起來微微發黏。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":341},{"id":"d151","t":"昨夜夢見店長出鰓｜第一罐海茄苳蜜餞","d":"2008-11-16","y":2008.8744,"c":"thought","s":"27 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見兩人開始為錢和遠方爭執留下的影響。","m":"自嘲","f":"memories/2008-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,70,3,4,47,6],"deg":7,"b":"2008-11-16，風停了，連狗都顯得不習慣。27 歲的許思明正在經歷「兩人開始為錢和遠方爭執」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":339},{"id":"d152","t":"離開半島的一天｜第一罐海茄苳蜜餞","d":"2008-12-05","y":2008.9276,"c":"travel","s":"27 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見兩人開始為錢和遠方爭執留下的影響。","m":"專注","f":"memories/2008-12-05-18-trip.md","k":8,"arm":1,"ents":[48,49,70,3,4,56,50,12],"deg":9,"b":"2008-12-05，空氣黏得每張紙都捲邊。27 歲的許思明正在經歷「兩人開始為錢和遠方爭執」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有市場冰塊融水流過鞋底。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":363},{"id":"d153","t":"無法分類的下午｜第一罐海茄苳蜜餞","d":"2008-12-25","y":2008.9824,"c":"thought","s":"27 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見兩人開始為錢和遠方爭執留下的影響。","m":"柔軟","f":"memories/2008-12-25-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,4,68,12],"deg":7,"b":"2008-12-25，落山風把招牌吹得咯咯響。27 歲的許思明正在經歷「兩人開始為錢和遠方爭執」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。標本室多了一張發酵桌，她把市場賣不完的果實做成酸得皺眉的蜜餞，意外成了店裡最穩定的收入。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。父親說：『會搖的東西不一定壞了，也可能是地不平。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":426},{"id":"d154","t":"今天的風不肯直走｜兩張不同方向的車票","d":"2009-01-13","y":2009.0329,"c":"coast","s":"28 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見第一次談到分開留下的影響。","m":"拉扯","f":"memories/2009-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,4,5,6],"deg":7,"b":"2009-01-13，風停了，連狗都顯得不習慣。28 歲的許思明正在經歷「第一次談到分開」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":403},{"id":"d155","t":"市場開門以前｜兩張不同方向的車票","d":"2009-02-01","y":2009.0833,"c":"home","s":"28 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見第一次談到分開留下的影響。","m":"自嘲","f":"memories/2009-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,71,3,4,58,11,12],"deg":9,"b":"2009-02-01，午後雷雨把街面洗成深灰。28 歲的許思明正在經歷「第一次談到分開」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":387},{"id":"d156","t":"維修單上的壞脾氣｜兩張不同方向的車票","d":"2009-02-20","y":2009.1354,"c":"craft","s":"28 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見第一次談到分開留下的影響。","m":"專注","f":"memories/2009-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,71,3,4,68,12],"deg":7,"b":"2009-02-20，午後雷雨把街面洗成深灰。28 歲的許思明正在經歷「第一次談到分開」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有紙張受潮後像剛醒來的皮膚。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":362},{"id":"d157","t":"十九的巡邏路線｜兩張不同方向的車票","d":"2009-03-11","y":2009.1941,"c":"home","s":"28 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見第一次談到分開留下的影響。","m":"柔軟","f":"memories/2009-03-11-04-dog.md","k":2,"arm":0,"ents":[65,66,2,3,4,58,17,12],"deg":11,"b":"2009-03-11，落山風把招牌吹得咯咯響。28 歲的許思明正在經歷「第一次談到分開」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有紙張受潮後像剛醒來的皮膚。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":356},{"id":"d158","t":"給遠方的一封慢信｜兩張不同方向的車票","d":"2009-03-31","y":2009.2489,"c":"love","s":"28 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見第一次談到分開留下的影響。","m":"遲疑","f":"memories/2009-03-31-05-letter.md","k":5,"arm":0,"ents":[18,19,71,3,4,68,6],"deg":7,"b":"2009-03-31，雲壓得很低，海卻異常平。28 歲的許思明正在經歷「第一次談到分開」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":334},{"id":"d159","t":"樣方偏了七公分｜兩張不同方向的車票","d":"2009-04-19","y":2009.2993,"c":"field","s":"28 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見母親勸她別把守住和愛混在一起留下的影響。","m":"拉扯","f":"memories/2009-04-19-06-field.md","k":1,"arm":1,"ents":[20,21,71,3,4,58,22,12],"deg":9,"b":"2009-04-19，落山風把招牌吹得咯咯響。28 歲的許思明正在經歷「母親勸她別把守住和愛混在一起」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有遠處機車聲被風切成斷句。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":362},{"id":"d160","t":"零錢盒與月底｜兩張不同方向的車票","d":"2009-05-08","y":2009.3525,"c":"work","s":"28 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見母親勸她別把守住和愛混在一起留下的影響。","m":"自嘲","f":"memories/2009-05-08-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,4,68,12],"deg":7,"b":"2009-05-08，落山風把招牌吹得咯咯響。28 歲的許思明正在經歷「母親勸她別把守住和愛混在一起」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":415},{"id":"d161","t":"颱風來前的四小時｜兩張不同方向的車票","d":"2009-05-27","y":2009.4046,"c":"coast","s":"28 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見母親勸她別把守住和愛混在一起留下的影響。","m":"專注","f":"memories/2009-05-27-08-storm.md","k":1,"arm":0,"ents":[25,26,71,3,4,58,27,12],"deg":9,"b":"2009-05-27，午後雷雨把街面洗成深灰。28 歲的許思明正在經歷「母親勸她別把守住和愛混在一起」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鐵鏽和九層塔混在一起的氣味。那不是象徵，只是我確實站在那裡。\n\n現場有鐵鏽和九層塔混在一起的氣味。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":397},{"id":"d162","t":"一鍋太酸的湯｜兩張不同方向的車票","d":"2009-06-15","y":2009.455,"c":"kin","s":"28 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見母親勸她別把守住和愛混在一起留下的影響。","m":"柔軟","f":"memories/2009-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,71,3,4,29,6],"deg":7,"b":"2009-06-15，午後雷雨把街面洗成深灰。28 歲的許思明正在經歷「母親勸她別把守住和愛混在一起」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有市場冰塊融水流過鞋底。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":374},{"id":"d163","t":"把夜聲收進錄音帶｜兩張不同方向的車票","d":"2009-07-05","y":2009.511,"c":"thought","s":"28 歲的許思明在鹹風標本室經歷「把夜聲收進錄音帶」，也重新看見母親勸她別把守住和愛混在一起留下的影響。","m":"遲疑","f":"memories/2009-07-05-10-radio.md","k":4,"arm":1,"ents":[30,31,2,3,4,58,68,12],"deg":8,"b":"2009-07-05，風停了，連狗都顯得不習慣。28 歲的許思明正在經歷「母親勸她別把守住和愛混在一起」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有鐵鏽和九層塔混在一起的氣味。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":363},{"id":"d164","t":"關店後的城牆｜兩張不同方向的車票","d":"2009-07-24","y":2009.563,"c":"body","s":"28 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見標本室接到地方飲食採集案留下的影響。","m":"拉扯","f":"memories/2009-07-24-11-walk.md","k":1,"arm":0,"ents":[32,33,71,3,4,34,12],"deg":7,"b":"2009-07-24，空氣黏得每張紙都捲邊。28 歲的許思明正在經歷「標本室接到地方飲食採集案」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有鹽粒卡在手腕細小的傷口。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":334},{"id":"d165","t":"旅人帶來的破東西｜兩張不同方向的車票","d":"2009-08-12","y":2009.6135,"c":"travel","s":"28 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見標本室接到地方飲食採集案留下的影響。","m":"自嘲","f":"memories/2009-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,71,3,4,58,68,12],"deg":8,"b":"2009-08-12，風停了，連狗都顯得不習慣。28 歲的許思明正在經歷「標本室接到地方飲食採集案」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有遠處機車聲被風切成斷句。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":377},{"id":"d166","t":"母親說只是順便｜兩張不同方向的車票","d":"2009-08-31","y":2009.6655,"c":"kin","s":"28 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見標本室接到地方飲食採集案留下的影響。","m":"專注","f":"memories/2009-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,4,29,6],"deg":7,"b":"2009-08-31，雲壓得很低，海卻異常平。28 歲的許思明正在經歷「標本室接到地方飲食採集案」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":413},{"id":"d167","t":"父親的工具牆｜兩張不同方向的車票","d":"2009-09-20","y":2009.7187,"c":"kin","s":"28 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見標本室接到地方飲食採集案留下的影響。","m":"柔軟","f":"memories/2009-09-20-14-father.md","k":4,"arm":0,"ents":[38,39,71,3,4,58,68,12],"deg":8,"b":"2009-09-20，雲壓得很低，海卻異常平。28 歲的許思明正在經歷「標本室接到地方飲食採集案」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":386},{"id":"d168","t":"兩個人各自沉默｜兩張不同方向的車票","d":"2009-10-09","y":2009.7719,"c":"love","s":"28 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見標本室接到地方飲食採集案留下的影響。","m":"遲疑","f":"memories/2009-10-09-15-love.md","k":1,"arm":0,"ents":[18,41,71,3,4,42,12],"deg":7,"b":"2009-10-09，雲壓得很低，海卻異常平。28 歲的許思明正在經歷「標本室接到地方飲食採集案」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有曬熱木板摸起來微微發黏。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":375},{"id":"d169","t":"紙袋裡的種子｜兩張不同方向的車票","d":"2009-10-28","y":2009.824,"c":"field","s":"28 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見兩張車票最後都沒有使用留下的影響。","m":"拉扯","f":"memories/2009-10-28-16-seed.md","k":4,"arm":1,"ents":[43,44,2,3,4,58,68,12],"deg":8,"b":"2009-10-28，雲壓得很低，海卻異常平。28 歲的許思明正在經歷「兩張車票最後都沒有使用」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有鐵鏽和九層塔混在一起的氣味。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":354},{"id":"d170","t":"昨夜夢見店長出鰓｜兩張不同方向的車票","d":"2009-11-16","y":2009.8744,"c":"thought","s":"28 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見兩張車票最後都沒有使用留下的影響。","m":"自嘲","f":"memories/2009-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,71,3,4,47,6],"deg":7,"b":"2009-11-16，落山風把招牌吹得咯咯響。28 歲的許思明正在經歷「兩張車票最後都沒有使用」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":353},{"id":"d171","t":"離開半島的一天｜兩張不同方向的車票","d":"2009-12-05","y":2009.9276,"c":"travel","s":"28 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見兩張車票最後都沒有使用留下的影響。","m":"專注","f":"memories/2009-12-05-18-trip.md","k":1,"arm":1,"ents":[48,49,71,3,4,58,50,12],"deg":9,"b":"2009-12-05，落山風把招牌吹得咯咯響。28 歲的許思明正在經歷「兩張車票最後都沒有使用」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有市場冰塊融水流過鞋底。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":363},{"id":"d172","t":"無法分類的下午｜兩張不同方向的車票","d":"2009-12-25","y":2009.9824,"c":"thought","s":"28 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見兩張車票最後都沒有使用留下的影響。","m":"柔軟","f":"memories/2009-12-25-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,4,68,12],"deg":7,"b":"2009-12-25，落山風把招牌吹得咯咯響。28 歲的許思明正在經歷「兩張車票最後都沒有使用」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。季穗想去北方加入長期巡演，思明不願離開剛站穩的標本室。她們把爭論寫在同一本帳簿的左右兩頁。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":422},{"id":"d173","t":"今天的風不肯直走｜灰藍色錄音筆","d":"2010-01-13","y":2010.0329,"c":"coast","s":"29 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見鹽叔教她看雲的底色留下的影響。","m":"專注","f":"memories/2010-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,4,5,6],"deg":7,"b":"2010-01-13，午後雷雨把街面洗成深灰。29 歲的許思明正在經歷「鹽叔教她看雲的底色」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：市場冰塊融水流過鞋底，還有一句沒有及時回應的話。\n\n現場有市場冰塊融水流過鞋底。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":406},{"id":"d174","t":"市場開門以前｜灰藍色錄音筆","d":"2010-02-01","y":2010.0833,"c":"home","s":"29 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見鹽叔教她看雲的底色留下的影響。","m":"自嘲","f":"memories/2010-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,72,3,4,60,11,12],"deg":9,"b":"2010-02-01，落山風把招牌吹得咯咯響。29 歲的許思明正在經歷「鹽叔教她看雲的底色」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":386},{"id":"d175","t":"維修單上的壞脾氣｜灰藍色錄音筆","d":"2010-02-20","y":2010.1354,"c":"craft","s":"29 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見鹽叔教她看雲的底色留下的影響。","m":"專注","f":"memories/2010-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,72,3,4,68,12],"deg":7,"b":"2010-02-20，雲壓得很低，海卻異常平。29 歲的許思明正在經歷「鹽叔教她看雲的底色」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有市場冰塊融水流過鞋底。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":371},{"id":"d176","t":"十九的巡邏路線｜灰藍色錄音筆","d":"2010-03-11","y":2010.1941,"c":"home","s":"29 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見鹽叔教她看雲的底色留下的影響。","m":"柔軟","f":"memories/2010-03-11-04-dog.md","k":2,"arm":0,"ents":[65,66,2,3,4,60,17,12],"deg":9,"b":"2010-03-11，午後雷雨把街面洗成深灰。29 歲的許思明正在經歷「鹽叔教她看雲的底色」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有鐵鏽和九層塔混在一起的氣味。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":362},{"id":"d177","t":"給遠方的一封慢信｜灰藍色錄音筆","d":"2010-03-31","y":2010.2489,"c":"love","s":"29 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見鹽叔教她看雲的底色留下的影響。","m":"遲疑","f":"memories/2010-03-31-05-letter.md","k":5,"arm":0,"ents":[18,19,72,3,4,68,6],"deg":7,"b":"2010-03-31，空氣黏得每張紙都捲邊。29 歲的許思明正在經歷「鹽叔教她看雲的底色」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有鐵鏽和九層塔混在一起的氣味。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":338},{"id":"d178","t":"樣方偏了七公分｜灰藍色錄音筆","d":"2010-04-19","y":2010.2993,"c":"field","s":"29 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見在後灣錄到魚販的清晨留下的影響。","m":"專注","f":"memories/2010-04-19-06-field.md","k":1,"arm":1,"ents":[20,21,72,3,4,60,22,12],"deg":9,"b":"2010-04-19，風停了，連狗都顯得不習慣。29 歲的許思明正在經歷「在後灣錄到魚販的清晨」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有市場冰塊融水流過鞋底。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":354},{"id":"d179","t":"零錢盒與月底｜灰藍色錄音筆","d":"2010-05-08","y":2010.3525,"c":"work","s":"29 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見在後灣錄到魚販的清晨留下的影響。","m":"自嘲","f":"memories/2010-05-08-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,4,68,12],"deg":7,"b":"2010-05-08，落山風把招牌吹得咯咯響。29 歲的許思明正在經歷「在後灣錄到魚販的清晨」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":425},{"id":"d180","t":"颱風來前的四小時｜灰藍色錄音筆","d":"2010-05-27","y":2010.4046,"c":"coast","s":"29 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見在後灣錄到魚販的清晨留下的影響。","m":"專注","f":"memories/2010-05-27-08-storm.md","k":1,"arm":0,"ents":[25,26,72,3,4,60,27,12],"deg":9,"b":"2010-05-27，午後雷雨把街面洗成深灰。29 歲的許思明正在經歷「在後灣錄到魚販的清晨」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得市場冰塊融水流過鞋底。那不是象徵，只是我確實站在那裡。\n\n現場有市場冰塊融水流過鞋底。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":388},{"id":"d181","t":"一鍋太酸的湯｜灰藍色錄音筆","d":"2010-06-15","y":2010.455,"c":"kin","s":"29 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見在後灣錄到魚販的清晨留下的影響。","m":"柔軟","f":"memories/2010-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,72,3,4,29,6],"deg":7,"b":"2010-06-15，南方的光白得像鹽。29 歲的許思明正在經歷「在後灣錄到魚販的清晨」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有鹽粒卡在手腕細小的傷口。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":367},{"id":"d182","t":"把夜聲收進錄音帶｜灰藍色錄音筆","d":"2010-07-05","y":2010.511,"c":"thought","s":"29 歲的許思明在鹹風標本室經歷「把夜聲收進錄音帶」，也重新看見在後灣錄到魚販的清晨留下的影響。","m":"遲疑","f":"memories/2010-07-05-10-radio.md","k":4,"arm":1,"ents":[30,31,2,3,4,60,68,12],"deg":9,"b":"2010-07-05，風停了，連狗都顯得不習慣。29 歲的許思明正在經歷「在後灣錄到魚販的清晨」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有市場冰塊融水流過鞋底。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":367},{"id":"d183","t":"關店後的城牆｜灰藍色錄音筆","d":"2010-07-24","y":2010.563,"c":"body","s":"29 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見季穗一年只回來四次留下的影響。","m":"專注","f":"memories/2010-07-24-11-walk.md","k":1,"arm":0,"ents":[32,33,72,3,4,34,12],"deg":7,"b":"2010-07-24，南方的光白得像鹽。29 歲的許思明正在經歷「季穗一年只回來四次」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有紙張受潮後像剛醒來的皮膚。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":335},{"id":"d184","t":"旅人帶來的破東西｜灰藍色錄音筆","d":"2010-08-12","y":2010.6135,"c":"travel","s":"29 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見季穗一年只回來四次留下的影響。","m":"自嘲","f":"memories/2010-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,72,3,4,60,68,12],"deg":8,"b":"2010-08-12，午後雷雨把街面洗成深灰。29 歲的許思明正在經歷「季穗一年只回來四次」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有鹽粒卡在手腕細小的傷口。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":363},{"id":"d185","t":"母親說只是順便｜灰藍色錄音筆","d":"2010-08-31","y":2010.6655,"c":"kin","s":"29 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見季穗一年只回來四次留下的影響。","m":"專注","f":"memories/2010-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,4,29,6],"deg":7,"b":"2010-08-31，風停了，連狗都顯得不習慣。29 歲的許思明正在經歷「季穗一年只回來四次」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鐵鏽和九層塔混在一起的氣味，還有一句沒有及時回應的話。\n\n現場有鐵鏽和九層塔混在一起的氣味。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":403},{"id":"d186","t":"父親的工具牆｜灰藍色錄音筆","d":"2010-09-20","y":2010.7187,"c":"kin","s":"29 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見季穗一年只回來四次留下的影響。","m":"柔軟","f":"memories/2010-09-20-14-father.md","k":4,"arm":0,"ents":[38,39,72,3,4,60,68,12],"deg":8,"b":"2010-09-20，南方的光白得像鹽。29 歲的許思明正在經歷「季穗一年只回來四次」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鐵鏽和九層塔混在一起的氣味。那不是象徵，只是我確實站在那裡。\n\n現場有鐵鏽和九層塔混在一起的氣味。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":387},{"id":"d187","t":"兩個人各自沉默｜灰藍色錄音筆","d":"2010-10-09","y":2010.7719,"c":"love","s":"29 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見季穗一年只回來四次留下的影響。","m":"遲疑","f":"memories/2010-10-09-15-love.md","k":1,"arm":0,"ents":[18,41,72,3,4,42,12],"deg":7,"b":"2010-10-09，風停了，連狗都顯得不習慣。29 歲的許思明正在經歷「季穗一年只回來四次」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有鐵鏽和九層塔混在一起的氣味。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":369},{"id":"d188","t":"紙袋裡的種子｜灰藍色錄音筆","d":"2010-10-28","y":2010.824,"c":"field","s":"29 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見她發現等待也是田野工作留下的影響。","m":"專注","f":"memories/2010-10-28-16-seed.md","k":4,"arm":1,"ents":[43,44,2,3,4,60,68,12],"deg":8,"b":"2010-10-28，風停了，連狗都顯得不習慣。29 歲的許思明正在經歷「她發現等待也是田野工作」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有曬熱木板摸起來微微發黏。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":358},{"id":"d189","t":"昨夜夢見店長出鰓｜灰藍色錄音筆","d":"2010-11-16","y":2010.8744,"c":"thought","s":"29 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見她發現等待也是田野工作留下的影響。","m":"自嘲","f":"memories/2010-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,72,3,4,47,6],"deg":7,"b":"2010-11-16，雲壓得很低，海卻異常平。29 歲的許思明正在經歷「她發現等待也是田野工作」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":348},{"id":"d190","t":"離開半島的一天｜灰藍色錄音筆","d":"2010-12-05","y":2010.9276,"c":"travel","s":"29 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見她發現等待也是田野工作留下的影響。","m":"專注","f":"memories/2010-12-05-18-trip.md","k":1,"arm":1,"ents":[48,49,72,3,4,60,50,12],"deg":9,"b":"2010-12-05，空氣黏得每張紙都捲邊。29 歲的許思明正在經歷「她發現等待也是田野工作」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有鹽粒卡在手腕細小的傷口。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":364},{"id":"d191","t":"無法分類的下午｜灰藍色錄音筆","d":"2010-12-25","y":2010.9824,"c":"thought","s":"29 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見她發現等待也是田野工作留下的影響。","m":"柔軟","f":"memories/2010-12-25-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,4,68,12],"deg":7,"b":"2010-12-25，雲壓得很低，海卻異常平。29 歲的許思明正在經歷「她發現等待也是田野工作」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：曬熱木板摸起來微微發黏，還有一句沒有及時回應的話。\n\n現場有曬熱木板摸起來微微發黏。開始替恆春半島的市場、潮間帶與老行業做口述採集。她不追求完整，只記下人說到一半停住的地方。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。鹽叔說：『雲沒答應妳什麼，是妳自己把它當預告。』\n\n恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":422},{"id":"d192","t":"今天的風不肯直走｜被風吹走的帳頁","d":"2011-01-13","y":2011.0329,"c":"coast","s":"30 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見第一次雇阿芒幫忙看店留下的影響。","m":"遲疑","f":"memories/2011-01-13-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,4,5,6],"deg":7,"b":"2011-01-13，南方的光白得像鹽。30 歲的許思明正在經歷「第一次雇阿芒幫忙看店」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":393},{"id":"d193","t":"市場開門以前｜被風吹走的帳頁","d":"2011-02-01","y":2011.0833,"c":"home","s":"30 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見第一次雇阿芒幫忙看店留下的影響。","m":"自嘲","f":"memories/2011-02-01-02-market.md","k":9,"arm":0,"ents":[7,8,73,3,4,10,11,12],"deg":8,"b":"2011-02-01，雲壓得很低，海卻異常平。30 歲的許思明正在經歷「第一次雇阿芒幫忙看店」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":392},{"id":"d194","t":"維修單上的壞脾氣｜被風吹走的帳頁","d":"2011-02-20","y":2011.1354,"c":"craft","s":"30 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見第一次雇阿芒幫忙看店留下的影響。","m":"專注","f":"memories/2011-02-20-03-repair.md","k":10,"arm":1,"ents":[13,14,73,3,4,68,12],"deg":7,"b":"2011-02-20，南方的光白得像鹽。30 歲的許思明正在經歷「第一次雇阿芒幫忙看店」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有遠處機車聲被風切成斷句。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":371},{"id":"d195","t":"十九的巡邏路線｜被風吹走的帳頁","d":"2011-03-11","y":2011.1941,"c":"home","s":"30 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見第一次雇阿芒幫忙看店留下的影響。","m":"柔軟","f":"memories/2011-03-11-04-dog.md","k":7,"arm":0,"ents":[65,66,2,3,4,10,17,12],"deg":14,"b":"2011-03-11，南方的光白得像鹽。30 歲的許思明正在經歷「第一次雇阿芒幫忙看店」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有紙張受潮後像剛醒來的皮膚。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":365},{"id":"d196","t":"給遠方的一封慢信｜被風吹走的帳頁","d":"2011-03-31","y":2011.2489,"c":"love","s":"30 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見第一次雇阿芒幫忙看店留下的影響。","m":"遲疑","f":"memories/2011-03-31-05-letter.md","k":5,"arm":0,"ents":[18,19,73,3,4,68,6],"deg":7,"b":"2011-03-31，南方的光白得像鹽。30 歲的許思明正在經歷「第一次雇阿芒幫忙看店」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":346},{"id":"d197","t":"樣方偏了七公分｜被風吹走的帳頁","d":"2011-04-19","y":2011.2993,"c":"field","s":"30 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見季穗寄回一箱巡演道具留下的影響。","m":"遲疑","f":"memories/2011-04-19-06-field.md","k":7,"arm":1,"ents":[20,21,73,3,4,10,22,12],"deg":9,"b":"2011-04-19，風停了，連狗都顯得不習慣。30 歲的許思明正在經歷「季穗寄回一箱巡演道具」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有遠處機車聲被風切成斷句。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":366},{"id":"d198","t":"零錢盒與月底｜被風吹走的帳頁","d":"2011-05-08","y":2011.3525,"c":"work","s":"30 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見季穗寄回一箱巡演道具留下的影響。","m":"自嘲","f":"memories/2011-05-08-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,4,68,12],"deg":7,"b":"2011-05-08，落山風把招牌吹得咯咯響。30 歲的許思明正在經歷「季穗寄回一箱巡演道具」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀察\n\n- 發生的事：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：遠處機車聲被風切成斷句，還有一句沒有及時回應的話。\n\n現場有遠處機車聲被風切成斷句。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":415},{"id":"d199","t":"颱風來前的四小時｜被風吹走的帳頁","d":"2011-05-27","y":2011.4046,"c":"coast","s":"30 歲的許思明在恆春經歷「颱風來前的四小時」，也重新看見季穗寄回一箱巡演道具留下的影響。","m":"專注","f":"memories/2011-05-27-08-storm.md","k":7,"arm":0,"ents":[25,26,73,3,4,10,27,12],"deg":9,"b":"2011-05-27，雲壓得很低，海卻異常平。30 歲的許思明正在經歷「季穗寄回一箱巡演道具」。她今天給自己的工作很簡單：收進紙旗、封住種子櫃、替獨居鄰居檢查窗扣，最後才想起自己房間還有一扇窗沒關。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":385},{"id":"d200","t":"一鍋太酸的湯｜被風吹走的帳頁","d":"2011-06-15","y":2011.455,"c":"kin","s":"30 歲的許思明在南門老家經歷「一鍋太酸的湯」，也重新看見季穗寄回一箱巡演道具留下的影響。","m":"柔軟","f":"memories/2011-06-15-09-meal.md","k":9,"arm":0,"ents":[28,7,73,3,4,29,6],"deg":7,"b":"2011-06-15，落山風把招牌吹得咯咯響。30 歲的許思明正在經歷「季穗寄回一箱巡演道具」。她今天給自己的工作很簡單：照母親只憑手感的做法煮湯，酸味失控以後沒有倒掉，而是多切一整盤瓜菜把它慢慢拉回來。\n\n現場有紙張受潮後像剛醒來的皮膚。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":371},{"id":"d201","t":"把夜聲收進錄音帶｜被風吹走的帳頁","d":"2011-07-05","y":2011.511,"c":"thought","s":"30 歲的許思明在鹹風標本室經歷「把夜聲收進錄音帶」，也重新看見季穗寄回一箱巡演道具留下的影響。","m":"遲疑","f":"memories/2011-07-05-10-radio.md","k":7,"arm":1,"ents":[30,31,2,3,4,10,68,12],"deg":8,"b":"2011-07-05，南方的光白得像鹽。30 歲的許思明正在經歷「季穗寄回一箱巡演道具」。她今天給自己的工作很簡單：在深夜錄下風、冰箱與遠處車聲，把每次無法辨認的聲音標成問號，不急著替它編一個來源。\n\n現場有市場冰塊融水流過鞋底。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":353},{"id":"d202","t":"關店後的城牆｜被風吹走的帳頁","d":"2011-07-24","y":2011.563,"c":"body","s":"30 歲的許思明在恆春東門經歷「關店後的城牆」，也重新看見她把兩人的房間改成乾燥室留下的影響。","m":"遲疑","f":"memories/2011-07-24-11-walk.md","k":1,"arm":0,"ents":[32,33,73,3,4,34,12],"deg":7,"b":"2011-07-24，落山風把招牌吹得咯咯響。30 歲的許思明正在經歷「她把兩人的房間改成乾燥室」。她今天給自己的工作很簡單：沿舊城牆走到呼吸變慢，刻意不計算步數，只辨認哪一段路會讓肩膀自動放鬆。\n\n### 留下\n\n現場有曬熱木板摸起來微微發黏。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":345},{"id":"d203","t":"旅人帶來的破東西｜被風吹走的帳頁","d":"2011-08-12","y":2011.6135,"c":"travel","s":"30 歲的許思明在鹹風標本室經歷「旅人帶來的破東西」，也重新看見她把兩人的房間改成乾燥室留下的影響。","m":"自嘲","f":"memories/2011-08-12-12-visitor.md","k":10,"arm":1,"ents":[35,13,73,3,4,10,68,12],"deg":8,"b":"2011-08-12，雲壓得很低，海卻異常平。30 歲的許思明正在經歷「她把兩人的房間改成乾燥室」。她今天給自己的工作很簡單：聽陌生旅人解釋一件破物為何不能丟，再判斷自己修的是機關、回憶，還是對方不肯結束的旅程。\n\n現場有鐵鏽和九層塔混在一起的氣味。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她繞了一小段遠路才回到鹹風標本室。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她後來明白，記錄不是把事情釘死，而是替當時的自己留一條能回去的窄路。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":374},{"id":"d204","t":"母親說只是順便｜被風吹走的帳頁","d":"2011-08-31","y":2011.6655,"c":"kin","s":"30 歲的許思明在南門老家經歷「母親說只是順便」，也重新看見她把兩人的房間改成乾燥室留下的影響。","m":"專注","f":"memories/2011-08-31-13-mother.md","k":5,"arm":0,"ents":[36,37,2,3,4,29,6],"deg":7,"b":"2011-08-31，午後雷雨把街面洗成深灰。30 歲的許思明正在經歷「她把兩人的房間改成乾燥室」。她今天給自己的工作很簡單：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n\n## 今日觀察\n\n- 發生的事：接過母親聲稱順便帶來的三層食盒，假裝沒看見每一層都剛好是自己這周忘記吃的東西。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":420},{"id":"d205","t":"父親的工具牆｜被風吹走的帳頁","d":"2011-09-20","y":2011.7187,"c":"kin","s":"30 歲的許思明在鹹風標本室經歷「父親的工具牆」，也重新看見她把兩人的房間改成乾燥室留下的影響。","m":"柔軟","f":"memories/2011-09-20-14-father.md","k":7,"arm":0,"ents":[38,39,73,3,4,10,68,12],"deg":8,"b":"2011-09-20，雲壓得很低，海卻異常平。30 歲的許思明正在經歷「她把兩人的房間改成乾燥室」。她今天給自己的工作很簡單：把借走的鉗子掛回父親規定的位置，聽他解釋工具為什麼也需要鄰居，並把這句話寫在牆邊。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得鹽粒卡在手腕細小的傷口。那不是象徵，只是我確實站在那裡。\n\n現場有鹽粒卡在手腕細小的傷口。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":403},{"id":"d206","t":"兩個人各自沉默｜被風吹走的帳頁","d":"2011-10-09","y":2011.7719,"c":"love","s":"30 歲的許思明在萬里桐經歷「兩個人各自沉默」，也重新看見她把兩人的房間改成乾燥室留下的影響。","m":"遲疑","f":"memories/2011-10-09-15-love.md","k":1,"arm":0,"ents":[18,41,73,3,4,42,12],"deg":7,"b":"2011-10-09，南方的光白得像鹽。30 歲的許思明正在經歷「她把兩人的房間改成乾燥室」。她今天給自己的工作很簡單：和身邊的人並排坐著，不急著把沉默解釋成生氣，等海面先把光從銀色換成深藍。\n\n現場有鐵鏽和九層塔混在一起的氣味。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n檔案最誠實的地方是缺口。寫下沒看見、沒聽懂和記錯，比編出完整故事更接近她想守住的生活。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":374},{"id":"d207","t":"紙袋裡的種子｜被風吹走的帳頁","d":"2011-10-28","y":2011.824,"c":"field","s":"30 歲的許思明在鹹風標本室經歷「紙袋裡的種子」，也重新看見年末仍替對方留一盞燈留下的影響。","m":"遲疑","f":"memories/2011-10-28-16-seed.md","k":7,"arm":1,"ents":[43,44,2,3,4,10,68,12],"deg":8,"b":"2011-10-28，雲壓得很低，海卻異常平。30 歲的許思明正在經歷「年末仍替對方留一盞燈」。她今天給自己的工作很簡單：替一包來歷不明的種子做發芽測試，在紙袋上誠實寫下不知道，並留出一格記錄失敗。\n\n現場有鐵鏽和九層塔混在一起的氣味。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":355},{"id":"d208","t":"昨夜夢見店長出鰓｜被風吹走的帳頁","d":"2011-11-16","y":2011.8744,"c":"thought","s":"30 歲的許思明在夢裡的後灣經歷「昨夜夢見店長出鰓」，也重新看見年末仍替對方留一盞燈留下的影響。","m":"自嘲","f":"memories/2011-11-16-17-dream.md","k":5,"arm":1,"ents":[45,46,73,3,4,47,6],"deg":7,"b":"2011-11-16，南方的光白得像鹽。30 歲的許思明正在經歷「年末仍替對方留一盞燈」。她今天給自己的工作很簡單：趁早餐還沒涼以前記下夢，禁止自己補邏輯，讓會說話的魚和倒著開的店門保持原樣。\n\n### 留下\n\n現場有遠處機車聲被風切成斷句。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":348},{"id":"d209","t":"離開半島的一天｜被風吹走的帳頁","d":"2011-12-05","y":2011.9276,"c":"travel","s":"30 歲的許思明在枋寮車站經歷「離開半島的一天」，也重新看見年末仍替對方留一盞燈留下的影響。","m":"專注","f":"memories/2011-12-05-18-trip.md","k":7,"arm":1,"ents":[48,49,73,3,4,10,50,12],"deg":9,"b":"2011-12-05，風停了，連狗都顯得不習慣。30 歲的許思明正在經歷「年末仍替對方留一盞燈」。她今天給自己的工作很簡單：只帶一個小包搭上北行列車，沿途記錄身體在哪一站開始想念風，又在哪一站慶幸沒人認識自己。\n\n現場有遠處機車聲被風切成斷句。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她繞了一小段遠路才回到枋寮車站。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":379},{"id":"d210","t":"無法分類的下午｜被風吹走的帳頁","d":"2011-12-25","y":2011.9824,"c":"thought","s":"30 歲的許思明在鹹風標本室經歷「無法分類的下午」，也重新看見年末仍替對方留一盞燈留下的影響。","m":"柔軟","f":"memories/2011-12-25-19-odd.md","k":4,"arm":1,"ents":[51,52,2,3,4,68,12],"deg":7,"b":"2011-12-25，空氣黏得每張紙都捲邊。30 歲的許思明正在經歷「年末仍替對方留一盞燈」。她今天給自己的工作很簡單：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n\n## 今日觀察\n\n- 發生的事：處理一連串不屬於任何表格的事，替螃蟹讓路、幫小孩找一顆不存在的綠色螺絲，並接受今天沒有主旨。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：鹽粒卡在手腕細小的傷口，還有一句沒有及時回應的話。\n\n現場有鹽粒卡在手腕細小的傷口。標本室成為旅人會特地繞來的怪地方，生意變好，關係卻像掛在門外的帳頁，一陣落山風就翻到誰都讀不懂的那面。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。阿芒說：『妳每次說順便，通常都要忙到天黑。』\n\n有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n這篇沒有結論。紙頁下方只壓著一粒鹽，隔天醒來，它已經吸水化開。","n":413},{"id":"d211","t":"今天的風不肯直走｜空著的木衣架","d":"2012-01-12","y":2012.0301,"c":"coast","s":"31 歲的許思明在龍磐經歷「今天的風不肯直走」，也重新看見把共同帳簿結清留下的影響。","m":"失落","f":"memories/2012-01-12-01-wind.md","k":5,"arm":0,"ents":[0,1,2,3,4,5,6],"deg":7,"b":"2012-01-12，風停了，連狗都顯得不習慣。31 歲的許思明正在經歷「把共同帳簿結清」。她今天給自己的工作很簡單：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n\n## 今日觀察\n\n- 發生的事：把紙帶綁在三種高度，記錄風如何繞過矮灌木，再把最不可靠的那一筆用紅色圈起來。\n- 沒把握的事：她無法確認自己的判斷是不是被疲倦推著走。\n- 想留下的細節：紙張受潮後像剛醒來的皮膚，還有一句沒有及時回應的話。\n\n現場有紙張受潮後像剛醒來的皮膚。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n親密不是把門全部打開。對她而言，更像知道哪一扇門今天關著，也願意在門外放下一碗還熱的湯。\n\n回程時西門已經亮燈，她忽然很餓。能夠準時感覺到餓，是她判斷自己還在生活裡的方法。","n":408},{"id":"d212","t":"市場開門以前｜空著的木衣架","d":"2012-01-31","y":2012.0822,"c":"home","s":"31 歲的許思明在恆春西門經歷「市場開門以前」，也重新看見把共同帳簿結清留下的影響。","m":"自嘲","f":"memories/2012-01-31-02-market.md","k":9,"arm":0,"ents":[7,8,74,3,4,62,11,12],"deg":8,"b":"2012-01-31，風停了，連狗都顯得不習慣。31 歲的許思明正在經歷「把共同帳簿結清」。她今天給自己的工作很簡單：幫菜攤把被風吹散的價格牌壓好，買下賣相最差的一籃果實，答應回去試一種不會太甜的做法。\n\n> 給三年後的思明：如果妳已經忘了今天，請先記得曬熱木板摸起來微微發黏。那不是象徵，只是我確實站在那裡。\n\n現場有曬熱木板摸起來微微發黏。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n她在信末沒有寫祝福，只列了一件明天能做的事：把今天留下的工具歸位，再問一次對方真正需要什麼。她把這件小事記下來，因為人生真正改變方向時，很少會自己敲鑼打鼓。通常只是手先做了一個不同的動作。\n\n她把最後一件工具擦乾，聽見屋外風勢又變，決定明天再重新判斷一次。","n":393},{"id":"d213","t":"維修單上的壞脾氣｜空著的木衣架","d":"2012-02-18","y":2012.1299,"c":"craft","s":"31 歲的許思明在鹹風標本室經歷「維修單上的壞脾氣」，也重新看見把共同帳簿結清留下的影響。","m":"專注","f":"memories/2012-02-18-03-repair.md","k":10,"arm":1,"ents":[13,14,74,3,4,68,12],"deg":7,"b":"2012-02-18，午後雷雨把街面洗成深灰。31 歲的許思明正在經歷「把共同帳簿結清」。她今天給自己的工作很簡單：拆開一件拒絕合作的舊家電，先清掉鹽霧結成的白粉，再尋找那顆總是躲在最深處的螺絲。\n\n現場有鐵鏽和九層塔混在一起的氣味。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n## 暫時配方\n\n1. 先承認有一部分不知道怎麼處理。\n2. 把能拆開的事情拆到手掌大小。\n3. 留一點時間給風、發酵或另一個人。\n4. 明天再聞一次，不因心急多加解釋。\n\n她不再急著替每個選擇找意義。能在晚飯前完成、能讓一個人少煩惱一點，已經是夠具體的價值。\n\n她沒有拍照，只記住當時每個人的手都在做事。那種畫面比合照更像一家人。","n":367},{"id":"d214","t":"十九的巡邏路線｜空著的木衣架","d":"2012-03-07","y":2012.1831,"c":"home","s":"31 歲的許思明在恆春舊城經歷「十九的巡邏路線」，也重新看見把共同帳簿結清留下的影響。","m":"柔軟","f":"memories/2012-03-07-04-dog.md","k":6,"arm":0,"ents":[65,66,2,3,4,62,17,12],"deg":11,"b":"2012-03-07，午後雷雨把街面洗成深灰。31 歲的許思明正在經歷「把共同帳簿結清」。她今天給自己的工作很簡單：跟著十九繞一條它自己決定的路，在每個它停下來的地方記一筆，最後發現狗比地圖更在意誰家門口有陰影。\n\n現場有市場冰塊融水流過鞋底。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她問自己：『如果沒人看見，我還會做嗎？』\n\n答案不是立刻出現。她先把桌面清出一塊空位，喝掉已經冷的茶，再重新做了一遍最麻煩的步驟。海邊的人知道，留下並不等於靜止。每天同一扇門外都是不同的風，守著一個地方也能走很遠。\n\n十九在舊年代會把頭壓在她腳背上。如今她仍會替那個位置留一點空，像替過去保留座位。","n":365},{"id":"d215","t":"給遠方的一封慢信｜空著的木衣架","d":"2012-03-25","y":2012.2324,"c":"love","s":"31 歲的許思明在鹹風標本室經歷「給遠方的一封慢信」，也重新看見把共同帳簿結清留下的影響。","m":"遲疑","f":"memories/2012-03-25-05-letter.md","k":5,"arm":0,"ents":[18,19,74,3,4,68,6],"deg":7,"b":"2012-03-25，空氣黏得每張紙都捲邊。31 歲的許思明正在經歷「把共同帳簿結清」。她今天給自己的工作很簡單：把真正想說的話寫在第三稿，前兩稿折成墊桌腳的紙片，讓搖晃先停下來再處理感情。\n\n### 留下\n\n現場有市場冰塊融水流過鞋底。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。季穗說：『妳不是固執，妳只是轉彎的半徑很大。』\n\n### 送走\n\n一項已經不適合現在的計畫、一句為了面子才說的答應，以及抽屜裡那顆尺寸永遠不對的螺絲。有些東西被修好後仍留著裂痕。她喜歡這樣，因為裂痕會提醒人別把復原誤認成回到從前。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":342},{"id":"d216","t":"樣方偏了七公分｜空著的木衣架","d":"2012-04-13","y":2012.2829,"c":"field","s":"31 歲的許思明在港口溪經歷「樣方偏了七公分」，也重新看見十九守在空衣架下睡了三天留下的影響。","m":"失落","f":"memories/2012-04-13-06-field.md","k":6,"arm":1,"ents":[20,21,74,3,4,62,22,12],"deg":9,"b":"2012-04-13，南方的光白得像鹽。31 歲的許思明正在經歷「十九守在空衣架下睡了三天」。她今天給自己的工作很簡單：重新擺正透明樣方，數完每一株貼地生長的植物，也把自己誤認的那一株寫進錯誤欄。\n\n現場有鐵鏽和九層塔混在一起的氣味。季穗決定不再回來住。她們沒有大吵，只花一下午分完鍋子、書和工具，最後誰也不肯拿那只藍邊搪瓷碗。今天的細節沒有因為比較忙就退到背景，它仍在每個動作裡留下重量。母親看了一眼，只說：『先吃飯，答案又不會跑。』\n\n她繞了一小段遠路才回到港口溪。路上沒有發生值得登上新聞的事，只有一戶人家在曬床單、兩個學生共撐一把傘，還有路邊一盆被風吹倒後又自己卡住的植物。恆春教她的不是慢，而是看風向調整力氣。硬撐有時很勇敢，有時只是不肯承認方法已經失效。\n\n關燈前，她在藍色簿子畫了一條歪線，旁邊寫：今天沒有解決世界，但把一個角落放回去了。","n":369},{"id":"d217","t":"零錢盒與月底｜空著的木衣架","d":"2012-05-01","y":2012.3333,"c":"work","s":"31 歲的許思明在鹹風標本室經歷「零錢盒與月底」，也重新看見十九守在空衣架下睡了三天留下的影響。","m":"自嘲","f":"memories/2012-05-01-07-money.md","k":4,"arm":1,"ents":[23,24,2,3,4,68,12],"deg":7,"b":"2012-05-01，南方的光白得像鹽。31 歲的許思明正在經歷「十九守在空衣架下睡了三天」。她今天給自己的工作很簡單：結算修理、蜜餞和田野工作的收入，發現最費力的項目仍然賺得最少，卻也是最捨不得取消的那一項。\n\n## 今日觀
